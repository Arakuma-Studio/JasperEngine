// apt's network settings in every build image (COPYed to /etc/apt/apt.conf.d/80-retries before the
// first apt-get): an archive that times out for a minute (PR #121's linux and unit jobs, run
// 44517381658) retries with growing pauses (apt's Acquire::Retries::Delay) instead of failing the
// image build. The timeout covers connecting and a stalled transfer.
Acquire::Retries "5";
Acquire::http::Timeout "60";
Acquire::https::Timeout "60";
