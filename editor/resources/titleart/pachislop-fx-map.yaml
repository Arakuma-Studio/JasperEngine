{
  "rules": [
    "camelCase keys become snake_case",
    "x/y pairs become one Vec2; rx/ry become radius",
    "generator angles are counter-clockwise (y-up) and negated (D16)",
    "a generator follow param becomes the layer follow member; companionOf groups become a visible Group \"<layer> FX\"",
    "preset ids become snake_case"
  ],
  "generators": [
