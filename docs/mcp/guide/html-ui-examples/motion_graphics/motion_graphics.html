<!DOCTYPE html>
<!-- Six seconds at 1080 x 1350. Attach MotionGraphicsUI.lua to this UI Document. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Diseño en movimiento</title>
  <link rel="stylesheet" href="motion_graphics.css">
</head>
<body>
  <svg id="starfield" class="starfield" viewBox="0 0 1080 1350" aria-hidden="true">
    <path id="stars" d="M0 0" fill="none" stroke="#b1bcce" stroke-width="1.4" opacity="0.42"></path>
  </svg>
  <main class="composition">
    <header class="eyebrow"><span class="dot"></span>JASPER / MOTION STUDIES / 001</header>
    <section class="title-block">
      <p class="edition">TIPOGRAFÍA / GEOMETRÍA / CÓDIGO</p>
      <h1 id="headline">Diseño en movimiento</h1>
      <p class="deck" id="deck">Un lienzo. Treinta fotogramas por segundo.<br>Infinitas formas de contar una idea.</p>
    </section>
    <section class="stage" aria-label="Animación de formas vectoriales">
      <svg id="geometry" viewBox="0 0 900 360" aria-hidden="true">
        <path id="orbit" d="M45 270 C180 100 310 345 445 215 S715 90 850 245" fill="none" stroke="#46566c" stroke-width="2" stroke-dasharray="5 8"></path>

        <path id="morph" d="M430 20 L485 75 L430 130 L375 75 Z" fill="#bdadff" stroke="#bdadff" stroke-width="2"></path>
        <path id="morph-target" d="M430 20 C505 20 505 130 430 130 C355 130 355 20 430 20 Z" fill="none" stroke="none"></path>
      </svg>
      <div id="follower" class="follower" aria-hidden="true"></div>
      <div class="stage-labels"><span>01 / DRAW</span><span>02 / MORPH</span><span>03 / FOLLOW</span></div>
    </section>
    <footer class="footer">
      <p class="signature">Hecho para<br><strong>mover ideas.</strong></p>
      <div class="take"><span>SEMILLA 2718</span><span>1080 × 1350 / 30 FPS / 6 S</span></div>
    </footer>
  </main>
</body>
</html>
