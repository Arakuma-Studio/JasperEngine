name: CI

# Every push builds the Linux-runner targets (Linux, Web, Android), which fit in
# the free tier. Windows and macOS runners bill at 2x and 10x, so they only run
# on demand: the "Run workflow" button, pull requests into main, v* tags, and
# published releases.
#
# The test jobs (unit, sanitizers, htmlui, e2e, web) run on every push and pull
# request, in the same Docker images and through the same tools/build.sh targets
# as the build servers, so a failure reproduces with one command (docs/testing.md).
# The branch protection of main requires all five. Slower suites run nightly
# (.github/workflows/nightly.yml).
on:
  push:
    # '**' and not '*': a single star stops at '/', so fix/x never builds.
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      check_release_tag:
        description: "Dry run of the release job's tag check against this tag (e.g. v1.2.3-bad)"
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: read
  actions: read

# One run per ref: a push while jobs are still going supersedes them. Releases
# are never cancelled, so a re-run cannot race the asset upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  EDITOR_TARGET: jasperengine-editor
  ENGINE_TARGET: jasperengine-project
  LAUNCHERS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

jobs:
  # ---------------------------------------------------------------- Tests ---
  # Each test job builds its image with the GitHub Actions layer cache, hands it to
  # tools/build.sh as JASPER_DOCKER_IMAGE, and keeps its ccache between runs.
  unit:
    name: Unit tests (GCC, warnings as errors)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JASPER_DOCKER_IMAGE: jasperengine/linux-build:ci
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build the Linux image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/linux.Dockerfile
          tags: jasperengine/linux-build:ci
          load: true
          cache-from: type=gha,scope=linux-image
          cache-to: type=gha,scope=linux-image,mode=max

      - uses: actions/cache@v4
        with:
          path: build/.cache/ccache
          key: ccache-unit-${{ github.sha }}
          restore-keys: ccache-unit-

      - name: Limit the compiler cache
        run: mkdir -p build/.cache/ccache && echo "max_size = 1.5G" > build/.cache/ccache/ccache.conf

      - name: Third-party notices
        run: python3 tools/ci/check-notices.py

      - name: Gate and notice checker self-tests
        run: |
          python3 tools/ci/test_gtest_gate.py
          python3 tools/ci/test_check_notices.py

      # AGENTS.md, CLAUDE.md and .claude/rules name paths and build targets that exist (S31 R27)
      - name: Contributor docs for agents
        run: python3 tools/check_agent_docs.py

      # docs/data-safety.md: every file write goes through AtomicFile (S03 AC9), and the
      # known-key tables of editor/StreamSchema.cpp list what each decoder reads (S03 AC12)
      - name: Data-safety lints
        run: |
          python3 tools/check_raw_writes.py --self-test
          python3 tools/check_raw_writes.py
          python3 tools/check_stream_keys.py

      - name: CMake presets and option errors
        run: tools/build.sh exec linux tools/ci/check-presets.sh

      - name: Build and run jasperengine-core-tests and jasperengine-editor-tests
        run: |
          set -o pipefail
          mkdir -p build/test-results
          WERROR=1 tools/build.sh unit-tests 2>&1 | tee build/test-results/unit-build.log

      - name: Warnings
        if: always()
        run: python3 tools/ci/warning-summary.py build/test-results/unit-build.log >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-unit
          path: build/test-results/**
          if-no-files-found: warn

  sanitizers:
    name: Unit tests (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      JASPER_DOCKER_IMAGE: jasperengine/linux-build:ci
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build the Linux image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/linux.Dockerfile
          tags: jasperengine/linux-build:ci
          load: true
          cache-from: type=gha,scope=linux-image
          cache-to: type=gha,scope=linux-image,mode=max

      - uses: actions/cache@v4
        with:
          path: build/.cache/ccache
          key: ccache-sanitizers-${{ github.sha }}
          restore-keys: ccache-sanitizers-

      - name: Limit the compiler cache
        run: mkdir -p build/.cache/ccache && echo "max_size = 1.5G" > build/.cache/ccache/ccache.conf

      # GPU suites included: the binaries run under Xvfb on Mesa (tools/sanitizers/lsan.supp)
      - name: Build and run the unit tests under ASan and UBSan
        run: SANITIZE=address,undefined tools/build.sh unit-tests

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-sanitizers
          path: build/test-results/**
          if-no-files-found: warn

  htmlui:
    name: HTML UI tests (OpenGL)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JASPER_DOCKER_IMAGE: jasperengine/linux-build:ci
      # the performance tests' targets on a shared 4-vCPU runner (compat/PerfFixtures.h)
      JASPER_HTMLUI_PERF_SLACK: '3'
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build the Linux image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/linux.Dockerfile
          tags: jasperengine/linux-build:ci
          load: true
          cache-from: type=gha,scope=linux-image
          cache-to: type=gha,scope=linux-image,mode=max

      - uses: actions/cache@v4
        with:
          path: build/.cache/ccache
          key: ccache-htmlui-${{ github.sha }}
          restore-keys: ccache-htmlui-

      - name: Limit the compiler cache
        run: mkdir -p build/.cache/ccache && echo "max_size = 1G" > build/.cache/ccache/ccache.conf

      - name: Build and run jasperengine-htmlui-tests
        run: tools/build.sh htmlui-tests

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-htmlui
          path: build/test-results/**
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-diffs-htmlui
          path: build/linux/htmlui-tests-glcore/tests/htmlui/htmlui-test-output/**
          if-no-files-found: ignore

  e2e:
    name: End to end (editor, MCP, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      JASPER_DOCKER_IMAGE: jasperengine/linux-build:ci
    steps:
      - uses: actions/checkout@v6
        with:
          # git describe for the editor version, as the packaging job
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Build the Linux image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/linux.Dockerfile
          tags: jasperengine/linux-build:ci
          load: true
          cache-from: type=gha,scope=linux-image
          cache-to: type=gha,scope=linux-image,mode=max

      - uses: actions/cache@v4
        with:
          path: build/.cache/ccache
          key: ccache-e2e-${{ github.sha }}
          restore-keys: ccache-e2e-

      - name: Limit the compiler cache
        run: mkdir -p build/.cache/ccache && echo "max_size = 1.5G" > build/.cache/ccache/ccache.conf

      - name: Build the editor and the engine sample project
        run: |
          set -o pipefail
          mkdir -p build/test-results
          WERROR=1 tools/build.sh linux 2>&1 | tee build/test-results/linux-build.log

      - name: Warnings
        if: always()
        run: python3 tools/ci/warning-summary.py build/test-results/linux-build.log >> "$GITHUB_STEP_SUMMARY"

      - name: Third-party notices in the install
        run: python3 tools/ci/check-notices.py --installed build/linux/editor-install/bin

      - name: Cooked-texture runtime size (S14 R21, native Release)
        run: python3 tools/textures/runtime_size.py --binary build/linux/engine/jasperengine-project --json build/test-results/texture-runtime-size.json

      - name: HTML UI editor tests
        run: tools/build.sh htmlui-editor-tests

      - name: MCP tests (the CI suite)
        run: MCP_SUITE=ci tools/build.sh mcp-tests -j 2

      - name: Smoke test (export, build, run; OpenGL)
        run: tools/smoke-test.sh tools/fixtures/post-processing

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-e2e
          path: build/test-results/**
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-e2e
          path: |
            build/smoke/*.png
            build/smoke/*.log
          if-no-files-found: ignore

  # ------------------------------------------------------------- Packages ---
  # Skipped on pull_request: the branch's push run already built the same
  # commit, and its checks show on the pull request.
  linux:
    name: Linux (editor + engine)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The container pins the glibc floor to 22.04 instead of the runner
    # image's. Moving it also moves the distros AppRun's refusal names.
    container: ubuntu:22.04
    timeout-minutes: 90
    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          # The workspace is bind-mounted from the host runner's user, so git
          # refuses to work in it as root until the path is marked safe.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v6
        with:
          # Full history so git describe can resolve vX.Y-N-gHASH like local builds.
          fetch-depth: 0

      - name: Install dependencies
        run: |
          # file is not a build dependency: appimagetool shells out to it.
          apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config python3 wget gpg file ccache \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libvulkan-dev \
            libwayland-dev wayland-protocols extra-cmake-modules \
            libdbus-1-dev
          # 22.04 ships CMake 3.22; the vendored glslang requires 3.27 or newer.
          wget -qO- https://apt.kitware.com/keys/kitware-archive-latest.asc \
            | gpg --dearmor -o /usr/share/keyrings/kitware-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ jammy main' \
            > /etc/apt/sources.list.d/kitware.list
          apt-get update
          apt-get install -y --no-install-recommends cmake
          cmake --version

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux
          max-size: 2G

      - name: Set version
        run: echo "JASPERENGINE_VERSION=$(git describe --tags --match 'v[0-9]*' --always --dirty)" >> "$GITHUB_ENV"

      # The portable C++20 subset (docs/specs/S01-cxx20.md, D7), the file pollers the watcher
      # replaced (S05 AC22), the compiler floors and the one-standard check of
      # engine/cmake/JasperEngineToolchain.cmake
      - name: Check C++ standard and toolchain rules
        run: |
          python3 tools/check-cxx-subset.py
          python3 tools/check-pollers.py --self-test
          python3 tools/check-pollers.py
          cmake -P tools/tests/check_toolchain_floor.cmake
          cmake -P tools/tests/cxx-standard-check/run.cmake

      - name: Build editor
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DJASPERENGINE_EDITOR_VERSION:STRING="$JASPERENGINE_VERSION" \
            -DCMAKE_INSTALL_PREFIX:PATH=instdir $LAUNCHERS
          cmake --build build --target "$EDITOR_TARGET"
          cmake --install build --strip

      - name: Build engine sample project
        run: |
          cmake -S engine -B build-engine -G Ninja -DCMAKE_BUILD_TYPE=Debug $LAUNCHERS
          cmake --build build-engine --target "$ENGINE_TARGET"

      - name: Package AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          # The AppDir is the same install tree under usr/: $ORIGIN and engine/
          # already resolve relative to the binary, so nothing moves.
          rm -rf AppDir && mkdir AppDir
          cp -a instdir AppDir/usr
          cp editor/resources/linux/jasperengine-editor.desktop AppDir/
          cp editor/resources/icons/linux/jasperengine-editor-512.png AppDir/jasperengine-editor.png

          # 22.04's libstdc++ is newer than older targets carry, and
          # JASPERENGINE_SHARED rules out -static-libstdc++: the editor and
          # libjasperengine.so would each get their own runtime.
          mkdir -p AppDir/usr/lib
          for lib in libstdc++.so.6 libgcc_s.so.1; do
            cp -L "$(gcc -print-file-name="$lib")" "AppDir/usr/lib/$lib"
          done

          # glibc cannot ride along the way libstdc++ can, so AppRun turns anything
          # older than these binaries were linked against away with a message.
          GLIBC_FLOOR="$(objdump -T AppDir/usr/bin/jasperengine-editor AppDir/usr/bin/libjasperengine.so \
            AppDir/usr/lib/libstdc++.so.6 AppDir/usr/lib/libgcc_s.so.1 \
            | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)"
          echo "glibc floor: $GLIBC_FLOOR"

          cat > AppDir/AppRun <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"

          # Highest GLIBCXX_3.4.N a libstdc++ carries. strings(1) is not a given on a
          # desktop, grep is.
          glibcxx_minor() {
            [ -r "$1" ] || return 1
            grep -ao 'GLIBCXX_3\.4\.[0-9][0-9]*' "$1" | sed 's/.*\.//' | sort -n | tail -1
          }

          # Only take over where the host's runtime is older: doing it everywhere would
          # hand the host's Mesa an older libstdc++ than it was built against. Ask the
          # loader where that copy is rather than guess at distro layouts.
          host_lib="$(LD_TRACE_LOADED_OBJECTS=1 "$HERE/usr/bin/jasperengine-editor" 2>/dev/null \
            | sed -n 's/.*libstdc++\.so\.6 => \([^ ]*\).*/\1/p')"
          bundled="$(glibcxx_minor "$HERE/usr/lib/libstdc++.so.6")"
          host="$(glibcxx_minor "$host_lib")"
          if [ -n "$bundled" ] && { [ -z "$host" ] || [ "$host" -lt "$bundled" ]; }; then
            LD_LIBRARY_PATH="$HERE/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            export LD_LIBRARY_PATH
          fi

          glibc="$(getconf GNU_LIBC_VERSION 2>/dev/null | awk '{print $NF}')"
          if [ -n "$glibc" ] && [ "$glibc" != "@GLIBC_FLOOR@" ] \
            && [ "$(printf '%s\n%s\n' "$glibc" "@GLIBC_FLOOR@" | sort -V | head -1)" = "$glibc" ]; then
            msg="JasperEngine needs glibc @GLIBC_FLOOR@ or newer, and this system has $glibc.
          Ubuntu 22.04 and Debian 12 are the oldest releases it runs on; older ones
          need a build from source."
            printf '%s\n' "$msg" >&2
            # Started from a launcher the message has nowhere to go, so it needs a
            # window. Closing a zenity dialog exits non-zero, so pick on what exists.
            if [ ! -t 2 ]; then
              if command -v zenity >/dev/null 2>&1; then zenity --error --no-wrap --text="$msg" 2>/dev/null
              elif command -v xmessage >/dev/null 2>&1; then xmessage -center "$msg" 2>/dev/null
              fi
            fi
            exit 1
          fi

          exec "$HERE/usr/bin/jasperengine-editor" "$@"
          APPRUN
          sed -i "s/@GLIBC_FLOOR@/$GLIBC_FLOOR/g" AppDir/AppRun
          chmod +x AppDir/AppRun

          # Pinned: "continuous" would put an unreviewed build of a tool that
          # repackages the editor into the release path.
          APPIMAGETOOL_VERSION=1.9.1
          APPIMAGETOOL_SHA256=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          wget -q -O appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          # ARCH is guessed from ELF files otherwise, and there is no FUSE here.
          # -u writes a .zsync so AppImageUpdate and Gear Lever can delta-update
          # from the release assets.
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir \
            -u "gh-releases-zsync|JasperRaccoon|JasperEngine|latest|JasperEngine-*-x86_64.AppImage.zsync" \
            "dist/JasperEngine-${JASPERENGINE_VERSION}-linux-x86_64.AppImage"

          # appimagetool writes the .zsync in the working directory, not beside the
          # AppImage, and -u embeds update info even if zsyncmake never ran.
          mv "JasperEngine-${JASPERENGINE_VERSION}-linux-x86_64.AppImage.zsync" dist/
          test -s "dist/JasperEngine-${JASPERENGINE_VERSION}-linux-x86_64.AppImage.zsync"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: jasperengine_linux
          path: ./instdir/bin/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: jasperengine_linux_appimage
          path: ./dist/*.AppImage
          if-no-files-found: error

      # Only AppImageUpdate and Gear Lever read this, and only off a release, so
      # it travels separately instead of in the download.
      - uses: actions/upload-artifact@v4
        with:
          name: jasperengine_linux_zsync
          path: ./dist/*.zsync
          if-no-files-found: error

  # ------------------------------------------------------------------ Web ---
  # The engine sample project built in the web image, then run in its headless
  # Chrome (tools/web/browser_gate.py): no console error, the ready line, the
  # centre pixel and cross-origin isolation as tools/web/gates/sample-project.json
  web:
    name: Web (Emscripten, browser gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JASPER_DOCKER_IMAGE: jasperengine/web-build:ci
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/web.Dockerfile
          tags: jasperengine/web-build:ci
          load: true
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,scope=web-image,mode=max

      - uses: actions/cache@v4
        with:
          path: build/.cache/ccache
          key: ccache-web-${{ github.sha }}
          restore-keys: ccache-web-

      - name: Limit the compiler cache
        run: mkdir -p build/.cache/ccache && echo "max_size = 1G" > build/.cache/ccache/ccache.conf

      - name: Web presets and option errors
        run: tools/build.sh exec web tools/ci/check-presets.sh web

      - name: Build engine sample project
        run: tools/build.sh web

      - name: Browser gate
        run: tools/build.sh web-gate

      - name: Build the core utilities gate project (logger, Lua Timer)
        run: WEB_PROJECT=core-utilities tools/build.sh web

      - name: Browser gate, core utilities
        run: GATE=core-utilities tools/build.sh web-gate

      - name: Build the cooked texture formats gate project (Release)
        run: BUILD_TYPE=Release WEB_PROJECT=texture-formats tools/build.sh web

      - name: Browser gate, cooked texture formats
        run: GATE=texture-formats tools/build.sh web-gate

      - name: Cooked-texture runtime size (S14 R21, wasm Release)
        run: |
          tools/build.sh exec web bash -c "cmake -S engine -B build/web-texture-formats -DCMAKE_EXE_LINKER_FLAGS=-Wl,--Map=/src/build/web-texture-formats.map && cmake --build build/web-texture-formats --target jasperengine-project"
          python3 tools/textures/runtime_size.py --wasm-map build/web-texture-formats.map --json build/test-results/texture-runtime-size-wasm.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-web
          path: build/test-results/**
          if-no-files-found: warn

  # -------------------------------------------------------------- Android ---
  android:
    name: Android
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android
          max-size: 2G

      - name: Build with Gradle
        working-directory: engine/workspaces/androidstudio
        # build.gradle forwards this to the native CMake build.
        env:
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: jasperengine_android_apk
          path: engine/workspaces/androidstudio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # -------------------------------------------------------------- Windows ---
  windows:
    name: Windows MSVC (editor + engine GL/Vulkan)
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' ||
      github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: jakoch/install-vulkan-sdk-action@v1.0.0
        with:
          vulkan_version: 1.3.296.0
          install_runtime: false
          cache: true

      # Ninja instead of the Visual Studio generator so ccache can wrap cl.exe.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows
          max-size: 2G
          variant: ccache

      - name: Set version
        run: echo "JASPERENGINE_VERSION=$(git describe --tags --match 'v[0-9]*' --always --dirty)" >> "$GITHUB_ENV"

      # JASPERENGINE_TESTS adds jasperengine-editor-tests and jasperengine-core-tests, run below
      # without their GPU suites (those run on Linux). The editor tree has its warnings on; the
      # engine tree gets them here, and the summary counts them (docs/testing.md, "Warnings").
      - name: Build editor
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DJASPERENGINE_EDITOR_VERSION:STRING="$JASPERENGINE_VERSION" -DJASPERENGINE_TESTS=ON \
            -DCMAKE_INSTALL_PREFIX:PATH=instdir $LAUNCHERS
          cmake --build build --target "$EDITOR_TARGET" "$EDITOR_TARGET-cmd" jasperengine-editor-tests 2>&1 | tee build-editor.log
          cmake --install build --strip

      # Release, not Debug: MSVC debug builds write PDBs, which ccache cannot cache.
      - name: Build engine sample project (OpenGL) and the core tests
        run: |
          set -o pipefail
          cmake -S engine -B build-engine-gl -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DJASPERENGINE_TESTS=ON -DJASPERENGINE_WARNINGS=ON $LAUNCHERS
          cmake --build build-engine-gl --target "$ENGINE_TARGET" jasperengine-core-tests 2>&1 | tee build-engine.log

      - name: Unit tests (CPU suites)
        run: |
          mkdir -p build/test-results
          status=0
          build-engine-gl/tests/core/jasperengine-core-tests.exe --gtest_filter=-*Gpu* \
            --gtest_output=xml:build/test-results/core-windows.xml || status=1
          build/jasperengine-editor-tests.exe --gtest_filter=-*Gpu* \
            --gtest_output=xml:build/test-results/editor-windows.xml || status=1
          python tools/ci/gtest-gate.py --xml build/test-results/core-windows.xml --max-skipped 0 || status=1
          python tools/ci/gtest-gate.py --xml build/test-results/editor-windows.xml --max-skipped 0 || status=1
          exit $status

      # jasperengine-editor call --help / --dry-run need no editor (S31 AC15)
      - name: Call CLI without an editor
        run: python tools/ci/check-call-cli.py instdir

      - name: Warnings
        if: always()
        run: python tools/ci/warning-summary.py build-editor.log build-engine.log >> "$GITHUB_STEP_SUMMARY"

      - name: Third-party notices in the install
        run: python tools/ci/check-notices.py --installed instdir/bin

      - name: Build engine sample project (Vulkan)
        run: |
          cmake -S engine -B build-engine-vk -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DGRAPHIC_BACKEND=vulkan $LAUNCHERS
          cmake --build build-engine-vk --target "$ENGINE_TARGET"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: build/test-results/**
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: jasperengine_windows
          path: ./instdir/bin/*
          if-no-files-found: error

  # ---------------------------------------------------------------- macOS ---
  # One job for everything Apple: the editor, the CMake engine build, and the
  # Xcode project for macOS and iOS. macOS minutes bill at 10x, so sharing the
  # checkout and toolchain setup across them is worth the longer job.
  macos:
    name: macOS + iOS (editor, engine, Xcode)
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' ||
      github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: brew install ninja

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos
          max-size: 2G

      - name: Set version
        run: echo "JASPERENGINE_VERSION=$(git describe --tags --match 'v[0-9]*' --always --dirty)" >> "$GITHUB_ENV"

      # JASPERENGINE_TESTS adds jasperengine-editor-tests, run below without its GPU suites
      - name: Build editor
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DJASPERENGINE_EDITOR_VERSION:STRING="$JASPERENGINE_VERSION" -DJASPERENGINE_TESTS=ON \
            -DCMAKE_INSTALL_PREFIX:PATH=instdir \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" $LAUNCHERS
          cmake --build build --target "$EDITOR_TARGET" jasperengine-editor-tests 2>&1 | tee build-editor.log
          cmake --install build --strip

      - name: Package the macOS app
        run: |
          set -uo pipefail

          APP="$(find instdir -maxdepth 4 -name '*.app' -type d | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::no .app found under instdir"
            find instdir | head -40
            exit 1
          fi
          echo "Bundle: $APP"

          # --strip invalidates the linker's ad-hoc signature, fatal on Apple Silicon.
          codesign --remove-signature "$APP" 2>/dev/null || true
          for dylib in "$APP"/Contents/MacOS/*.dylib; do
            [ -e "$dylib" ] && codesign --force --sign - --timestamp=none "$dylib"
          done
          if ! codesign --force --sign - --timestamp=none "$APP"; then
            echo "::error::codesign rejected the bundle"
            find "$APP" -maxdepth 3 | head -40
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$APP" || echo "::warning::strict verify failed"

          set -e
          # Loose tree for the zip: jasperengine-editor, libjasperengine.dylib, engine/.
          BIN="$APP/Contents/MacOS"
          mkdir -p dist/macos-zip
          cp "$BIN/$(basename "$APP" .app)" dist/macos-zip/jasperengine-editor
          for dylib in "$BIN"/*.dylib; do
            [ -e "$dylib" ] && cp "$dylib" dist/macos-zip/
          done
          if [ -d "$APP/Contents/Resources/engine" ]; then
            cp -R "$APP/Contents/Resources/engine" dist/macos-zip/engine
          elif [ -d "$BIN/engine" ]; then
            cp -R "$BIN/engine" dist/macos-zip/engine
          else
            echo "::error::no engine/ in the bundle"
            find "$APP" | head -40
            exit 1
          fi
          chmod +x dist/macos-zip/jasperengine-editor
          # the third-party notices the bundle carries in Resources
          cp "$APP/Contents/Resources/NOTICE.md" "$APP/Contents/Resources/LICENSE" dist/macos-zip/
          cp -R "$APP/Contents/Resources/licenses" dist/macos-zip/licenses
          for dylib in dist/macos-zip/*.dylib; do
            [ -e "$dylib" ] && codesign --force --sign - --timestamp=none "$dylib"
          done
          codesign --force --sign - --timestamp=none dist/macos-zip/jasperengine-editor

          # Artifact zips lose the executable bit, so ship a dmg too.
          mkdir dmg-stage
          cp -R "$APP" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "JasperEngine" -srcfolder dmg-stage -ov -format UDZO dist/JasperEngine.dmg
          rm -rf dmg-stage
          ls -la dist dist/macos-zip

      - name: Build engine sample project and the core tests
        run: |
          set -o pipefail
          cmake -S engine -B build-engine -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DJASPERENGINE_TESTS=ON -DJASPERENGINE_WARNINGS=ON $LAUNCHERS
          cmake --build build-engine --target "$ENGINE_TARGET" jasperengine-core-tests 2>&1 | tee build-engine.log

      - name: Unit tests (CPU suites)
        run: |
          mkdir -p build/test-results
          status=0
          build-engine/tests/core/jasperengine-core-tests --gtest_filter=-*Gpu* \
            --gtest_output=xml:build/test-results/core-macos.xml || status=1
          build/jasperengine-editor-tests --gtest_filter=-*Gpu* \
            --gtest_output=xml:build/test-results/editor-macos.xml || status=1
          python3 tools/ci/gtest-gate.py --xml build/test-results/core-macos.xml --max-skipped 0 || status=1
          python3 tools/ci/gtest-gate.py --xml build/test-results/editor-macos.xml --max-skipped 0 || status=1
          exit $status

      # jasperengine-editor call --help / --dry-run need no editor (S31 AC15)
      - name: Call CLI without an editor
        run: python3 tools/ci/check-call-cli.py dist/macos-zip/jasperengine-editor

      - name: Warnings
        if: always()
        run: python3 tools/ci/warning-summary.py build-editor.log build-engine.log >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-macos
          path: build/test-results/**
          if-no-files-found: ignore

      - name: Build Xcode project (macOS, iOS simulator)
        working-directory: engine/workspaces/xcode
        run: |
          /usr/bin/xcodebuild -version
          mkdir -p ../../../project/assets
          # -jobs 1: macos-latest / Xcode 26.x flakes with "CFLocale.h: Invalid
          # argument" under parallel compiles.
          for target in "macosx:JasperEngine macOS" "iphonesimulator:JasperEngine iOS"; do
            xcodebuild build -sdk "${target%%:*}" -project JasperEngine.xcodeproj \
              -configuration Debug -scheme "${target#*:}" -jobs 1
          done

      - uses: actions/upload-artifact@v4
        with:
          name: jasperengine_macos
          path: ./dist/macos-zip/*
          if-no-files-found: error

      # Separate artifacts so a download is one package, not both of them.
      - uses: actions/upload-artifact@v4
        with:
          name: jasperengine_macos_dmg
          path: ./dist/*.dmg
          if-no-files-found: error

  # -------------------------------------------------------------- Release ---
  # Artifacts are only ever served as zips, so a published release is what gives
  # a direct download.
  release:
    name: Attach binaries to the release
    if: github.event_name == 'release'
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # vX.Y[.Z], and git describe of the built commit is that tag: the version every binary
      # was stamped with (CMakeLists.txt), so nothing ships under another name
      - name: Check the release tag
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: tools/ci/check-release-tag.sh "$VERSION" "$GITHUB_SHA"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir release

          # The artifacts came through an Actions zip, which dropped the
          # executable bit the release archives ship with.
          chmod +x artifacts/jasperengine_linux/jasperengine-editor
          chmod +x artifacts/jasperengine_macos/jasperengine-editor

          (cd artifacts/jasperengine_windows && zip -qr "$GITHUB_WORKSPACE/release/JasperEngine-${VERSION}-windows-x64.zip" .)
          (cd artifacts/jasperengine_linux && zip -qr "$GITHUB_WORKSPACE/release/JasperEngine-${VERSION}-linux-x86_64.zip" .)
          (cd artifacts/jasperengine_macos && zip -qr "$GITHUB_WORKSPACE/release/JasperEngine-${VERSION}-macos-universal.zip" .)

          # The .zsync names the AppImage it belongs to, so the pair keeps the
          # filenames it was built with.
          cp artifacts/jasperengine_linux_appimage/* release/
          cp artifacts/jasperengine_linux_zsync/* release/
          cp artifacts/jasperengine_macos_dmg/JasperEngine.dmg "release/JasperEngine-${VERSION}-macos-universal.dmg"
          ls -la release
          # --clobber so re-running the workflow on a release replaces the assets.
          gh release upload "$VERSION" release/* --clobber --repo "$GITHUB_REPOSITORY"

  # The release job's tag check on demand ("Run workflow" with check_release_tag), to try it
  # against a tag without publishing a release
  release-tag-check:
    name: Release tag check (dry run)
    if: github.event_name == 'workflow_dispatch' && inputs.check_release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check the tag against the dispatched commit
        env:
          VERSION: ${{ inputs.check_release_tag }}
        run: tools/ci/check-release-tag.sh "$VERSION" "$GITHUB_SHA"
