name: CI
# EXPERIMENT (do not merge): cold build times of the unit test trees and the editor, with and without
# JASPERENGINE_UNITY_BUILD, on a 4-vCPU ubuntu-latest runner, ccache off.
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.target }} unity=${{ matrix.unity }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        target: [unit-core, unit-editor, editor]
        unity: ['0', '1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/image
        with:
          target: linux
      - name: Cold build
        env:
          UNITY: ${{ matrix.unity }}
          TARGET: ${{ matrix.target }}
        run: |
          start=$(date +%s)
          status=0
          case "$TARGET" in
              unit-core) CCACHE_DISABLE=1 RUN=0 UNIT_SUITE=core tools/build.sh unit-tests > build.log 2>&1 || status=$? ;;
              unit-editor) CCACHE_DISABLE=1 RUN=0 UNIT_SUITE=editor tools/build.sh unit-tests > build.log 2>&1 || status=$? ;;
              editor) CCACHE_DISABLE=1 SKIP_ENGINE=1 tools/build.sh linux > build.log 2>&1 || status=$? ;;
          esac
          secs=$(( $(date +%s) - start ))
          tail -30 build.log
          echo "RESULT target=$TARGET unity=$UNITY status=$status seconds=$secs" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
