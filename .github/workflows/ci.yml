name: CI
# an advisory run names the commit it tests; the next one plans from there (tools/ci/plan_lanes.py ADVISORY_TITLE)
run-name: ${{ inputs.advisory && format('Advisory tests of {0} at {1}', github.ref_name, github.sha) || '' }}

# The gate (docs/superpowers/specs/2026-11-12-ci-design.md). `changes` plans the lanes from the diff
# (tools/ci/plan_lanes.py over tools/check-changed); each lane runs one repository script, the same command
# a developer runs (its JASPER_CI_REPRO); `report` writes the PR comment; `Check` is the one required status.
#
# - pull_request: the planned lanes. merge_group: every lane but the ADVISORY_LANES ones, which cannot block
#   the merge, unit and HTML UI unfiltered, MCP planned over the group's diff. push to main: the build lanes,
#   to save the caches and plan inputs PRs restore; one push run at a time, the newest push waiting (GitHub
#   drops an older waiting one), and a push run steps aside when a newer push that builds lands within
#   ADMISSION_SECONDS. It dispatches the advisory run (workflow_dispatch with advisory): the tests of the
#   advisory lanes the queue left out, one advisory run at a time, the newest waiting, each over what
#   changed since the last one; its failures keep the advisory-red issue open.
#   workflow_dispatch with full: everything, the whole MCP CI suite included, on any branch.
# - The test lanes in ADVISORY_LANES report but do not fail Check until main is green through CI (D2, §14.1
#   phase 7); the merge queue does not run them (tools/ci/plan_lanes.py --advisory). Lint and every platform
#   build lane block.
# - Caches (§10.2): PRs and the queue restore; push to main saves, and the caches job keeps one entry each.
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run every lane (the merge queue's set plus the whole MCP CI suite)
        type: boolean
        default: false
      advisory:
        description: Run only the advisory lanes' tests the merge queue leaves out (a push to main dispatches it)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number)
    || github.event_name == 'merge_group' && format('ci-mq-{0}', github.ref)
    || github.event_name == 'push' && 'ci-main-push'
    || inputs.advisory && format('ci-advisory-{0}', github.ref)
    || format('ci-dispatch-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # the test lanes whose failures Check lists but does not fail on (D2); emptied in phase 7
  ADVISORY_LANES: "unit asan htmlui mcp smoke windows-editor-tests"
  # a push to main waits this long before it takes the build runners, so a newer push (merge-queue groups
  # land 1-4 min apart: 3 of 20 gaps, 2026-11-15..20) supersedes it first (tools/ci/plan_lanes.py --newest)
  ADMISSION_SECONDS: 300
  # main's stages after the merge queue (push, advisory run) repeat no check the queue ran
  MAIN_STAGE: ${{ github.event_name == 'push' || inputs.advisory == true }}
  # every compile error of a run, not the first one (tools/build.sh and tools/ci/platform-common.sh)
  KEEP_GOING: 1
  # no precompiled headers (tools/build.sh, tools/ci/macos.sh): a GCC one is not the same bytes twice, so
  # a lost ccache entry of it misses every unit built on it; warm builds are faster without
  JASPERENGINE_PCH: "OFF"
  # line tables only where a build has debug information (engine/cmake/JasperDebugInfo.cmake; tools/build.sh,
  # tools/smoke-test.sh and CMake's own default pass it on): backtraces and sanitizer reports keep each
  # frame's function and file:line, and the objects, so the ccache entries, are a fraction of the size
  # (MSVC has no such level: Windows keeps /Z7). build-release.yml's editors and players, local builds and
  # users' exported games keep full debug information
  JASPERENGINE_DEBUG_INFO: lines

defaults:
  run:
    # bash -eo pipefail on every OS (Git Bash on Windows)
    shell: bash

jobs:
  # timeouts fit a cold build (an image change or an evicted ccache) on a 4-vCPU runner, not a warm one;
  # free-disk's need is the lane's measured use of / plus a quarter and 10 GB (docs/testing.md "Job setup")
  # ------------------------------------------------------------- Planning ---
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write  # push, advisory: the earlier runs (gh run list); push: dispatches the advisory run
    env:
      JASPER_CI_REPRO: python3 tools/ci/plan_lanes.py
    outputs:
      full: ${{ steps.plan.outputs.full }}
      run_lint: ${{ steps.plan.outputs.run_lint }}
      run_linux: ${{ steps.plan.outputs.run_linux }}
      run_unit: ${{ steps.plan.outputs.run_unit }}
      run_asan: ${{ steps.plan.outputs.run_asan }}
      run_htmlui: ${{ steps.plan.outputs.run_htmlui }}
      run_mcp: ${{ steps.plan.outputs.run_mcp }}
      run_smoke: ${{ steps.plan.outputs.run_smoke }}
      run_web: ${{ steps.plan.outputs.run_web }}
      run_android: ${{ steps.plan.outputs.run_android }}
      run_windows: ${{ steps.plan.outputs.run_windows }}
      run_macos: ${{ steps.plan.outputs.run_macos }}
      run_ios: ${{ steps.plan.outputs.run_ios }}
      unit_run_core: ${{ steps.plan.outputs.unit_run_core }}
      unit_run_editor: ${{ steps.plan.outputs.unit_run_editor }}
      unit_jobs: ${{ steps.plan.outputs.unit_jobs }}
      asan_jobs: ${{ steps.plan.outputs.asan_jobs }}
      asan_filter_core: ${{ steps.plan.outputs.asan_filter_core }}
      asan_filter_editor: ${{ steps.plan.outputs.asan_filter_editor }}
      unit_filter_core: ${{ steps.plan.outputs.unit_filter_core }}
      unit_filter_editor: ${{ steps.plan.outputs.unit_filter_editor }}
      htmlui_filter: ${{ steps.plan.outputs.htmlui_filter }}
      mcp_shards: ${{ steps.plan.outputs.mcp_shards }}
      build_only: ${{ steps.plan.outputs.build_only }}
      dispatch_advisory: ${{ steps.plan.outputs.dispatch_advisory }}
    steps:
      - name: Start
        run: echo "JASPER_CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      # every commit and tag but no blobs until read: the merge base and the coverage map's commit resolve
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # plan inputs from main: the Ninja deps dumps (push to main) and the MCP coverage map (nightly) from
      # the ci-plan-inputs data branch, which no cache eviction reaches (tools/ci/plan_inputs.py); the
      # per-test seconds from the cache. A missing one widens its lane (fail open).
      - name: Fetch the plan inputs
        run: python3 tools/ci/plan_inputs.py fetch --out build/ci-inputs
      - name: Restore the MCP test seconds
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci-inputs/mcp-test-seconds.json
          key: mcp-timings-${{ github.run_id }}
          restore-keys: mcp-timings-

      # plan_lanes.py lists the MCP suite with run_tests.py --list, which runs under uv (64 tests are made at run time)
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Plan the lanes
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          ADVISORY_RUN: ${{ inputs.advisory }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          # the selection's rollback: a repository variable set to true runs every test of every lane
          FULL_SELECTION: ${{ vars.CI_FULL_SELECTION }}
        run: |
          case "$EVENT" in
              # the checked-out merge commit: base..HEAD is exactly the PR, and no scratch checkout is needed
              pull_request) event=pull_request base="$PR_BASE" head="$(git rev-parse HEAD)" ;;
              merge_group) event=merge_group base="$MQ_BASE" head="$MQ_HEAD" ;;
              push) event=push base="$PUSH_BEFORE" head="$GITHUB_SHA" ;;
              *)
                  event=workflow_dispatch
                  [[ "$ADVISORY_RUN" == true ]] && event=advisory
                  [[ "$FULL" == true ]] && event=full
                  base="$(git merge-base origin/main HEAD)" head="$GITHUB_SHA" ;;
          esac
          args=(--event "$event" --base "$base" --head "$head" --out-dir build/ci-plan --github-output "$GITHUB_OUTPUT"
                --advisory "$ADVISORY_LANES")
          [[ -d build/ci-inputs/deps ]] && args+=(--deps-from build/ci-inputs/deps)
          [[ -f build/ci-inputs/coverage-map.json ]] && args+=(--coverage-map build/ci-inputs/coverage-map.json)
          [[ -f build/ci-inputs/mcp-test-seconds.json ]] && args+=(--test-seconds build/ci-inputs/mcp-test-seconds.json)
          [[ -f build/ci-inputs/manifest.json ]] && args+=(--inputs-manifest build/ci-inputs/manifest.json)
          [[ "$FULL_SELECTION" == true ]] && args+=(--full-selection)
          if [[ "$event" == push ]]; then
              # the admission delay: a newer push that builds supersedes this one before it takes a runner
              sleep "$ADMISSION_SECONDS"
              git fetch -q origin "$GITHUB_REF" && args+=(--newest "$(git rev-parse FETCH_HEAD)")
          fi
          if [[ "$event" == push || "$event" == advisory ]]; then
              # planned against the last run of its kind that finished (a waiting one a newer one replaced never ran)
              gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$GITHUB_REF_NAME" --event "$EVENT" --limit 50 \
                  --json databaseId,headSha,status,conclusion,createdAt,displayTitle > "$RUNNER_TEMP/runs.json" \
                  && args+=(--previous-runs "$RUNNER_TEMP/runs.json" --run-id "$GITHUB_RUN_ID")
          fi
          tools/ci/logged.sh plan "python3 tools/ci/plan_lanes.py $(printf '%q ' "${args[@]}")"

      # what each test lane runs and why (owner, dependency, policy, smoke; a whole suite: full or fallback)
      - name: Test selection
        if: always()
        run: |
          if [[ -f build/ci-plan/selection.md ]]; then cat build/ci-plan/selection.md >> "$GITHUB_STEP_SUMMARY"; fi

      # main's second stage, in a run of its own (concurrency ci-advisory-<ref>: one at a time, the newest
      # waiting) so the push's builds and cache saves never wait for its 4.5 h
      - name: Dispatch the advisory run
        if: steps.plan.outputs.dispatch_advisory == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
              gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f advisory=true && exit 0
              sleep $((attempt * 20))
          done
          exit 1

      # lanes.json at the artifact's root
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: plan
          path: build/ci-plan/
          retention-days: 14
          if-no-files-found: warn

      - uses: ./.github/actions/report
        if: always()
        with:
          lane: changes
          status: ${{ job.status }}

  # ----------------------------------------------------------------- Lint ---
  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.run_lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JASPER_CI_REPRO: tools/ci/lint.sh
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Start
        run: echo "JASPER_CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # downloads go through tools/ci/retry.sh: a one-off network failure is not a red lane
      - name: Install actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          tools/ci/retry.sh curl -fsSLo "$RUNNER_TEMP/actionlint/actionlint.tar.gz" \
              "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP/actionlint"
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint

      - name: Lints and self-tests
        run: tools/ci/logged.sh lint "tools/ci/lint.sh --actionlint $RUNNER_TEMP/actionlint/actionlint"

      - uses: ./.github/actions/report
        if: always()
        with:
          lane: lint
          status: ${{ job.status }}

  # ---------------------------------------------------------------- Linux ---
  # The editor and the engine sample project, warnings as errors; the install is the artifact the mcp
  # and smoke lanes run.
  linux:
    name: linux
    needs: changes
    if: needs.changes.outputs.run_linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      actions: write  # ccache-save deletes the lane's older entry as soon as it saved the new one (push)
    env:
      JASPER_CI_REPRO: WERROR=1 tools/build.sh linux
    steps:
      - name: Start
        run: echo "JASPER_CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/free-disk
        with:
          need: 30
      - uses: ./.github/actions/image
        id: image
        with:
          target: linux
      - uses: ./.github/actions/ccache-restore
        with:
          lane: linux
          max-size: 0.95G
          toolchain: ${{ steps.image.outputs.tag }}

      - name: Build the editor and the engine sample project
        run: tools/ci/logged.sh linux-build 'WERROR=1 tools/build.sh linux'

      - name: Warnings
        if: always()
        run: |
          if [[ -f build/test-results/linux-build.log ]]; then
              python3 tools/ci/warning-summary.py build/test-results/linux-build.log >> "$GITHUB_STEP_SUMMARY"
          fi

      # tar keeps the executable bits a zipped artifact loses; the folders the install copies unchanged
      # from the checkout stay out (half the bytes): mcp and smoke check out the same commit
      - name: Pack the editor install
        run: tools/ci/editor_install.sh pack build/linux/editor-install build/editor-install.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-install
          path: build/editor-install.tar.zst
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Third-party notices in the install
        if: env.MAIN_STAGE != 'true'
        run: tools/ci/logged.sh linux-notices 'python3 tools/ci/check-notices.py --installed build/linux/editor-install/bin'

      - name: MCP tool and guide budget
        if: env.MAIN_STAGE != 'true'
        run: >-
          tools/ci/logged.sh linux-tool-budget 'tools/build.sh exec linux dbus-run-session --
          uv run --no-project --with-requirements tools/mcp/requirements.txt python tools/mcp/tool_budget.py
          --check tools/mcp/budget.json'

      - name: Cooked-texture runtime size (S14 R21, native Release)
        if: env.MAIN_STAGE != 'true'
        run: >-
          tools/ci/logged.sh linux-texture-runtime-size 'python3 tools/textures/runtime_size.py
          --binary build/linux/engine/jasperengine-project --json build/test-results/texture-runtime-size.json'

      # in the editor tree just built (build/linux/editor); main's stages build them for the cache only
      - name: HTML UI editor tests
        env:
          BUILD_ONLY: ${{ env.MAIN_STAGE == 'true' && 'RUN=0 ' || '' }}
        run: tools/ci/logged.sh htmlui-editor "${BUILD_ONLY}WERROR=1 tools/build.sh htmlui-editor-tests"

      - uses: ./.github/actions/ccache-save
        if: always()
        with:
          lane: linux
          prune: 'true'
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: linux
          status: ${{ job.status }}

  # ----------------------------------------------------------------- Unit ---
  # One job per test binary, side by side, the editor's in two parts (tools/ci/plan_lanes.py UNIT_PARTS):
  # its build is most of its time (runs 43737549764 and 43773511699: 110 and 137 of 123 and 141 min).
  # Each part compiles half the objects and uploads them as ccache files, takes the other part's
  # (tools/ci/unit_split.py wait: it compiles them itself when that part has not started, failed or is
  # slower), links, and runs half the suites. The first part (the lead) saves the cache on push.
  unit:
    name: unit (${{ matrix.job }})
    needs: changes
    if: needs.changes.outputs.run_unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      # the parts look for each other's artifact and job (tools/ci/unit_split.py wait); ccache-save deletes
      # the lane's older entry as soon as it saved the new one (push)
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.unit_jobs) }}
    env:
      JASPER_CI_REPRO: ${{ matrix.part && format('UNIT_SHARD={0} ', matrix.part) || '' }}UNIT_SUITE=${{ matrix.suite }} WERROR=1 tools/build.sh unit-tests
      UNIT_LEAD: ${{ matrix.part == '' || startsWith(matrix.part, '1/') }}
      # false on a push to main that builds only (the merge queue ran the tests)
      UNIT_TESTS: ${{ !contains(fromJSON(needs.changes.outputs.build_only), 'unit') }}
    steps:
      - name: Start
        run: echo "JASPER_CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/free-disk
        with:
          need: 60
      - uses: ./.github/actions/image
        id: image
        with:
          target: linux
      # an entry per binary (docs/testing.md "CI"), both editor parts restoring the editor's
      - uses: ./.github/actions/ccache-restore
        with:
          lane: unit-${{ matrix.suite }}
          max-size: ${{ matrix.suite == 'core' && '0.4G' || '0.85G' }}
          toolchain: ${{ steps.image.outputs.tag }}

      - name: CMake presets and option errors
        if: env.UNIT_TESTS == 'true' && matrix.suite == 'core'
        run: tools/ci/logged.sh unit-presets 'tools/build.sh exec linux tools/ci/check-presets.sh'

      # a part: this part's objects, as the ccache files they added, for the other part. Only a speed-up:
      # when it fails, the build below compiles what it lacks (and fails the job on a real error)
      - name: Compile part ${{ matrix.part }} of the objects
        if: matrix.part != ''
        continue-on-error: true
        env:
          SUITE: ${{ matrix.suite }}
          PART: ${{ matrix.part }}
        run: |
          echo "JASPER_PART_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          python3 -I tools/ci/unit_split.py snapshot --ccache build/.cache/ccache --out "$RUNNER_TEMP/unit-part-before.json"
          tools/ci/logged.sh "unit-$SUITE-part" "UNIT_BUILD_PART=$PART UNIT_SUITE=$SUITE WERROR=1 tools/build.sh unit-tests"
      - name: Pack the part's objects
        id: pack
        if: ${{ !cancelled() && matrix.part != '' }}
        continue-on-error: true
        env:
          SUITE: ${{ matrix.suite }}
        run: >-
          python3 -I tools/ci/unit_split.py pack --ccache build/.cache/ccache --before "$RUNNER_TEMP/unit-part-before.json"
          --out build/unit-part.tar --objects "build/linux/$SUITE-tests/unit-build-part.txt" --github-output "$GITHUB_OUTPUT"
      # already zstd inside; the other part's job takes it within the run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && matrix.part != '' }}
        continue-on-error: true
        with:
          name: unit-${{ matrix.job }}-ccache
          path: build/unit-part.tar
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - name: Wait for part ${{ matrix.other }}'s objects
        id: other
        if: ${{ !cancelled() && matrix.part != '' && (github.event_name != 'push' || env.UNIT_LEAD == 'true') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: unit-${{ matrix.suite }}-${{ matrix.other }}-ccache
          JOB: unit (${{ matrix.suite }}-${{ matrix.other }})
          RESULTS: ${{ steps.pack.outputs.results }}
          OBJECTS: ${{ steps.pack.outputs.objects }}
        run: >-
          python3 -I tools/ci/unit_split.py wait --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --artifact "$ARTIFACT" --job "$JOB" --started "${JASPER_PART_STARTED:-0}" --results "${RESULTS:-0}" --objects "${OBJECTS:-0}"
          --github-output "$GITHUB_OUTPUT"
      # a failed download leaves the other part's objects to this job's build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.other.outputs.found == 'true'
        continue-on-error: true
        with:
          name: unit-${{ matrix.suite }}-${{ matrix.other }}-ccache
          path: build/unit-other
      # -m: extracted now, so ccache-save counts them as this run's
      - name: Add part ${{ matrix.other }}'s objects to the cache
        if: steps.other.outputs.found == 'true'
        continue-on-error: true
        run: |
          if [[ -f build/unit-other/unit-part.tar ]]; then
              tar -m -C build/.cache/ccache -xf build/unit-other/unit-part.tar && rm -rf build/unit-other
          else
              echo "no download: this job compiles part ${{ matrix.other }}'s objects"
          fi

      # the planned suites with their filter ('' = all), a part's shard of them; a push builds the tree
      # for the cache and the deps dumps (its second part only compiles its objects for the first)
      - name: jasperengine-${{ matrix.suite }}-tests
        # under the job's limit: a step past its own timeout fails (advisory), where the job's timeout
        # cancels it, and Check counts a cancelled lane red even while it is advisory
        timeout-minutes: 240
        if: github.event_name != 'push' || env.UNIT_LEAD == 'true'
        env:
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.part }}
          # both, chosen below: `suite == 'core' && core || editor` yields the editor's filter whenever
          # core's is empty, which means "every core test"
          FILTER_CORE: ${{ needs.changes.outputs.unit_filter_core }}
          FILTER_EDITOR: ${{ needs.changes.outputs.unit_filter_editor }}
          BUILD_ONLY: ${{ github.event_name == 'push' && 'RUN=0 ' || '' }}
        run: |
          filter_var="FILTER_${SUITE^^}"
          FILTER="${!filter_var}"
          args=""
          [[ -n "$FILTER" ]] && args="UNIT_TEST_ARGS=$(printf %q "--gtest_filter=$FILTER") "
          [[ -n "$SHARD" ]] && args="UNIT_SHARD=$SHARD $args"
          tools/ci/logged.sh "unit-$SUITE" "${BUILD_ONLY}UNIT_SUITE=$SUITE ${args}WERROR=1 tools/build.sh unit-tests"

      # plan inputs for PRs (tools/ci/plan_lanes.py --deps-from): the plan-inputs job publishes them
      - name: Ninja deps dumps
        if: github.event_name == 'push' && env.UNIT_LEAD == 'true'
        run: tools/ci/logged.sh deps-dump 'tools/ci/dump_deps.sh build/ci-deps'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && env.UNIT_LEAD == 'true'
        with:
          name: deps-unit-${{ matrix.suite }}
          path: build/ci-deps/
          retention-days: 1
          if-no-files-found: error

      # S26 AC2: the picking suites again on the scalar slab test (the run above took the CPU's AVX2);
      # its XML goes beside the core run's instead of over it
      - name: Picking on the scalar path
        if: ${{ !cancelled() && env.UNIT_TESTS == 'true' && matrix.suite == 'core' }}
        run: |
          [[ -f build/test-results/core.xml ]] && mv build/test-results/core.xml build/test-results/core.main.xml
          status=0
          tools/ci/logged.sh unit-picking-scalar "JASPER_PICK_SIMD=scalar UNIT_SUITE=core UNIT_TEST_ARGS='--gtest_filter=MeshBvh.*:SceneBvh.*:MeshRaycast.*:PickCache.*' WERROR=1 tools/build.sh unit-tests" || status=1
          [[ -f build/test-results/core.xml ]] && mv build/test-results/core.xml build/test-results/core-picking-scalar.xml
          [[ -f build/test-results/core.main.xml ]] && mv build/test-results/core.main.xml build/test-results/core.xml
          exit "$status"

      - name: Warnings
        if: always()
        run: |
          for log in "build/test-results/unit-${{ matrix.suite }}-part.log" "build/test-results/unit-${{ matrix.suite }}.log"; do
              [[ -f "$log" ]] && python3 tools/ci/warning-summary.py "$log" >> "$GITHUB_STEP_SUMMARY"
          done
          true

      # one entry per binary: the lead's build holds both parts' objects
      - uses: ./.github/actions/ccache-save
        # the lead of each suite only (both editor parts hold the same objects)
        if: always() && env.UNIT_LEAD == 'true'
        with:
          lane: unit-${{ matrix.suite }}
          prune: 'true'
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: unit-${{ matrix.job }}
          status: ${{ job.status }}

  # One job per test binary, side by side (tools/ci/plan_lanes.py asan_jobs), as the unit lane: in one
  # job a cold core build (79-116 min), the core tests (90) and the editor's build (168-175) left the
  # editor tests no time in 270 min (merge-queue runs 44582666848, 44487933891, 44416194181). Each keeps
  # a ccache entry (docs/testing.md "CI"), so a push to main builds them (build only); while advisory,
  # the advisory run runs their tests.
  asan:
    name: asan (${{ matrix.job }})
    needs: changes
    if: needs.changes.outputs.run_asan == 'true'
    runs-on: ubuntu-latest
    # the editor's cold build and its tests (50-95 min, estimated)
    timeout-minutes: 330
    permissions:
      contents: read
      actions: write  # ccache-save deletes the lane's older entry as soon as it saved the new one (push)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.asan_jobs) }}
    env:
      JASPER_CI_REPRO: SANITIZE=address,undefined UNIT_SUITE=${{ matrix.suite }} tools/build.sh unit-tests
    steps:
      - name: Start
        run: echo "JASPER_CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/free-disk
        with:
          need: 80
      - uses: ./.github/actions/image
        id: image
        with:
          target: linux
      # editor: ccache 4.5 cuts each of its 16 subdirectories to 80 % of a sixteenth of the cap once over
      # that sixteenth, so the cap is 16 times the largest one with headroom, not the set's size: the
      # whole build's 1.58 GB had one of 123 MB, and 1.7G dropped 415 of its 7,721 entries (docs/testing.md "CI")
      - uses: ./.github/actions/ccache-restore
        with:
          lane: asan-${{ matrix.suite }}
          max-size: ${{ matrix.suite == 'core' && '0.8G' || '2.2G' }}
          toolchain: ${{ steps.image.outputs.tag }}
      # GPU suites included: they run under Xvfb on Mesa (tools/sanitizers/lsan.supp); the unit lane's filters,
      # or none when the lane's own settings changed (tools/ci/plan_lanes.py asan_filter)
      - name: jasperengine-${{ matrix.suite }}-tests under ASan and UBSan
        # under the job's limit: a step past its own timeout fails (an advisory failure), where the job's
        # timeout cancels it, and Check counts a cancelled lane as red even while it is advisory
        timeout-minutes: 300
        env:
          SUITE: ${{ matrix.suite }}
          FILTER_CORE: ${{ needs.changes.outputs.asan_filter_core }}
          FILTER_EDITOR: ${{ needs.changes.outputs.asan_filter_editor }}
          # a push to main that only builds (the merge queue ran the tests): the cache
          BUILD_ONLY: ${{ contains(fromJSON(needs.changes.outputs.build_only), 'asan') && 'RUN=0 ' || '' }}
        run: |
          filter="FILTER_${SUITE^^}"
          # the *GpuSlow suites (docs/testing.md Naming: over 5 min a test under ASan) run in the nightly
          # under ASan; the unit lane runs them as they are
          f="${!filter}"
          [[ -n "$f" ]] || f="*"
          if [[ "$f" == *-* ]]; then f="$f:*GpuSlow*"; else f="$f-*GpuSlow*"; fi
          tools/ci/logged.sh "asan-$SUITE" "${BUILD_ONLY}SANITIZE=address,undefined UNIT_SUITE=$SUITE UNIT_TEST_ARGS=$(printf %q "--gtest_filter=$f") tools/build.sh unit-tests"

      - uses: ./.github/actions/ccache-save
        if: always()
        with:
          lane: asan-${{ matrix.suite }}
          prune: 'true'
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: asan-${{ matrix.job }}
          status: ${{ job.status }}

  htmlui:
    name: htmlui
    needs: changes
    if: needs.changes.outputs.run_htmlui == 'true'
    runs-on: ubuntu-latest
    # a cold build (an image change, a lost entry) and the tests ran past 240
    timeout-minutes: 330
    permissions:
      contents: read
      actions: write  # ccache-save deletes the lane's older entry as soon as it saved the new one (push)
    env:
      JASPER_CI_REPRO: JASPER_HTMLUI_PERF_SLACK=3 tools/build.sh htmlui-tests
    steps:
      - name: Start
        run: echo "JASPER_CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/free-disk
        with:
          need: 30
      - uses: ./.github/actions/image
        id: image
        with:
          target: linux
      # a Release tree of 2,176 compiles: 0.78 GB of ccache with line tables only, 28-36 min cold
      - uses: ./.github/actions/ccache-restore
        with:
          lane: htmlui
          max-size: 0.85G
          toolchain: ${{ steps.image.outputs.tag }}
      # the performance tests' targets on a shared 4-vCPU runner (compat/PerfFixtures.h)
      - name: jasperengine-htmlui-tests (OpenGL)
        # under the job's limit: a step past its own timeout fails (advisory), where the job's timeout
        # cancels it, and Check counts a cancelled lane red even while it is advisory
        timeout-minutes: 300
        env:
          FILTER: ${{ needs.changes.outputs.htmlui_filter }}
          BUILD_ONLY: ${{ github.event_name == 'push' && 'RUN=0 ' || '' }}
        run: |
          args=""
          [[ -n "$FILTER" ]] && args="HTMLUI_TEST_ARGS=$(printf %q "--gtest_filter=$FILTER") "
          tools/ci/logged.sh htmlui "${BUILD_ONLY}JASPER_HTMLUI_PERF_SLACK=3 ${args}tools/build.sh htmlui-tests"

      - name: Ninja deps dumps
        if: github.event_name == 'push'
        run: tools/ci/logged.sh deps-dump 'tools/ci/dump_deps.sh build/ci-deps'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: deps-htmlui
          path: build/ci-deps/
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: golden-diffs-htmlui
          path: build/linux/htmlui-tests-glcore/tests/htmlui/htmlui-test-output/
          retention-days: 14
          if-no-files-found: ignore

      - uses: ./.github/actions/ccache-save
        if: always()
        with:
          lane: htmlui
          prune: 'true'
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: htmlui
          status: ${{ job.status }}

  # ------------------------------------------------------------------ MCP ---
  # One job per shard of the planned CI-suite files (tools/mcp/shard.py plans, in changes); none planned
  # skips the job instead of expanding an empty matrix.
  mcp:
    name: mcp (${{ matrix.shard }})
    needs: [changes, linux]
    if: >-
      needs.changes.outputs.run_mcp == 'true'
      && needs.changes.outputs.mcp_shards != ''
      && needs.changes.outputs.mcp_shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.mcp_shards) }}
    env:
      JASPER_CI_REPRO: tools/ci/mcp_shard.sh ${{ matrix.shard }} build/ci-plan
    steps:
      - name: Start
        run: echo "JASPER_CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      # the tested commit's parents too: test_docs.py's title golden ledger compares the merge commit
      # with its first parent, the base (tools/titleart/check_golden_ledger.py)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: ./.github/actions/free-disk
        with:
          need: 20
      - uses: ./.github/actions/image
        with:
          target: linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: editor-install
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: build/ci-plan
      - name: Unpack the editor install
        run: tools/ci/editor_install.sh unpack build/editor-install.tar.zst build/linux

      - name: MCP shard ${{ matrix.shard }}
        # under the job's limit: a step past its own timeout fails (advisory), where the job's timeout
        # cancels it, and Check counts a cancelled lane red even while it is advisory
        timeout-minutes: 160
        env:
          SHARD: ${{ matrix.shard }}
        run: tools/ci/logged.sh "mcp-shard-$SHARD" "tools/ci/mcp_shard.sh $SHARD build/ci-plan"

      - uses: ./.github/actions/report
        if: always()
        with:
          lane: mcp-${{ matrix.shard }}
          status: ${{ job.status }}

  # ---------------------------------------------------------------- Smoke ---
  # Games built end to end (G2): Compile builds of two fixtures, a prebuilt-player build of another, and
  # a project from each template, exported, run and opened in the editor.
  smoke:
    name: smoke
    needs: [changes, linux]
    if: needs.changes.outputs.run_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      actions: write  # ccache-save deletes the lane's older entry as soon as it saved the new one (push)
    env:
      JASPER_CI_REPRO: |-
        SMOKE_METHOD=compile SMOKE_DIR=build/smoke-post-processing tools/smoke-test.sh tools/fixtures/post-processing
        SMOKE_METHOD=compile SMOKE_DIR=build/smoke-ecs-collision tools/smoke-test.sh tools/fixtures/ecs-collision
        PLAYER_VARIANTS=full PLAYER_BACKENDS=glcore PLAYER_FLAVOURS=release tools/build.sh players
        SMOKE_METHOD=prebuilt SMOKE_DIR=build/smoke-unified-lighting tools/smoke-test.sh tools/fixtures/unified-lighting
        SMOKE_METHOD=prebuilt tools/ci/smoke-templates.sh
    steps:
      - name: Start
        run: echo "JASPER_CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/free-disk
        with:
          need: 55
      # the no-compiler image of the prebuilt builds, then the build image (the last sets JASPER_DOCKER_IMAGE)
      - uses: ./.github/actions/image
        with:
          target: runtime
      - uses: ./.github/actions/image
        id: image
        with:
          target: linux
      # the player runtime and the two Compile builds (tools/smoke-test.sh mounts the same directory): 1.9 GB,
      # of which what is left of the budget keeps the last-used part, the second Compile build (docs/testing.md "CI")
      - uses: ./.github/actions/ccache-restore
        with:
          lane: smoke
          max-size: 0.5G
          toolchain: ${{ steps.image.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: editor-install
          path: build
      - name: Unpack the editor install
        id: install
        run: tools/ci/editor_install.sh unpack build/editor-install.tar.zst build/linux

      - name: Player runtime (Linux, OpenGL, full, release)
        id: players
        run: tools/ci/logged.sh smoke-players 'PLAYER_VARIANTS=full PLAYER_BACKENDS=glcore PLAYER_FLAVOURS=release tools/build.sh players'

      - name: Compile smoke test, post-processing
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          JASPER_DOCKER_IMAGE="$JASPER_IMAGE_LINUX" tools/ci/logged.sh smoke-post-processing
          'SMOKE_METHOD=compile SMOKE_DIR=build/smoke-post-processing tools/smoke-test.sh tools/fixtures/post-processing'

      # an exported game changing its ECS in contact callbacks
      - name: Compile smoke test, ecs-collision
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          JASPER_DOCKER_IMAGE="$JASPER_IMAGE_LINUX" tools/ci/logged.sh smoke-ecs-collision
          'SMOKE_METHOD=compile SMOKE_DIR=build/smoke-ecs-collision tools/smoke-test.sh tools/fixtures/ecs-collision'

      # no compiler: the editor builds the game from the player runtime in the runtime image (S30 AC1-AC3)
      - name: Prebuilt smoke test, unified-lighting
        if: ${{ !cancelled() && steps.players.outcome == 'success' }}
        run: >-
          JASPER_DOCKER_IMAGE="$JASPER_IMAGE_RUNTIME" tools/ci/logged.sh smoke-unified-lighting
          'SMOKE_METHOD=prebuilt SMOKE_DIR=build/smoke-unified-lighting tools/smoke-test.sh tools/fixtures/unified-lighting'

      - name: Prebuilt smoke test, a project from each template
        if: ${{ !cancelled() && steps.players.outcome == 'success' }}
        run: tools/ci/logged.sh smoke-templates 'SMOKE_METHOD=prebuilt tools/ci/smoke-templates.sh'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke
          path: |
            build/smoke-*/*.png
            build/smoke-*/*.log
          retention-days: 14
          if-no-files-found: ignore
      - uses: ./.github/actions/ccache-save
        if: always()
        with:
          lane: smoke
          prune: 'true'
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: smoke
          status: ${{ job.status }}

  # ------------------------------------------------------------------ Web ---
  # The engine sample project for Emscripten in headless Chrome (tools/web/browser_gate.py); the queue and
  # full runs add the core utilities and cooked texture formats gates.
  web:
    name: web
    needs: changes
    if: needs.changes.outputs.run_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write  # ccache-save deletes the lane's older entry as soon as it saved the new one (push)
    env:
      JASPER_CI_REPRO: |-
        tools/build.sh web
        tools/build.sh web-gate
      EXTRA_GATES: ${{ github.event_name == 'merge_group' || needs.changes.outputs.full == 'true' }}
    steps:
      - name: Start
        run: echo "JASPER_CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/free-disk
        with:
          need: 35
      - uses: ./.github/actions/image
        id: image
        with:
          target: web
      - uses: ./.github/actions/ccache-restore
        with:
          lane: web
          max-size: 0.3G
          toolchain: ${{ steps.image.outputs.tag }}

      - name: Web presets and option errors
        if: github.event_name != 'push'
        run: tools/ci/logged.sh web-presets 'tools/build.sh exec web tools/ci/check-presets.sh web'

      - name: Engine sample project
        run: tools/ci/logged.sh web-build 'tools/build.sh web'

      - name: Browser gate
        if: github.event_name != 'push'
        run: tools/ci/logged.sh web-gate 'tools/build.sh web-gate'

      - name: Core utilities gate project (logger, Lua Timer)
        if: env.EXTRA_GATES == 'true'
        run: |
          tools/ci/logged.sh web-core-utilities-build 'WEB_PROJECT=core-utilities tools/build.sh web'
          tools/ci/logged.sh web-core-utilities-gate 'GATE=core-utilities tools/build.sh web-gate'

      # the R19 web transcode bench in report mode: its budget is gated on the benchmark server only
      # (docs/textures.md)
      - name: Cooked texture formats gate project (Release)
        if: env.EXTRA_GATES == 'true'
        run: |
          tools/ci/logged.sh web-texture-formats-build 'BUILD_TYPE=Release WEB_PROJECT=texture-formats tools/build.sh web'
          tools/ci/logged.sh web-texture-formats-gate \
              "GATE=texture-formats GATE_ARGS='--query=transcode_bench=report --expect=transcode_web_budgets=report --seconds 10' tools/build.sh web-gate"

      - name: Cooked-texture runtime size (S14 R21, wasm Release)
        if: env.EXTRA_GATES == 'true'
        run: |
          tools/ci/logged.sh web-texture-formats-map \
              "tools/build.sh exec web bash -c 'cmake -S engine -B build/web-texture-formats -DCMAKE_EXE_LINKER_FLAGS=-Wl,--Map=/src/build/web-texture-formats.map && cmake --build build/web-texture-formats --target jasperengine-project'"
          tools/ci/logged.sh web-texture-runtime-size \
              'python3 tools/textures/runtime_size.py --wasm-map build/web-texture-formats.map --json build/test-results/texture-runtime-size-wasm.json'

      - uses: ./.github/actions/ccache-save
        if: always()
        with:
          lane: web
          prune: 'true'
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: web
          status: ${{ job.status }}

  # -------------------------------------------------------------- Android ---
  # The engine sample project's APK in the android image. PRs and pushes build arm64-v8a only (what
  # the push's cache warms for PRs); the queue and full runs build every ABI an export ships.
  android:
    name: android
    needs: changes
    if: needs.changes.outputs.run_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write  # ccache-save deletes the lane's older entry as soon as it saved the new one (push)
    env:
      JASPER_CI_REPRO: tools/build.sh android
    steps:
      - name: Start
        run: echo "JASPER_CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/free-disk
        with:
          need: 65
      - uses: ./.github/actions/image
        id: image
        with:
          target: android
      - uses: ./.github/actions/ccache-restore
        with:
          lane: android
          max-size: 0.3G
          toolchain: ${{ steps.image.outputs.tag }}
      # Gradle's distribution and dependencies (tools/build.sh sets GRADLE_USER_HOME=build/.cache/gradle)
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/.cache/gradle/caches
            build/.cache/gradle/wrapper
          key: gradle-${{ github.run_id }}
          restore-keys: gradle-

      - name: APK
        env:
          ABIS: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'ANDROID_ABIS=arm64-v8a ' || '' }}
        run: tools/ci/logged.sh android-build "${ABIS}tools/build.sh android"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push'
        with:
          path: |
            build/.cache/gradle/caches
            build/.cache/gradle/wrapper
          key: gradle-${{ github.run_id }}
      - uses: ./.github/actions/ccache-save
        if: always()
        with:
          lane: android
          prune: 'true'
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: android
          status: ${{ job.status }}

  # -------------------------------------------------------------- Windows ---
  # MSVC through tools/ci/windows.sh, as parallel jobs (the lane takes as long as its longest one): the
  # editor with its CPU unit tests and the call CLI; the engine on each Windows backend, the OpenGL one
  # with the core tests; windows-compile, a Compile build of a fixture with the editor job's install (G2).
  # Each job has its own ccache entry and report (windows-<part>, tools/ci/report.py WINDOWS_PARTS).
  windows:
    name: windows (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.run_windows == 'true'
    runs-on: windows-latest
    # a cold editor build (about 230 min, as after a cache-key change) plus the advisory editor-test
    # step's own 75: past the job's limit GitHub cancels the job, and Check counts it red
    timeout-minutes: 330
    permissions:
      contents: read
      actions: write  # ccache-save deletes the lane's older entry as soon as it saved the new one (push)
    strategy:
      fail-fast: false
      # ccache where it shortens the lane (the 10 GB repository budget, docs/testing.md "CI"): the editor
      # (0.9 GB working set). The engine legs build cold: the lane ends with its slowest leg, and D3D11 and
      # Vulkan cold (57-99 min) take about as long as OpenGL cold with the core tests (79-108)
      matrix:
        include:
          - part: editor
            ccache: 0.95G
          - part: engine-glcore
            ccache: ''
          - part: engine-d3d11
            ccache: ''
          - part: engine-vulkan
            ccache: ''
    env:
      JASPER_CI_REPRO: tools/ci/windows.sh
      PART: ${{ matrix.part }}
    steps:
      - name: Start
        run: echo "JASPER_CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      # the repository's bytes, as on Linux and macOS: Git for Windows checks text out with CRLF, and
      # tests compare committed files (generated docs, canonical documents) byte for byte
      - name: LF checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # a second try when the first fails: on a cache miss the action downloads the installer, and its
      # HEAD check of the URL has no retry of its own
      - uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
        id: vulkan-sdk
        if: matrix.part == 'engine-vulkan'
        continue-on-error: true
        with:
          vulkan_version: 1.3.296.0
          install_runtime: false
          cache: true
          cache_save_if: ${{ github.event_name == 'push' }}
      - uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
        if: steps.vulkan-sdk.outcome == 'failure'
        with:
          vulkan_version: 1.3.296.0
          install_runtime: false
          cache: true
          cache_save_if: ${{ github.event_name == 'push' }}
      # Ninja instead of the Visual Studio generator, so ccache can wrap cl.exe
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: ./.github/actions/ccache-restore
        if: matrix.ccache != ''
        with:
          lane: windows-${{ matrix.part }}
          max-size: ${{ matrix.ccache }}

      - name: Editor
        if: matrix.part == 'editor'
        run: tools/ci/windows.sh editor
      # reported apart (windows-editor-tests, in ADVISORY_LANES while the suite settles on Windows): the
      # leg's build gates, its test run is listed; a hang costs TEST_TIMEOUT, not the leg. While advisory
      # it runs in the advisory run, not in the merge queue; never on push (build_only)
      - name: Editor unit tests (CPU suites)
        id: editor-tests
        if: matrix.part == 'editor' && !contains(fromJSON(needs.changes.outputs.build_only), 'windows-editor-tests')
        continue-on-error: true
        timeout-minutes: 75
        env:
          CI_RESULTS: build/test-results-editor-tests
          TEST_TIMEOUT: 3600
        run: TEST_SUITES=editor tools/ci/windows.sh tests
      - uses: ./.github/actions/report
        if: ${{ always() && steps.editor-tests.outcome != 'skipped' && steps.editor-tests.outcome != '' }}
        with:
          lane: windows-editor-tests
          status: ${{ steps.editor-tests.outcome }}
          results: build/test-results-editor-tests
      - name: Call CLI without an editor
        if: matrix.part == 'editor' && env.MAIN_STAGE != 'true'
        run: tools/ci/windows.sh check-cli
      # windows-compile's editor
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.part == 'editor' && env.MAIN_STAGE != 'true'
        with:
          name: windows-editor-install
          path: instdir/
          retention-days: 1
          if-no-files-found: error

      # (the OpenGL tree runs the core tests, whose crash and hang reports name frames: debug information).
      # Not on main's stages: the engine legs keep no ccache entry, so a push's build warms nothing (the
      # Vulkan SDK's cache above still saves), and the merge queue built them
      - name: Engine
        if: startsWith(matrix.part, 'engine-') && env.MAIN_STAGE != 'true'
        env:
          ENGINE_DEBUG_INFO: ${{ matrix.part == 'engine-glcore' && '1' || '' }}
        run: tools/ci/windows.sh engine "${PART#engine-}"
      - name: Core unit tests (CPU suites)
        if: matrix.part == 'engine-glcore' && env.MAIN_STAGE != 'true'
        run: TEST_SUITES=core tools/ci/windows.sh tests glcore

      - uses: ./.github/actions/ccache-save
        if: always() && matrix.ccache != ''
        with:
          lane: windows-${{ matrix.part }}
          prune: 'true'
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: windows-${{ matrix.part }}
          status: ${{ job.status }}

  # Every leg above, then the Compile build with the editor job's install; on main's stages, nothing to do
  # (a PR and the queue ran it), but the job runs so Check sees the lane whole
  windows-compile:
    name: windows (compile)
    needs: [changes, windows]
    if: ${{ !cancelled() && needs.changes.outputs.run_windows == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      JASPER_CI_REPRO: tools/ci/windows.sh compile-smoke tools/fixtures/post-processing
    steps:
      - name: Start
        run: echo "JASPER_CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: LF checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.MAIN_STAGE != 'true'
        with:
          name: windows-editor-install
          path: instdir
      - name: Compile build of post-processing
        if: env.MAIN_STAGE != 'true'
        run: tools/ci/windows.sh compile-smoke tools/fixtures/post-processing
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: windows-compile
          status: ${{ job.status }}

  # ---------------------------------------------------------------- Apple ---
  # Two macOS jobs per run at most (5 concurrent macOS jobs per organization): macos is the arm64 editor
  # and engine through tools/ci/macos.sh, ios the Xcode project for iOS and macOS.
  macos:
    name: macos
    needs: changes
    if: needs.changes.outputs.run_macos == 'true'
    runs-on: macos-latest
    # cold (no ccache yet): editor 81 min, engine and core tests 63, CPU tests 18, then compile-smoke
    timeout-minutes: 300
    permissions:
      contents: read
      actions: write  # ccache-save deletes the lane's older entry as soon as it saved the new one (push)
    env:
      JASPER_CI_REPRO: tools/ci/macos.sh
    steps:
      - name: Start
        run: echo "JASPER_CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # NASM: dav1d's x86-64 asm (the x86_64 slices of universal and simulator builds); Subversion:
      # the version control tests' svn and svnadmin (the Linux image has them)
      - name: Ninja, NASM and Subversion
        run: |
          command -v ninja > /dev/null || tools/ci/retry.sh brew install ninja
          command -v nasm > /dev/null || tools/ci/retry.sh brew install nasm
          command -v svnadmin > /dev/null || tools/ci/retry.sh brew install subversion
      - uses: ./.github/actions/ccache-restore
        with:
          lane: macos
          max-size: 0.9G

      - name: Editor (arm64)
        run: tools/ci/macos.sh editor
      - name: Engine and the core tests
        run: tools/ci/macos.sh engine
      - name: Unit tests (CPU suites)
        if: github.event_name != 'push'
        run: tools/ci/macos.sh tests
      - name: Call CLI without an editor
        if: github.event_name != 'push'
        run: tools/ci/macos.sh check-cli
      - name: Compile build of post-processing
        if: ${{ !cancelled() && github.event_name != 'push' }}
        run: tools/ci/macos.sh compile-smoke tools/fixtures/post-processing

      - uses: ./.github/actions/ccache-save
        if: always()
        with:
          lane: macos
          prune: 'true'
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: macos
          status: ${{ job.status }}

  ios:
    name: ios
    needs: changes
    if: needs.changes.outputs.run_ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      JASPER_CI_REPRO: tools/ci/macos.sh xcode ios
    steps:
      - name: Start
        run: echo "JASPER_CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # dav1d's x86-64 asm: the simulator build has an x86_64 slice
      - name: NASM
        run: command -v nasm > /dev/null || tools/ci/retry.sh brew install nasm
      - name: Xcode project (iOS)
        run: tools/ci/macos.sh xcode ios
      - name: Xcode project (macOS)
        if: ${{ !cancelled() }}
        run: tools/ci/macos.sh xcode macos
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: ios
          status: ${{ job.status }}

  # --------------------------------------------------------------- Shadow ---
  # The merge queue runs every unit test, a full run every test: each failed test that a pull request's
  # selection of the same diff would have left out is a miss (tools/ci/shadow.py, lanes.json shadow).
  # Read-only: the record goes to the summary and the `shadow` artifact; the nightly gathers the
  # artifacts into the tracked report (shadow.jsonl on ci-plan-inputs). Not a lane: Check skips it.
  shadow:
    name: shadow
    needs: [changes, unit, asan, htmlui, mcp]
    if: always() && needs.changes.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: ci-report-*
          path: reports
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: plan
      - name: Judge the failures against a PR's selection
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 tools/ci/plan_inputs.py fetch --out build/ci-inputs
          mkdir -p reports
          python3 tools/ci/shadow.py check --lanes plan/lanes.json --reports reports --history build/ci-inputs/shadow.jsonl \
              --run-id "$GITHUB_RUN_ID" --run-url "$RUN_URL" --out build/shadow/shadow.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shadow
          path: build/shadow/shadow.json
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------- Plan inputs ---
  # Push to main: the unit and htmlui lanes' deps dumps onto the ci-plan-inputs data branch, where PRs'
  # changes job fetches them (tools/ci/plan_inputs.py). A dump a lane did not make keeps its last one.
  # The one job with contents: write, on main's code only. Housekeeping, not a lane: Check skips it.
  plan-inputs:
    name: plan inputs
    needs: [unit, htmlui]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: deps-*
          path: build/ci-inputs/deps
          merge-multiple: true
      - name: Publish the deps dumps
        run: |
          shopt -s nullglob
          sets=()
          for f in build/ci-inputs/deps/*.deps; do
              name="$(basename "$f" .deps)"
              sets+=(--set "deps/$name=$f")
          done
          [[ ${#sets[@]} -gt 0 ]] || { echo "::warning::no deps dump to publish: PRs plan with the last ones"; exit 0; }
          python3 tools/ci/plan_inputs.py publish --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID" "${sets[@]}"

  # -------------------------------------------------------------- Caches ---
  # Push to main: one live entry per cache (§10.2: LRU must never evict one lane for another; each
  # ccache-save prunes its lane's older entry already, this catches a failed prune). Housekeeping, not
  # a lane: Check skips it.
  caches:
    name: caches
    needs: [linux, unit, asan, htmlui, smoke, web, android, windows, macos]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Keep the newest entry of each cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for prefix in gradle- ccache-linux- ccache-web- ccache-android- ccache-windows-editor- \
                        ccache-macos- ccache-unit-core- ccache-unit-editor- ccache-asan-core- ccache-asan-editor- \
                        ccache-htmlui- ccache-smoke-; do
              gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$prefix" --sort created_at \
                  --order desc --limit 100 --json id,key --jq '.[1:][] | "\(.id) \(.key)"' |
                  while read -r id key; do
                      echo "delete $key"
                      gh cache delete --repo "$GITHUB_REPOSITORY" "$id"
                  done
          done
          # a lane that gave its entry up (docs/testing.md "CI"): its last one would hold the budget 7 days;
          # the plan inputs moved to the ci-plan-inputs branch
          for prefix in ccache-windows-engine-glcore- plan-inputs- coverage-map-; do
              gh cache list --repo "$GITHUB_REPOSITORY" --key "$prefix" --limit 100 --json id,key --jq '.[] | "\(.id) \(.key)"' |
                  while read -r id key; do
                      echo "delete $key"
                      gh cache delete --repo "$GITHUB_REPOSITORY" "$id"
                  done
          done
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 100

  # --------------------------------------------------------------- Report ---
  # The PR comment (same-repo PRs; a fork's token is read-only and .github/workflows/ci-report.yml posts
  # it), the merge queue's "Removed from the merge queue:" comment, main's ci-red issue and the advisory
  # run's advisory-red issue. It needs Check, so it knows the verdict; Check does not need it.
  report:
    name: report
    needs: [changes, lint, linux, unit, asan, htmlui, mcp, smoke, web, android, windows, windows-compile, macos, ios, check]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-report-*
          path: reports
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: plan
          path: plan

      - name: Render
        id: render
        env:
          PREFIX: ${{ github.event_name == 'merge_group' && needs.check.result != 'success' && 'Removed from the merge queue:' || '' }}
        run: |
          printf '%s\n' "$NEEDS" > needs.json
          started="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at || true)"
          python3 tools/ci/report.py render --reports reports --lanes plan/lanes.json --needs needs.json \
              --run-url "$RUN_URL" --sha "$SHA" --started-at "$started" --advisory "$ADVISORY_LANES" \
              --prefix "$PREFIX" --out comment.md --github-output "$GITHUB_OUTPUT"
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR: ${{ github.event.pull_request.number }}
        run: python3 tools/ci/report.py post --pr "$PR" --body comment.md

      # the queue removes a PR whose group fails (gh-readonly-queue/<base>/pr-<N>-<sha> names it)
      - name: Comment on the PR the merge queue removed
        if: github.event_name == 'merge_group' && needs.check.result != 'success'
        run: python3 tools/ci/report.py post --pr-from-ref "$GITHUB_REF" --body comment.md

      # and comments on the PR that landed the commit, linking the issue
      - name: Open or update the ci-red issue
        if: github.event_name == 'push' && needs.check.result != 'success'
        run: python3 tools/ci/report.py issue --label ci-red --title "main is red" --body comment.md --commit "$GITHUB_SHA"

      # the advisory run of main (Check stays green on an advisory failure): one standing issue while any of
      # its jobs fails, is cancelled or leaves no report, commented on by each run and closed by a green one
      - name: Open, update or close the advisory-red issue
        if: inputs.advisory && github.ref == 'refs/heads/main'
        env:
          GREEN: ${{ needs.check.result == 'success' && steps.render.outputs.failing == '0' }}
        run: |
          if [[ "$GREEN" == true ]]; then
              python3 tools/ci/report.py issue --label advisory-red --close --body comment.md
          else
              python3 tools/ci/report.py issue --label advisory-red --title "Advisory tests fail on main" --body comment.md
          fi

  # ---------------------------------------------------------------- Check ---
  # The one required status: every needed lane succeeded, or was skipped because changes said so, and no
  # test lane passed by running nothing (tools/ci/check_gate.py). always(): a cancelled run fails it too.
  check:
    name: Check
    needs: [changes, lint, linux, unit, asan, htmlui, mcp, smoke, web, android, windows, windows-compile, macos, ios]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-report-*
          path: reports
          merge-multiple: true
      # a failed changes job leaves no plan: check_gate fails on the missing file
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: plan
          path: plan
      - name: Gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" > needs.json
          python3 tools/ci/check_gate.py --needs needs.json --lanes plan/lanes.json --reports reports \
              --advisory "$ADVISORY_LANES"
