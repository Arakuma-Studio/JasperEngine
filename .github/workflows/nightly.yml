name: Nightly

# The suites too slow or too heavy for every push (docs/testing.md): the HTML UI suite on
# Vulkan and under ASan + UBSan, the unit tests under TSan, the unity builds, the smoke test of
# every fixture project on OpenGL, GLES3 and Vulkan, and the threaded web build through the
# browser gate. Once a day on main and oe-port, or on demand for the chosen branch. A failure
# opens (or comments on) the one open issue labelled "nightly".
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refs:
    name: Branches
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - id: refs
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo 'refs=["main","oe-port"]' >> "$GITHUB_OUTPUT"
          else
            echo "refs=[\"$GITHUB_REF_NAME\"]" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: ${{ matrix.suite.name }} (${{ matrix.ref }})
    needs: refs
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.refs.outputs.refs) }}
        suite:
          - name: HTML UI tests (Vulkan)
            id: htmlui-vulkan
            run: HTMLUI_BACKEND=vulkan JASPER_HTMLUI_PERF_SLACK=3 tools/build.sh htmlui-tests
          - name: HTML UI tests (ASan + UBSan)
            id: htmlui-asan
            run: SANITIZE=address,undefined JASPER_HTMLUI_PERF_SLACK=10 HTMLUI_TEST_ARGS='--gtest_filter=-*Golden*' tools/build.sh htmlui-tests
          - name: Unit tests (TSan)
            id: tsan
            run: SANITIZE=thread UNIT_TEST_ARGS='--gtest_filter=-*Gpu*' tools/build.sh unit-tests
          - name: Unity builds (editor and engine)
            id: unity
            run: UNITY=1 tools/build.sh linux
          - name: Smoke tests (OpenGL, every fixture)
            id: smoke-opengl
            run: tools/build.sh linux && tools/ci/nightly-smoke.sh opengl
          - name: Smoke tests (GLES3)
            id: smoke-gles3
            run: SKIP_ENGINE=1 tools/build.sh linux && tools/ci/nightly-smoke.sh gles3
          - name: Smoke tests (Vulkan)
            id: smoke-vulkan
            run: SKIP_ENGINE=1 tools/build.sh linux && tools/ci/nightly-smoke.sh vulkan
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: build/.cache/ccache
          key: ccache-nightly-${{ matrix.suite.id }}-${{ github.run_id }}
          restore-keys: ccache-nightly-${{ matrix.suite.id }}-

      - name: Limit the compiler cache
        run: mkdir -p build/.cache/ccache && echo "max_size = 1G" > build/.cache/ccache/ccache.conf

      # the images are built by tools/build.sh and tools/smoke-test.sh themselves (docker build):
      # the backends image of the GLES3 and Vulkan runs builds FROM the local Linux image
      - name: ${{ matrix.suite.name }}
        run: ${{ matrix.suite.run }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-${{ matrix.suite.id }}-${{ matrix.ref }}
          path: |
            build/test-results/**
            build/smoke*/*.png
            build/smoke*/*.log
          if-no-files-found: ignore

  web-threads:
    name: Web with pthreads, browser gate (${{ matrix.ref }})
    needs: refs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.refs.outputs.refs) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/cache@v4
        with:
          path: build/.cache/ccache
          key: ccache-nightly-web-threads-${{ github.run_id }}
          restore-keys: ccache-nightly-web-threads-

      - name: Build the threaded engine sample project
        run: WEB_THREADS=1 tools/build.sh web

      - name: Browser gate (cross-origin isolated)
        run: GATE=sample-project-threads tools/build.sh web-gate

      # the red control: served without COOP/COEP a threaded build cannot start, and the gate must say so
      - name: Browser gate without cross-origin isolation fails
        run: |
          if GATE=sample-project-threads GATE_ARGS=--no-isolation tools/build.sh web-gate; then
            echo "::error::the browser gate passed a threaded build served without COOP/COEP"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-web-threads-${{ matrix.ref }}
          path: build/test-results/**
          if-no-files-found: ignore

  report:
    name: Report failures
    needs: [linux, web-threads]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create nightly --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Nightly workflow failures" 2>/dev/null || true
          body="The nightly run of $(date -u +%Y-%m-%d) failed: $RUN_URL"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label nightly --title "Nightly failures" --body "$body"
          fi
