name: Build release

# The release build shared by nightly.yml (channel nightly, nightly-YYYYMMDD) and release.yml
# (channel stable, vX.Y.Z), docs/superpowers/specs/2026-11-12-ci-design.md §12.2:
#   1. every player runtime, one job per platform x backend (release flavour; stable: development too)
#   2. player-hashes: their SHA-256 table, only when every player job succeeded
#   3. the editors of Linux, Windows and macOS with that table compiled in, packaged and launch-checked
#   4. the release editor against its players: every archive installed from disk against the table,
#      a tampered one refused, the prebuilt end to end and Android AC7
#   5. publish: SHA256SUMS of the final files, a draft, every file uploaded, then published
#      (dry_run: left a complete draft); then the published AppImage downloads its own player (AC9)
# (step 3's Linux launch check is tools/ci/package-linux.sh's own)
# Every step is a script that runs the same way locally (the repro of each job is its env JASPER_CI_REPRO).
on:
  workflow_call:
    inputs:
      channel:
        description: nightly or stable
        type: string
        required: true
      version:
        description: nightly-YYYYMMDD or vX.Y.Z, the stamp of every binary
        type: string
        required: true
      commit:
        description: the full SHA every job builds
        type: string
        required: true
      dry_run:
        description: stop at a complete draft
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  # the version tools/build.sh, tools/ci/*.sh and tools/players/package_player.py stamp
  JASPERENGINE_VERSION: ${{ inputs.version }}
  PLAYER_FLAVOURS: ${{ inputs.channel == 'stable' && 'release development' || 'release' }}
  PLAYER_ZIP: '1'

jobs:
  check-inputs:
    name: Release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - name: Check the channel, version and commit
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: tools/ci/release.sh check "$CHANNEL" "$VERSION" "$COMMIT"

  # ------------------------------------------------------------------ players ---
  players-linux:
    name: Players (Linux ${{ matrix.backend }})
    needs: check-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        backend: [glcore, gles3, vulkan]
    env:
      PLAYER_BACKENDS: ${{ matrix.backend }}
      JASPER_CI_REPRO: JASPERENGINE_VERSION=${{ inputs.version }} PLAYER_FLAVOURS="${{ inputs.channel == 'stable' && 'release development' || 'release' }}" PLAYER_BACKENDS=${{ matrix.backend }} PLAYER_ZIP=1 tools/build.sh players
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/image
        id: image
        with:
          target: linux
      - uses: ./.github/actions/ccache-restore
        with:
          lane: linux
          max-size: 2G
          toolchain: ${{ steps.image.outputs.tag }}
      - name: Build the runtimes
        run: |
          mkdir -p build/test-results
          tools/build.sh players 2>&1 | tee "build/test-results/players-linux-$PLAYER_BACKENDS-build.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: player-archives-linux-${{ matrix.backend }}
          path: build/players/archives/*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: release-players-linux-${{ matrix.backend }}
          status: ${{ job.status }}

  players-web:
    name: Players (web)
    needs: check-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PLAYER_PLATFORM: web
      JASPER_CI_REPRO: JASPERENGINE_VERSION=${{ inputs.version }} PLAYER_FLAVOURS="${{ inputs.channel == 'stable' && 'release development' || 'release' }}" PLAYER_PLATFORM=web PLAYER_ZIP=1 tools/build.sh players
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/image
        id: image
        with:
          target: web
      - uses: ./.github/actions/ccache-restore
        with:
          lane: web
          max-size: 2G
          toolchain: ${{ steps.image.outputs.tag }}
      - name: Build the runtimes (single-thread and pthreads)
        run: |
          mkdir -p build/test-results
          tools/build.sh players 2>&1 | tee build/test-results/players-web-build.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: player-archives-web
          path: build/players/archives/*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: release-players-web
          status: ${{ job.status }}

  players-android:
    name: Players (Android)
    needs: check-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PLAYER_PLATFORM: android
      JASPER_CI_REPRO: JASPERENGINE_VERSION=${{ inputs.version }} PLAYER_FLAVOURS="${{ inputs.channel == 'stable' && 'release development' || 'release' }}" PLAYER_PLATFORM=android PLAYER_ZIP=1 tools/build.sh players
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/image
        id: image
        with:
          target: android
      - uses: ./.github/actions/ccache-restore
        with:
          lane: android
          max-size: 2G
          toolchain: ${{ steps.image.outputs.tag }}
      - name: Build the runtimes (gles3, every ABI)
        run: |
          mkdir -p build/test-results
          tools/build.sh players 2>&1 | tee build/test-results/players-android-build.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: player-archives-android
          path: build/players/archives/*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: release-players-android
          status: ${{ job.status }}

  players-windows:
    name: Players (Windows ${{ matrix.backend }})
    needs: check-inputs
    runs-on: windows-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        backend: [d3d11, glcore, vulkan]
    defaults:
      run:
        shell: bash
    env:
      JASPER_CI_REPRO: JASPERENGINE_VERSION=${{ inputs.version }} tools/ci/players-windows.sh ${{ matrix.backend }} "${{ inputs.channel == 'stable' && 'release development' || 'release' }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
        with:
          vulkan_version: 1.3.296.0
          install_runtime: false
          cache: true
          cache_save_if: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: ./.github/actions/ccache-restore
        with:
          lane: windows
          max-size: 2G
      - name: Build the runtimes (static CRT)
        env:
          BACKEND: ${{ matrix.backend }}
        run: tools/ci/players-windows.sh "$BACKEND" "$PLAYER_FLAVOURS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: player-archives-windows-${{ matrix.backend }}
          path: build/players/archives/*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: release-players-windows-${{ matrix.backend }}
          status: ${{ job.status }}

  players-apple:
    name: Players (${{ matrix.target }})
    needs: check-inputs
    runs-on: macos-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      # macOS runners are 5 per account: a run takes at most 2
      max-parallel: 2
      matrix:
        target: [macos-metal, macos-glcore, ios]
    env:
      JASPER_CI_REPRO: JASPERENGINE_VERSION=${{ inputs.version }} tools/ci/players-apple.sh ${{ matrix.target }} "${{ inputs.channel == 'stable' && 'release development' || 'release' }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - name: Install Ninja
        run: brew install ninja
      - uses: ./.github/actions/ccache-restore
        with:
          lane: macos
          max-size: 2G
      - name: Build the runtimes (universal macOS, ad-hoc signed; iOS xcframework)
        env:
          TARGET: ${{ matrix.target }}
        run: tools/ci/players-apple.sh "$TARGET" "$PLAYER_FLAVOURS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: player-archives-apple-${{ matrix.target }}
          path: build/players/archives/*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: release-players-apple-${{ matrix.target }}
          status: ${{ job.status }}

  # The table the editors compile in (docs/specs/S30-shipping.md D5): no release without every runtime
  player-hashes:
    name: Player runtime hashes
    needs: [players-linux, players-web, players-android, players-windows, players-apple]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JASPER_CI_REPRO: python3 tools/players/write_hashes.py <player archives> --version ${{ inputs.version }}
    steps:
      - name: Every player job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if ! jq -e 'to_entries | all(.value.result == "success")' <<< "$NEEDS" > /dev/null; then
            jq -r 'to_entries[] | select(.value.result != "success") | "::error::\(.key): \(.value.result)"' <<< "$NEEDS"
            echo "::error::no release without every player runtime"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: player-archives-*
          path: build/player-archives
          merge-multiple: true
      - name: Write the table
        run: python3 tools/players/write_hashes.py build/player-archives --version "$JASPERENGINE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: player-hashes
          path: editor/players/PlayerRuntimeHashes.gen.h
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------ editors ---
  editor-linux:
    name: Editor (Linux)
    needs: player-hashes
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      JASPER_CI_REPRO: JASPERENGINE_VERSION=${{ inputs.version }} SKIP_ENGINE=1 tools/build.sh linux && tools/ci/package-linux.sh ${{ inputs.version }}
    steps:
      # full history and tags: the root CMake asks git describe when no version is given
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/image
        id: image
        with:
          target: linux
      - uses: ./.github/actions/ccache-restore
        with:
          lane: linux
          max-size: 2G
          toolchain: ${{ steps.image.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: player-hashes
          path: editor/players
      - name: Build the editor
        run: |
          mkdir -p build/test-results
          SKIP_ENGINE=1 tools/build.sh linux 2>&1 | tee build/test-results/linux-build.log
      # (and its launch check: the AppImage's call --help, and a one-shot editor_status on a fixture copy)
      - name: Package the AppImage, its zsync and the zip; launch-check the AppImage
        run: tools/ci/package-linux.sh "$JASPERENGINE_VERSION"
      # the install tree, with its exec bits, for the prebuilt jobs' release editor
      - name: Keep the editor install
        run: tar -C build/linux -cf build/editor-linux-install.tar editor-install
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-linux
          path: |
            dist/JasperEngine-${{ inputs.version }}-linux-x86_64.AppImage
            dist/JasperEngine-${{ inputs.version }}-linux-x86_64.AppImage.zsync
            dist/JasperEngine-${{ inputs.version }}-linux-x86_64.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-linux-install
          path: build/editor-linux-install.tar
          if-no-files-found: error
          retention-days: 7
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: release-editor-linux
          status: ${{ job.status }}

  editor-windows:
    name: Editor (Windows)
    needs: player-hashes
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      JASPER_CI_REPRO: JASPERENGINE_VERSION=${{ inputs.version }} tools/ci/windows.sh editor && tools/ci/windows.sh package ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
        with:
          vulkan_version: 1.3.296.0
          install_runtime: false
          cache: true
          cache_save_if: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: ./.github/actions/ccache-restore
        with:
          lane: windows
          max-size: 2G
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: player-hashes
          path: editor/players
      - name: Build the editor
        run: tools/ci/windows.sh editor
      - name: Package the zip
        run: tools/ci/windows.sh package "$JASPERENGINE_VERSION"
      - name: Launch check (the zip's jasperengine-editor-cmd)
        run: |
          rm -rf build/launch-check
          python -m zipfile -e "dist/JasperEngine-$JASPERENGINE_VERSION-windows-x64.zip" build/launch-check
          python tools/ci/check-call-cli.py build/launch-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-windows
          path: dist/JasperEngine-${{ inputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: release-editor-windows
          status: ${{ job.status }}

  editor-macos:
    name: Editor (macOS universal)
    needs: player-hashes
    runs-on: macos-latest
    timeout-minutes: 240
    env:
      ARCHS: universal
      JASPER_CI_REPRO: JASPERENGINE_VERSION=${{ inputs.version }} ARCHS=universal tools/ci/macos.sh editor && tools/ci/macos.sh package ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Install Ninja
        run: brew install ninja
      - uses: ./.github/actions/ccache-restore
        with:
          lane: macos
          max-size: 2G
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: player-hashes
          path: editor/players
      - name: Build the editor (arm64 and x86_64)
        run: tools/ci/macos.sh editor
      - name: Package the zip and the dmg (ad-hoc signed)
        run: tools/ci/macos.sh package "$JASPERENGINE_VERSION"
      - name: Launch check (the zip's editor)
        run: |
          rm -rf build/launch-check
          unzip -q "dist/JasperEngine-$JASPERENGINE_VERSION-macos-universal.zip" -d build/launch-check
          python3 tools/ci/check-call-cli.py build/launch-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-macos
          path: |
            dist/JasperEngine-${{ inputs.version }}-macos-universal.zip
            dist/JasperEngine-${{ inputs.version }}-macos-universal.dmg
          if-no-files-found: error
          retention-days: 14
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: release-editor-macos
          status: ${{ job.status }}

  # ------------------------------------------------- the release editor end to end ---
  # S30 AC1-AC3 (and S06 AC20/AC21's no-COI fallback) with the release's own editor and archives,
  # in the no-compiler image; every archive of every platform installed against the embedded table
  prebuilt:
    name: Prebuilt players end to end (release editor, no compiler)
    needs: [player-hashes, editor-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      JASPER_CI_REPRO: tools/build.sh exec runtime tools/ci/release-players.sh ${{ inputs.version }} build/player-archives build/players linux- web- && tools/build.sh exec runtime python3 tools/ci/test_player_cli.py && SMOKE_METHOD=prebuilt tools/smoke-test.sh tools/fixtures/unified-lighting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/image
        id: image
        with:
          target: runtime
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: editor-linux-install
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: player-archives-*
          path: build/player-archives
          merge-multiple: true
      - name: Unpack the release editor
        run: mkdir -p build/linux && tar -C build/linux -xf build/editor-linux-install.tar
      - name: Every archive installed by the release editor; a tampered one refused
        run: |
          mkdir -p build/test-results
          tools/build.sh exec runtime tools/ci/release-players.sh "$JASPERENGINE_VERSION" build/player-archives build/players linux- web- \
            2>&1 | tee build/test-results/release-players.log
      - name: Player CLI in the no-compiler image
        run: tools/build.sh exec runtime python3 tools/ci/test_player_cli.py 2>&1 | tee build/test-results/player-cli.log
      - name: Smoke test of the prebuilt player
        run: SMOKE_METHOD=prebuilt tools/smoke-test.sh tools/fixtures/unified-lighting 2>&1 | tee build/test-results/smoke-prebuilt.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-evidence-prebuilt
          path: |
            build/player-cli/**/*.png
            build/player-cli/**/*.log
            build/smoke/*.png
            build/smoke/*.log
          if-no-files-found: ignore
          retention-days: 14
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: release-prebuilt
          status: ${{ job.status }}

  # S30 AC7: an Android game from the release's prebuilt player with the SDK's tools alone (no
  # NDK, CMake or Gradle): the App Bundle, one APK per ABI and the universal APK, checked
  prebuilt-android:
    name: Prebuilt Android player (release editor, no NDK, CMake or Gradle)
    needs: [player-hashes, editor-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JASPER_CI_REPRO: tools/build.sh exec android tools/ci/release-players.sh ${{ inputs.version }} build/player-archives build/players android- && tools/ci/android_ac7.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/image
        id: image
        with:
          target: android
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: editor-linux-install
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: player-archives-android
          path: build/player-archives
      - name: Unpack the release editor
        run: mkdir -p build/linux && tar -C build/linux -xf build/editor-linux-install.tar
      - name: Install the Android runtimes with the release editor
        run: |
          mkdir -p build/test-results
          tools/build.sh exec android tools/ci/release-players.sh "$JASPERENGINE_VERSION" build/player-archives build/players android- \
            2>&1 | tee build/test-results/release-players-android.log
      - name: AC7
        run: tools/ci/android_ac7.sh 2>&1 | tee build/test-results/android-ac7.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-evidence-prebuilt-android
          path: build/android-ac7/*.log
          if-no-files-found: ignore
          retention-days: 14
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: release-prebuilt-android
          status: ${{ job.status }}

  # ------------------------------------------------------------------ publish ---
  publish:
    name: "Publish ${{ inputs.version }}${{ inputs.dry_run && ' (dry run, a draft)' || '' }}"
    needs: [player-hashes, editor-linux, editor-windows, editor-macos, prebuilt, prebuilt-android]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      JASPER_CI_REPRO: tools/ci/release.sh publish ${{ inputs.channel }} ${{ inputs.version }} ${{ inputs.commit }} build/release-assets${{ inputs.dry_run && ' --dry-run' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: ./.github/actions/free-disk
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-assets-*
          path: build/release-assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: player-archives-*
          path: build/release-assets
          merge-multiple: true
      - name: SHA256SUMS, draft, upload, publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          COMMIT: ${{ inputs.commit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          dry=()
          [[ "$DRY_RUN" == true ]] && dry=(--dry-run)
          mkdir -p build/test-results
          tools/ci/release.sh publish "$CHANNEL" "$JASPERENGINE_VERSION" "$COMMIT" build/release-assets ${dry[@]+"${dry[@]}"} \
            2>&1 | tee build/test-results/release-publish.log

  # AC9: the published AppImage, as a user downloads it, matches SHA256SUMS and downloads its own
  # player runtime from its own release (hash-checked against its table)
  published:
    name: Published release downloads its players
    needs: publish
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JASPER_CI_REPRO: tools/ci/check-published.sh ${{ inputs.version }} linux-x64-glcore-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/image
        id: image
        with:
          target: linux
      - name: The published AppImage downloads linux-x64-glcore-release from its release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/test-results
          tools/ci/check-published.sh "$JASPERENGINE_VERSION" linux-x64-glcore-release 2>&1 | tee build/test-results/release-published.log
      - uses: ./.github/actions/report
        if: always()
        with:
          lane: release-published
          status: ${{ job.status }}
