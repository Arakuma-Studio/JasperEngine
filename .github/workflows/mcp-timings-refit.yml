name: MCP timings refit

# Daily (or on demand): refits tools/mcp/ci-timings.json, the committed timings tools/ci/plan_lanes.py
# plans ci.yml's MCP shards by, from the newest CI runs' shard results (tools/ci/mcp_timings.py: robust
# medians, outliers and single samples dropped, a band against churn), and when an entry moved opens or
# updates the standing pull request from ci/mcp-timings-refit. docs/testing.md, "How the MCP shards are
# balanced".
#
# The GitHub App jasper-ci-bot (secrets CI_BOT_APP_ID, CI_BOT_APP_PRIVATE_KEY) pushes the branch, opens
# the pull request and turns on auto-merge: the workflow token may not open pull requests here, and its
# push starts no pull_request run, whose Check the ruleset requires, nor does its auto-merge enqueue. The
# App's push runs CI as any pull request's, and the merge queue lands it once Check is green.
on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-timings-refit
  cancel-in-progress: false

jobs:
  refit:
    name: Refit the MCP shard timings
    # not on a fork: its CI runs are not this repository's
    if: github.repository == 'Arakuma-Studio/JasperEngine'
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read  # the CI runs' artifacts; the App token does the writes
    env:
      BRANCH: ci/mcp-timings-refit
      RUNS: build/mcp-timings-runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the newest CI runs' MCP results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/mcp_timings.py fetch --out "$RUNS"

      - name: Refit
        id: refit
        run: |
          python3 tools/ci/mcp_timings.py refit --results "$RUNS" --write | tee build/refit.txt
          python3 tools/ci/mcp_timings.py check
          if git diff --quiet -- tools/mcp/ci-timings.json; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
          else
              echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          cat build/refit.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Mint the App token
        id: app
        if: steps.refit.outputs.changed == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the pull request
        if: steps.refit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          bot_id="$(gh api "users/$APP_SLUG%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "$bot_id+${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add tools/mcp/ci-timings.json
          git commit -q -m "ci: refit the MCP shard timings from the newest CI runs (tools/ci/mcp_timings.py)"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$BRANCH"
          {
              echo "## Problem"
              echo
              echo "The MCP shards' committed timings moved outside the band (tools/ci/mcp_timings.py refit)."
              echo
              echo "## What changed"
              echo
              echo "tools/mcp/ci-timings.json, refitted by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID:"
              echo
              echo '```'
              cat build/refit.txt
              echo '```'
              echo
              echo "## How it was verified"
              echo
              echo "\`python3 tools/ci/mcp_timings.py check\` passed; every shard plan runs the union check."
              echo
              echo "## Surfaces"
              echo
              echo "N/A: CI planning data only."
              echo
              echo "---"
              echo "By the mcp-timings-refit workflow."
          } > build/pr-body.md
          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$pr" ]]; then
              gh pr edit "$pr" --body-file build/pr-body.md
          else
              pr="$(gh pr create --base main --head "$BRANCH" --body-file build/pr-body.md \
                  --title "ci: refit the MCP shard timings from the newest CI runs")"
          fi
          # the merge queue takes it once Check is green; an auto-merge another actor turned on is
          # turned on again as the App, since the workflow token's never enqueues
          num="$(gh pr view "$pr" --json number --jq .number)"
          enabled_by="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$num" --jq '.auto_merge.enabled_by.login // empty')"
          if [[ "$enabled_by" != "${APP_SLUG}[bot]" ]]; then
              [[ -z "$enabled_by" ]] || gh pr merge "$num" --disable-auto
              gh pr merge "$num" --merge --auto
          fi
