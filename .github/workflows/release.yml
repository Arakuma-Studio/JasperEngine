name: Release

# A stable release (docs/superpowers/specs/2026-11-12-ci-design.md §12.1): vX.Y.Z on a commit of
# main, by default the newest nightly's, so stable ships what nightly users already ran. The tag is
# created and checked (tools/ci/check-release-tag.sh), then build-release.yml builds, checks and
# publishes everything from that commit. A dry run tags only inside the job, never pushes the tag,
# and stops at a complete draft (delete it afterwards: gh release delete <version> --yes).
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version, vX.Y.Z (three parts)
        type: string
        required: true
      commit:
        description: "The commit to release (default: the newest nightly's); an ancestor of main"
        type: string
        default: ''
      dry_run:
        description: Dry run (build and check everything, leave a draft, push no tag)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag ${{ inputs.version }}
    # the workflows a release runs are main's
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      # every branch and tag: main to check ancestry, the tags to refuse a moved one
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          if [[ -z "$COMMIT" ]]; then
            found="$(tools/ci/release.sh newest-nightly)"
            [[ -n "$found" ]] || { echo "::error::no nightly release to take the commit from: give the commit"; exit 1; }
            read -r nightly COMMIT <<< "$found"
            echo "the newest nightly, $nightly, is $COMMIT"
          fi
          COMMIT="$(git rev-parse --verify --quiet "$COMMIT^{commit}")" \
            || { echo "::error::$COMMIT is not a commit of this repository"; exit 1; }
          tools/ci/release.sh check stable "$VERSION" "$COMMIT"
          git merge-base --is-ancestor "$COMMIT" origin/main \
            || { echo "::error::$COMMIT is not on main"; exit 1; }
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Create and check the tag
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          if at="$(git rev-parse --verify --quiet "refs/tags/$VERSION^{commit}")"; then
            [[ "$at" == "$COMMIT" ]] || { echo "::error::$VERSION already tags $at, not $COMMIT"; exit 1; }
            echo "$VERSION already tags $COMMIT"
          else
            git tag "$VERSION" "$COMMIT"
          fi
          tools/ci/check-release-tag.sh "$VERSION" "$COMMIT"
      - name: Push the tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: git push origin "refs/tags/$VERSION"

  build:
    name: Build and publish
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/build-release.yml
    with:
      channel: stable
      version: ${{ inputs.version }}
      commit: ${{ needs.tag.outputs.commit }}
      dry_run: ${{ inputs.dry_run }}
