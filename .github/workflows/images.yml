name: Images

# The build images on GHCR (docs/superpowers/specs/2026-11-12-ci-design.md §10.1):
# ghcr.io/<owner>/jasperengine-<target>-build:<tools/build.sh image-tag <target>> and :latest, which every
# lane's image action pulls. A push to main that changes docker/ (or how the tag is computed) builds
# the tags the registry lacks; the weekly run rebuilds every image without the layer cache, so base image
# and apt drift shows up here first, and deletes the untagged versions older than 30 days.
on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'tools/build.sh'
      - '.github/workflows/images.yml'
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild and push every image without the layer cache, even when its tag exists
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: images
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REBUILD: ${{ github.event_name == 'schedule' || inputs.rebuild == true }}

jobs:
  images:
    name: ${{ matrix.targets }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # linux-backends is FROM the linux image by its hash (docker/linux-backends.Dockerfile's BASE),
        # so it follows it in the same job
        targets: [linux linux-backends, web, android, runtime]
    env:
      TARGETS: ${{ matrix.targets }}
      OWNER: ${{ github.repository_owner }}
      SOURCE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/free-disk
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # the registry's layer cache (:buildcache), never the Actions cache: the web image alone would take
      # 40% of its 10 GB
      - name: Build and push
        run: |
          registry="ghcr.io/${OWNER,,}"
          for target in $TARGETS; do
              name="$registry/jasperengine-$target-build"
              tag="$(tools/build.sh image-tag "$target")"
              if [[ "$REBUILD" != true ]] && docker buildx imagetools inspect "$name:$tag" > /dev/null 2>&1; then
                  echo "$name:$tag is in the registry"
                  continue
              fi
              args=(--push --provenance=false --sbom=false
                    --label "org.opencontainers.image.source=$SOURCE"
                    -t "$name:$tag" -t "$name:latest"
                    --cache-to "type=registry,ref=$name:buildcache,mode=max"
                    -f "docker/$target.Dockerfile")
              if [[ "$REBUILD" == true ]]; then args+=(--no-cache); else args+=(--cache-from "type=registry,ref=$name:buildcache"); fi
              if [[ "$target" == linux-backends ]]; then
                  args+=(--build-arg "BASE=$registry/jasperengine-linux-build:$(tools/build.sh image-tag linux)")
              fi
              echo "docker buildx build ${args[*]} docker"
              docker buildx build "${args[@]}" docker
          done

  prune:
    name: Delete old untagged versions
    needs: images
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Untagged versions older than 30 days
        run: |
          owner="${OWNER,,}"
          # organization or user packages
          scope=users
          [[ "$(gh api "users/$OWNER" --jq .type)" == Organization ]] && scope=orgs
          cutoff="$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          for target in linux web android linux-backends runtime; do
              package="jasperengine-$target-build"
              versions="$(gh api --paginate "$scope/$owner/packages/container/$package/versions" \
                  --jq ".[] | select((.metadata.container.tags | length) == 0 and .created_at < \"$cutoff\") | .id" 2>&1)" \
                  || { echo "$package: $versions"; continue; }
              for id in $versions; do
                  echo "$package: delete version $id"
                  gh api -X DELETE "$scope/$owner/packages/container/$package/versions/$id"
              done
          done
