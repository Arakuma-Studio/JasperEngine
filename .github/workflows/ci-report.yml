# The CI report comment for pull requests from forks (design §11.2). A fork's CI run has a read-only
# token, so its comment is posted from here: workflow_run runs this file from the default branch with
# the permissions below, and never checks out or runs the pull request's code. The run's artifacts
# are untrusted data, which tools/ci/report.py size-limits, validates and escapes. Same-repository
# pull requests, the merge queue and main are reported by ci.yml's report job.
name: CI report (forks)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ci-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  report:
    name: Report on the fork's pull request
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Check out the default branch's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            tools/ci/report.py
            .github/workflows/ci.yml
          sparse-checkout-cone-mode: false
      - name: Download the run's lane reports (untrusted)
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: ci-report-*
          path: ${{ runner.temp }}/reports
      - name: Download the run's plan (untrusted)
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: plan
          path: ${{ runner.temp }}/plan
      - name: Render and post the comment
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_LABEL: ${{ github.event.workflow_run.head_repository.owner.login }}:${{ github.event.workflow_run.head_branch }}
          STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: |
          set -euo pipefail
          python3 -I tools/ci/report.py render --reports "$RUNNER_TEMP/reports" --lanes "$RUNNER_TEMP/plan/lanes.json" \
            --run-url "$RUN_URL" --sha "$HEAD_SHA" --advisory-from .github/workflows/ci.yml --started-at "$STARTED_AT" \
            --out "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          python3 -I tools/ci/report.py post --head-sha "$HEAD_SHA" --head-label "$HEAD_LABEL" --body "$RUNNER_TEMP/comment.md"
