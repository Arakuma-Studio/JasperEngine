name: Restore ccache
description: >
  Restores the newest ccache-<lane>-<toolchain>- entry of the Actions cache into build/.cache/ccache (the
  directory tools/build.sh and tools/smoke-test.sh mount at /ccache), installs ccache where the lane compiles
  on the runner (Windows: the pinned release zip of tools/ci/ccache_windows.sh, cached; macOS: brew), and
  sets CCACHE_DIR, and CCACHE_MAXSIZE to 0 (tools/build.sh
  forwards it into the image): the build runs without a cap, which ccache-save applies to what it saves.
  An overflow runner on macOS or Windows uses its own capped cache in its tool cache instead of the entry.
  A Namespace runner with a cache volume (NSC_CACHE_PATH, the lane's: tools/ci/plan_lanes.py
  NAMESPACE_CACHE) keeps the cache there instead: Linux binds build/.cache/ccache onto it
  (nscloud-cache-action), macOS points CCACHE_DIR into it. ccache-save writes the entry back, or trims
  the volume's, on push to main only (docs/superpowers/specs/2026-11-12-ci-design.md §10.2): Namespace
  commits a volume from main's jobs only.
inputs:
  lane:
    description: The cache's lane (linux, unit-core, unit-editor, asan-core, asan-editor, htmlui, smoke, web, android, windows-editor, windows-engine-glcore, windows-engine-d3d11, windows-engine-vulkan, windows-compile, macos)
    required: true
  max-size:
    description: The lane's cap (§10.2), what ccache-save cuts the saved entry to
    required: true
  toolchain:
    description: >
      What the objects depend on besides the sources: the image tag on Linux lanes. Empty: the MSVC tools
      version on Windows, the Xcode version on macOS.
    required: false
    default: ''
runs:
  using: composite
  steps:
    # Windows: the release zip, not Chocolatey, which exited 0 with nothing installed in its outage (run
    # 46050080028); the zip (1.8 MB) is cached under the script's hash, which holds its pins
    - name: Find ccache
      id: find
      if: runner.os == 'Windows'
      shell: bash
      run: |
        if command -v ccache > /dev/null; then echo "found=1" >> "$GITHUB_OUTPUT"; fi
        echo "dist=$(cygpath -m "$RUNNER_TEMP")/ccache-dist" >> "$GITHUB_OUTPUT"
    - name: Cache the ccache zip
      if: runner.os == 'Windows' && steps.find.outputs.found != '1'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.find.outputs.dist }}/*.zip
        key: ccache-dist-windows-${{ hashFiles('tools/ci/ccache_windows.sh') }}
    - name: Install ccache
      if: runner.os != 'Linux'
      shell: bash
      env:
        DIST: ${{ steps.find.outputs.dist }}
      run: |
        if ! command -v ccache > /dev/null; then
            if [[ "$RUNNER_OS" == Windows ]]; then
                tools/ci/ccache_windows.sh "$DIST"
                # (what it added to GITHUB_PATH, which applies from the next step on)
                PATH="$(cygpath -u "$(tail -n 1 "$GITHUB_PATH")"):$PATH"
            else
                tools/ci/retry.sh brew install ccache
            fi
        fi
        # (a directory of its own: without CCACHE_DIR, which the next step sets, Windows ccache reads its
        # configuration from LOCALAPPDATA, which an overflow runner's job environment does not have)
        CCACHE_DIR="$RUNNER_TEMP/ccache-version" ccache --version | sed -n 1p

    - name: Cache key
      id: key
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
        GIVEN_TOOLCHAIN: ${{ inputs.toolchain }}
        MAX_SIZE: ${{ inputs.max-size }}
      run: |
        toolchain="$GIVEN_TOOLCHAIN"
        if [[ -z "$toolchain" && "$RUNNER_OS" == Windows ]]; then toolchain="msvc${VCToolsVersion:-unknown}"; fi
        if [[ -z "$toolchain" && "$RUNNER_OS" == macOS ]]; then toolchain="$(xcodebuild -version | sed -n 1p | tr -cd 'A-Za-z0-9.')"; fi
        [[ -n "$toolchain" ]] || { echo "::error::ccache-restore: no toolchain for lane $LANE"; exit 1; }
        prefix="ccache-$LANE-$toolchain-"
        # absolute (a compiler runs in its build directory); D:/... on Windows
        dir="$(pwd -W 2> /dev/null || pwd)/build/.cache/ccache"
        mkdir -p build/.cache/ccache
        maxsize=0
        if [[ "$RUNNER_ENVIRONMENT" == self-hosted && "$RUNNER_OS" != Linux && "$RUNNER_NAME" == je-* ]]; then
            # an overflow machine of the user's (je-*; not another self-hosted runner of the organization)
            # keeps its own capped cache between jobs, outside the workspace its hook
            # empties: the hosted entry's paths miss there (0 of 3,834 compiles, run 45104498209) and took
            # 7.5 min to download. (Linux lanes mount build/.cache/ccache into the image: restored as here)
            dir="$(cygpath -m "$RUNNER_TOOL_CACHE" 2> /dev/null || echo "$RUNNER_TOOL_CACHE")/ccache/$LANE"
            mkdir -p "$dir"
            maxsize=3G
            echo "JASPER_CCACHE_LOCAL=1" >> "$GITHUB_ENV"
        elif [[ -n "${NSC_CACHE_PATH:-}" && "$RUNNER_OS" != Windows ]]; then
            # a Namespace runner's cache volume, a fork of what main's jobs last committed: no download;
            # the cap and the trim stay ccache-save's (docs/testing.md "Namespace runners")
            [[ "$RUNNER_OS" == Linux ]] || dir="$NSC_CACHE_PATH/ccache/$LANE"
            mkdir -p "$dir"
            echo "JASPER_CCACHE_VOLUME=1" >> "$GITHUB_ENV"
            echo "ccache-restore: the Namespace cache volume at $NSC_CACHE_PATH (runner $RUNNER_NAME)"
        fi
        {
            echo "CCACHE_DIR=$dir"
            # no cap while building: a cleanup in the middle of a build evicts restored entries before the
            # build reaches them (ccache-save cuts the saved entry to the cap)
            echo "CCACHE_MAXSIZE=$maxsize"
            echo "JASPER_CCACHE_CAP=$MAX_SIZE"
            echo "JASPER_CCACHE_LANE=$LANE"
            echo "JASPER_CCACHE_KEY=$prefix$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "JASPER_CCACHE_MARKER=$RUNNER_TEMP/ccache-$LANE.marker"
        } >> "$GITHUB_ENV"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

    # (after the checkout, which would empty the bound directory)
    - name: Bind the cache volume
      if: env.JASPER_CCACHE_VOLUME == '1' && runner.os == 'Linux'
      uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
      with:
        path: build/.cache/ccache

    - name: Restore
      if: env.JASPER_CCACHE_LOCAL != '1' && env.JASPER_CCACHE_VOLUME != '1'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build/.cache/ccache
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    # what ccache-save compares against: an entry written after this is new, one older than it unused
    - name: Mark the restored state
      shell: bash
      run: |
        touch "$JASPER_CCACHE_MARKER"
        {
            echo "JASPER_CCACHE_START=$(date +%s)"
            echo "JASPER_CCACHE_RESTORED_SIZE=$(du -sh "$CCACHE_DIR" | cut -f1)"
        } >> "$GITHUB_ENV"
