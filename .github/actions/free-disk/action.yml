name: Free disk
description: >
  GitHub's Linux runners: when / has less free than the job needs, removes the preinstalled Android SDK,
  .NET, GHC, the CodeQL bundle and every Docker image (free-disk.sh). Without need it always removes them.
  Does nothing on Windows and macOS, nor on an overflow runner (a person's machine: its hooks clean the
  job's workspace and prune the images CI pulled, docs/testing.md "Overflow runners").
inputs:
  need:
    description: >
      The GB free on / the job needs: its measured peak use with a margin (docs/testing.md "CI", "Job
      setup"). Empty: always remove.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Free disk
      if: runner.os == 'Linux' && runner.environment != 'self-hosted'
      shell: bash
      env:
        NEED: ${{ inputs.need }}
      run: '"$GITHUB_ACTION_PATH/free-disk.sh"'
