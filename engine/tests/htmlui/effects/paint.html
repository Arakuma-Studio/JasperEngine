<!DOCTYPE html>
<!-- The golden fixture of paint effects (phase-5 spec 5.2): the declaration is the effect's declaration. -->
<html>
<head>
<style>
html, body { margin: 0; width: 360px; height: 240px; overflow: hidden; background: #101218; }
#fx { position: absolute; left: 20px; top: 20px; width: 320px; height: 200px; border-radius: 12px; __DECL__; }
</style>
</head>
<body><div id="fx"></div></body>
</html>
