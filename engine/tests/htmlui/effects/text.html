<!DOCTYPE html>
<!-- The gradient-text fixture of paint effects (phase-5 spec 5.2): the effect fills "JASPER"
     (the declaration is its background-image; background-clip: text with a transparent text color). -->
<html>
<head>
<style>
html, body { margin: 0; width: 360px; height: 240px; overflow: hidden; background: #101218; }
#fx { position: absolute; left: 20px; top: 70px; width: 320px; height: 100px; font-family: sans-serif; font-size: 48px; line-height: 100px;
      font-weight: bold; text-align: center; color: transparent; __DECL__; background-clip: text; }
</style>
</head>
<body><div id="fx">JASPER</div></body>
</html>
