<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>S16 B7: virtual-list</title>
<!-- S16 benchmark B7 (engine/tests/htmlui/RenderPerfTest.cpp): an S17 <list-view> of 10 000 rows
     (a C++ provider binds them) scrolled 100 px a frame: rounded rows with a border, an icon
     image, a badge and two labels inside a rounded, clipped pane; the rows recycle as they
     scroll. Budgets: <= 16 draws, no stencil draw, the engine time of the baseline. -->
<style>
  html, body { margin: 0; width: 1280px; height: 720px; background-color: #14161c; font-family: sans-serif; }
  #pane { position: absolute; left: 40px; top: 40px; width: 560px; height: 640px; border-radius: 10px;
          background-color: #1c1f28; border: 1px solid #2c3140; overflow: hidden; }
  #list { position: absolute; left: 0; top: 0; width: 560px; height: 640px; }
  .row { position: relative; height: 44px; margin: 2px 8px; box-sizing: border-box; border: 1px solid #3a4152;
         border-radius: 6px; background-color: #262b38; }
  .row img { position: absolute; left: 8px; top: 6px; width: 32px; height: 32px; }
  .name { position: absolute; left: 50px; top: 5px; color: #f0f2f8; font-size: 15px; }
  .zone { position: absolute; left: 50px; top: 25px; color: #9aa3b8; font-size: 12px; }
  .level { position: absolute; right: 10px; top: 11px; padding: 2px 8px; border-radius: 9px; background-color: #3a5a9a;
           color: #ffffff; font-size: 12px; }
</style>
</head>
<body>
  <div id="pane">
    <list-view id="list" item-height="48" selection="none">
      <template><div class="row"><img src="../common/checker.png"><span class="name"></span><span class="zone"></span><span class="level"></span></div></template>
    </list-view>
  </div>
</body>
</html>
