<!DOCTYPE html>
<html>
<head>
<title>scheme-prompt</title>
<style>
    html, body { margin: 0; width: 640px; height: 360px; }
</style>
</head>
<body>
    <p>Jump: <input-prompt id="jump" action="Gameplay/Jump"></input-prompt></p>
    <p><input-prompt id="glyph" action="Gameplay/Jump"><span class="glyph">art</span></input-prompt></p>
    <p><input-prompt id="touch" action="Gameplay/Jump" scheme="touch"></input-prompt></p>
</body>
</html>
