<html>
<head>
    <link type="text/css" href="../../common/base.css"/>
    <link type="text/css" href="vector.css"/>
    <style>
        #icon24 { left: 20px; top: 20px; width: 24px; height: 24px; }
        #icon64 { left: 60px; top: 20px; width: 64px; height: 64px; }

        #decorated { left: 200px; top: 300px; width: 64px; height: 64px; decorator: svg(../../common/icon.svg); }
        #decocrop { left: 290px; top: 300px; width: 64px; height: 64px; decorator: svg(crop.svg crop-to-content); }
    </style>
</head>
<body>
    <svg id="icon24" class="abs" src="../../common/icon.svg"/>
    <svg id="icon64" class="abs" src="../../common/icon.svg"/>
    <svg id="icon256" class="abs" src="../../common/icon.svg"/>
    <svg id="crop" class="abs" src="crop.svg" crop-to-content="crop-to-content"/>
    <svg id="nocrop" class="abs" src="crop.svg"/>
    <svg id="tint" class="abs" src="white.svg"/>
    <svg id="tintfade" class="abs" src="white.svg"/>
    <div id="decorated" class="abs"/>
    <div id="decocrop" class="abs"/>

</html>
