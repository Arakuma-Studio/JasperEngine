<html>
<head>
    <link type="text/css" href="../common/base.css"/>
    <link type="text/css" href="p1.css"/>
    <style>
        /* G12: linear gradients at 0/45/90/180deg, five stops, repeating */
        .g { width: 110px; height: 110px; }
        #a0 { left: 10px; top: 10px; decorator: linear-gradient(0deg, #ff0000, #0000ff); }
        #a45 { left: 135px; top: 10px; decorator: linear-gradient(45deg, #ff0000, #0000ff); }
        #a90 { left: 260px; top: 10px; decorator: linear-gradient(90deg, #ff0000, #0000ff); }
        #a180 { left: 385px; top: 10px; decorator: linear-gradient(180deg, #ff0000, #0000ff); }
        #five { left: 10px; top: 150px; width: 490px; height: 80px;
                decorator: linear-gradient(90deg, #ff0000 0%, #ffff00 25%, #00ff00 50%, #00ffff 75%, #0000ff 100%); }
        #repeat { left: 10px; top: 260px; width: 490px; height: 80px;
                  decorator: repeating-linear-gradient(90deg, #000000 0px, #ffffff 50px, #000000 100px); }
    </style>
</head>
<body>
    <div id="a0" class="abs g"/><div id="a45" class="abs g"/><div id="a90" class="abs g"/><div id="a180" class="abs g"/>
    <div id="five" class="abs"/>
    <div id="repeat" class="abs"/>
</body>
</html>
