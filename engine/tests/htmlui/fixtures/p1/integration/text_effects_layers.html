<html>
<head>
    <link type="text/css" href="../../common/base.css"/>
    <link type="text/css" href="../p1.css"/>
    <style>
        /* p1-integrate: font effects drawn inside layers and filters (512x384) */
        .t { font-size: 28px; color: #ffffff; }
        #row1 { left: 16px; top: 8px; filter: opacity(0.5); font-effect: shadow(3px 3px #ff0000); }
        #row2 { left: 16px; top: 56px; filter: blur(1px); font-effect: outline(2px #0080ff); }
        #back { left: 0px; top: 104px; width: 512px; height: 56px; decorator: linear-gradient(90deg, #ff8000, #8000ff); }
        #row3 { left: 16px; top: 104px; width: 300px; height: 56px; backdrop-filter: blur(6px);
                background-color: #00000040; font-effect: glow(2px 4px 0px 0px #40ff40); }
        #row4 { left: 16px; top: 168px; width: 150px; height: 44px; overflow: hidden; border-radius: 20px;
                background-color: #404040; }
        #row4 div { position: absolute; left: 8px; top: 4px; white-space: nowrap; font-effect: outline(2px #ff00ff); }
        #row5 { left: 16px; top: 224px; mask-image: linear-gradient(90deg, #000000ff, #00000000); font-effect: shadow(2px 2px #00ffff); }
        #row6 { left: 250px; top: 280px; transform: rotate(-10deg); filter: drop-shadow(#ffff00 4px 4px 2px);
                font-effect: blur(3px #ff0000); }
    </style>
</head>
<body>
    <div id="row1" class="abs t">Opacity group</div>
    <div id="row2" class="abs t">Blur filter</div>
    <div id="back" class="abs"></div>
    <div id="row3" class="abs t">Backdrop glass</div>
    <div id="row4" class="abs t"><div>Clipped outline text</div></div>
    <div id="row5" class="abs t">Masked shadow text</div>
    <div id="row6" class="abs t">Rotated</div>
</body>
</html>
