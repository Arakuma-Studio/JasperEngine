<html>
<head>
    <title>integration</title>
    <link type="text/css" href="../../common/base.css"/>
    <style>
        /* p1-integrate: one screen document using every phase-1 feature at once (rounded
           clip, filter, text effect, gradient, SVG, Lottie, data model, form field) on a
           transparent body; 640x360 view */
        body { position: absolute; left: 0; top: 0; width: 100%; height: 100%; margin: 0; padding: 0; }
        .abs { position: absolute; }
        #clip { left: 16px; top: 16px; width: 120px; height: 90px; overflow: hidden; border-radius: 24px; background-color: #2040c0; }
        #clip img { width: 200px; height: 200px; }
        #fx { left: 160px; top: 16px; width: 140px; height: 50px; filter: drop-shadow(#000000 4px 4px 2px);
              font-size: 24px; color: #ffffff; font-effect: outline(2px #ff0000); }
        #grad { left: 320px; top: 16px; width: 120px; height: 60px; decorator: linear-gradient(90deg, #ff0000, #0000ff); }
        #icon { left: 460px; top: 16px; width: 48px; height: 48px; image-color: #00ff00; }
        #spin { left: 16px; top: 140px; width: 100px; height: 100px; }
        #hud { left: 160px; top: 140px; font-size: 20px; }
        #buy { left: 160px; top: 200px; width: 100px; height: 40px; background-color: #808080; }
        #name { left: 300px; top: 200px; width: 160px; height: 30px; font-size: 20px; background-color: #ffffff; color: #000000; display: block; }
        #box { left: 480px; top: 140px; width: 40px; height: 40px; background-color: #ffff00; }
    </style>
</head>
<body>
    <div id="clip" class="abs"><img src="../../common/checker.png"/></div>
    <div id="fx" class="abs">Effects</div>
    <div id="grad" class="abs"></div>
    <svg id="icon" class="abs" src="../vector/white.svg"/>
    <lottie id="spin" class="abs" src="../lottie/shapes.json" autoplay="autoplay" loop="loop"/>
    <div id="hud" class="abs" data-model="hud">Gold: <span id="gold">{{ gold }}</span></div>
    <div id="buy" class="abs">Buy</div>
    <input id="name" class="abs" type="text" value=""/>
    <div id="box" class="abs"></div>
</body>
</html>
