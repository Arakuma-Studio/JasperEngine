<html>
<head>
    <title>clock animation</title>
    <style>
        body { width: 100%; height: 100%; margin: 0px; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        #box { position: absolute; left: 0px; top: 0px; width: 100px; height: 100px; background-color: #ff0000ff; animation: 10s linear-in-out fade; }
    </style>
</head>
<body>
    <div id="box"></div>
</body>
</html>
