<html>
<head>
    <title>texture input</title>
    <link type="text/css" href="../common/base.css"/>
    <style>
        /* a TEXTURE-mode document for world-space input: two opaque quadrants on a
           transparent body (pointer input passes through the body) */
        body { position: absolute; left: 0; top: 0; width: 100%; height: 100%; margin: 0; padding: 0; }
        #tl { position: absolute; left: 0; top: 0; width: 50%; height: 50%; background-color: #ff0000; }
        #br { position: absolute; left: 50%; top: 50%; width: 50%; height: 50%; background-color: #0000ff; }
    </style>
</head>
<body>
    <div id="tl"></div>
    <div id="br"></div>
</body>
</html>
