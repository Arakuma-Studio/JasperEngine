<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>text: the zero-width space</title>
<style>
  /* U+200B is invisible and a line-break opportunity (CSS Text 3 §5.1): Taffy's fixtures build their
     min-content sizes from "HHHH&ZeroWidthSpace;HHHH". The font (Ahem) has no U+200B glyph: it must not
     switch the text after it to a fallback face. */
  @font-face { font-family: "Ahem"; src: url("../../../fonts/Ahem.ttf") format("truetype"); }
  html, body { margin: 0; }
  #row { position: absolute; left: 10px; top: 10px; font-family: "Ahem"; font-size: 10px; line-height: 1; color: #202060; display: flex; }
  #min { position: absolute; left: 10px; top: 40px; width: 0; font-family: "Ahem"; font-size: 10px; line-height: 1; color: #206020; }
</style>
</head>
<body>
<div id="row"><div id="row-item">HH&ZeroWidthSpace;HH</div></div>
<div id="min"><span id="min-text">HHH&ZeroWidthSpace;HH&ZeroWidthSpace;H</span></div>
</body>
</html>
