<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>text: line-break opportunities (UAX #14 as Chromium tailors it)</title>
<style>
  /* Where lines wrap inside words, UAX #14 (Unicode 16.0) as Chromium 153 applies it: flags break between regional-indicator pairs (LB30a), emoji with skin-tone modifiers and ZWJ sequences stay together (LB30b, LB8a) and break between each other, numbers and prices stay together (LB25), small kana break as ideographs, ideographs break before and after digits, em dash pairs hold (LB17), quotation marks hold to their words (LB15a/b, LB19); Chromium's own table between ASCII characters: after '?', after '-' (before a digit only after a letter or digit), before '(' after punctuation. The characters Ahem has no glyph for are its .notdef box on both sides. */
  @font-face { font-family: "Ahem"; src: url("../../../fonts/Ahem.ttf") format("truetype"); }
  html, body { margin: 0; }
  body { font-family: "Ahem"; font-size: 10px; line-height: 1; color: #203040; }
  .b { position: absolute; background: #e0e8f0; }
</style>
</head>
<body>
<div class="b" id="flags" style="left: 10px; top: 10px; width: 45px">&#x1F1EB;&#x1F1F7;&#x1F1E9;&#x1F1EA;&#x1F1EE;&#x1F1F9;&#x1F1EA;&#x1F1F8;</div>
<div class="b" id="skin-tones" style="left: 65px; top: 10px; width: 25px">&#x1F44D;&#x1F3FD;&#x1F44D;&#x1F3FB;&#x1F44D;&#x1F3FF;</div>
<div class="b" id="zwj" style="left: 100px; top: 10px; width: 35px">&#x1F468;&#x200D;&#x1F469;&#x200D;&#x1F467;&#x1F468;&#x200D;&#x1F469;&#x200D;&#x1F467;</div>
<div class="b" id="numbers" style="left: 145px; top: 10px; width: 30px">$(12.35) 1,234.50% -1/12 &#x20B9;1,00</div>
<div class="b" id="hyphen-digits" style="left: 185px; top: 10px; width: 50px">1234-5678 ab-12 (-12)</div>
<div class="b" id="question" style="left: 245px; top: 10px; width: 40px">foo?bar a?(b)</div>
<div class="b" id="punctuation" style="left: 10px; top: 70px; width: 40px">word!(note) x(y)z ab;[cd]</div>
<div class="b" id="kana" style="left: 60px; top: 70px; width: 25px">&#x3041;&#x3043;&#x3045;&#x3047;&#x3049;</div>
<div class="b" id="cjk-digits" style="left: 95px; top: 70px; width: 35px">&#x6F22;&#x5B57;123&#x6F22;&#x5B57;</div>
<div class="b" id="dashes" style="left: 140px; top: 70px; width: 30px">XX&#x2014;&#x2014;XX XX&#x2014;XX</div>
<div class="b" id="quotes" style="left: 180px; top: 70px; width: 40px">&#xAB;XX&#xBB;YY &#x201C;XXX&#x201D;</div>
<div class="b" id="words" style="left: 230px; top: 70px; width: 40px">http://a.b/c-d e.g. x/y</div>
</body>
</html>
