<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>text: letter-spacing and word-spacing</title>
<style>
  /* letter-spacing as a length and a percentage of the font size (after every letter), word-spacing after spaces and no-break spaces; Ahem: every advance is exact. */
  @font-face { font-family: "Ahem"; src: url("../../../fonts/Ahem.ttf") format("truetype"); }
  @font-face { font-family: "Roboto Text"; src: url("../../../fonts/Roboto-Regular-subset-post.ttf") format("truetype"); }
  html, body { margin: 0; }
  body { font-family: "Ahem"; font-size: 10px; line-height: 1; color: #203040; }
  .row { position: absolute; left: 10px; white-space: nowrap; }
  span { display: inline-block; background: #e0e8f0; }
</style>
</head>
<body>
<div class="row" style="top: 10px"><span id="ls-px" style="letter-spacing: 2px">XXXX</span></div>
<div class="row" style="top: 30px"><span id="ls-pct" style="letter-spacing: 50%">XXXX</span></div>
<div class="row" style="top: 50px"><span id="ls-neg" style="letter-spacing: -2px">XXXX</span></div>
<div class="row" style="top: 70px"><span id="ws-px" style="word-spacing: 6px">X X&nbsp;X</span></div>
<div class="row" style="top: 90px"><span id="ws-em" style="word-spacing: 1em; font-size: 20px">X X</span></div>
<div class="row" style="top: 120px"><span id="ws-pct" style="word-spacing: 50%">XX XX XX</span></div>
<div class="row" style="top: 140px"><span id="both" style="word-spacing: 4px; letter-spacing: 1px">XX XX</span></div>
<div class="row" style="top: 160px; letter-spacing: 0.5em"><span id="inherited" style="font-size: 20px">XX</span></div>
</body>
</html>
