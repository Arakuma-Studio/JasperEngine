<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>testkit: boxes that must match</title>
<style>
  /* Solid, pixel-aligned boxes: the engine and Chromium must agree on every pixel and box. */
  html, body { margin: 0; }
  #a { position: absolute; left: 20px; top: 20px; width: 120px; height: 80px; background-color: #3366cc; }
  #b { position: absolute; left: 160px; top: 40px; width: 60px; height: 60px; background-color: #cc3333; border: 4px solid #222222; }
  #c { position: absolute; left: 40px; top: 120px; width: 200px; height: 30px; background-color: rgba(0, 128, 0, 0.5); }
  #d { position: absolute; left: 20px; top: 160px; width: 260px; height: 20px; display: flex; }
  #d1, #d2 { flex: 1; height: 20px; }
  #d1 { background-color: #ffcc00; }
  #d2 { background-color: #00ccff; }
</style>
</head>
<body><div id="a"></div><div id="b"></div><div id="c"></div><div id="d"><div id="d1"></div><div id="d2"></div></div></body>
</html>
