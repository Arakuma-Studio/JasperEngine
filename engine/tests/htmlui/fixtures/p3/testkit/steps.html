<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>testkit: every step kind</title>
<style>
  html, body { margin: 0; }
  #box { position: absolute; left: 20px; top: 20px; width: 100px; height: 40px; background-color: #4060a0; transition: width 1s linear; }
  #box.wide { width: 300px; }
  #hover { position: absolute; left: 20px; top: 80px; width: 80px; height: 40px; background-color: #888888; }
  #hover:hover { background-color: #e08020; }
  #pressed { position: absolute; left: 120px; top: 80px; width: 40px; height: 40px; background-color: #555555; }
  #pressed:active { background-color: #20a0e0; }
  #focus { position: absolute; left: 180px; top: 80px; width: 40px; height: 40px; background-color: #666666; }
  #focus:focus { background-color: #20a040; outline: none; }
  #scroller { position: absolute; left: 240px; top: 80px; width: 80px; height: 60px; overflow: hidden; }
  #stripe1, #stripe2, #stripe3 { width: 80px; height: 50px; }
  #stripe1 { background-color: #aa2222; }
  #stripe2 { background-color: #22aa22; }
  #stripe3 { background-color: #2222aa; }
  #attr { position: absolute; left: 20px; top: 150px; width: 60px; height: 30px; background-color: #999999; }
  #attr[data-state="on"] { background-color: #cc00cc; }
  #styled { position: absolute; left: 100px; top: 150px; width: 60px; height: 30px; background-color: #333333; }
  #klass { position: absolute; left: 180px; top: 150px; width: 60px; height: 30px; }
  #klass.red { background-color: #ff0000; }
</style>
</head>
<body>
<div id="box"></div>
<div id="hover"></div><div id="pressed"></div><div id="focus" tabindex="0"></div>
<div id="scroller"><div id="stripe1"></div><div id="stripe2"></div><div id="stripe3"></div></div>
<div id="attr"></div><div id="styled"></div><div id="klass" class="red"></div>
</body>
</html>
