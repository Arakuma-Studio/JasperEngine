<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>paint: border shorthands in any order</title>
<style>
  /* border and border-<side> take width, style and color in any order; omitted parts reset */
  html, body { margin: 0; background: #ffffff; }
  div { position: absolute; width: 40px; height: 30px; background-color: #f0f0f0; }
  #a { left: 10px; top: 10px; border: 4px solid #cc3333; }
  #b { left: 70px; top: 10px; border: solid #3366cc 4px; }
  #c { left: 130px; top: 10px; border: #339933 4px solid; }
  #d { left: 190px; top: 10px; border: 2px solid #000000; border-left: dashed 6px #cc3333; }
  #e { left: 10px; top: 70px; border: 4px solid #cc3333; border-top: 6px; }
  #f { left: 70px; top: 70px; border-style: solid; border-width: 1px 2px 3px 4px; border-color: #cc3333 #3366cc #339933 #000000; }
  #g { left: 130px; top: 70px; border: thick double #3366cc; }
  #h { left: 190px; top: 70px; border-bottom: medium solid #339933; border-right: thin solid #cc3333; }
  #i { left: 10px; top: 130px; border: 5px hidden #cc3333; }
  #j { left: 70px; top: 130px; border: 3px solid; color: #9933cc; }
</style>
</head>
<body><div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div><div id="e"></div><div id="f"></div><div id="g"></div><div id="h"></div><div id="i"></div><div id="j"></div></body>
</html>
