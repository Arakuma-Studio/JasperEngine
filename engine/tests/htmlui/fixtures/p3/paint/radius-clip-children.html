<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>paint: rounded clipping</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  .clip { position: absolute; overflow: hidden; background-color: #dddddd; }
  .clip > div { width: 100%; height: 50%; }
  .top { background-color: #cc3333; }
  .bottom { background-color: #3366cc; }
  #a { left: 10px; top: 10px; width: 80px; height: 80px; border-radius: 50%; }
  #b { left: 110px; top: 10px; width: 120px; height: 60px; border-radius: 40px / 20px; }
  #c { left: 250px; top: 10px; width: 60px; height: 80px; border-radius: 30% 10px; border: 6px solid #222222; }
  #d { left: 10px; top: 110px; width: 120px; height: 60px; border-radius: 20px; padding: 10px; border: 4px solid #339966; }
  #e { left: 170px; top: 110px; width: 100px; height: 60px; border-radius: 100px 0 100px 0; }
</style>
</head>
<body><div id="a" class="clip"><div class="top"></div><div class="bottom"></div></div><div id="b" class="clip"><div class="top"></div><div class="bottom"></div></div><div id="c" class="clip"><div class="top"></div><div class="bottom"></div></div><div id="d" class="clip"><div class="top"></div><div class="bottom"></div></div><div id="e" class="clip"><div class="top"></div><div class="bottom"></div></div></body>
</html>
