<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>paint: dotted borders, square and rounded</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  div { position: absolute; border: 0 dotted #cc3333; }
  #a { left: 10px; top: 10px; width: 80px; height: 40px; border-width: 8px; }
  #b { left: 120px; top: 10px; width: 80px; height: 40px; border-width: 8px; border-radius: 20px; }
  #c { left: 230px; top: 10px; width: 60px; height: 60px; border-width: 6px; border-radius: 50%; border-color: #3366cc; }
  #d { left: 10px; top: 90px; width: 80px; height: 40px; border-width: 2px; }
  #e { left: 120px; top: 90px; width: 80px; height: 40px; border-width: 4px; border-radius: 10px; }
  #f { left: 230px; top: 100px; width: 80px; height: 30px; border-width: 1px; }
</style>
</head>
<body><div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div><div id="e"></div><div id="f"></div></body>
</html>
