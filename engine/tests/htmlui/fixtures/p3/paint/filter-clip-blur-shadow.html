<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>paint: blurred and drop-shadowed children of overflow clips</title>
<style>
  html, body { margin: 0; }
  .clip { position: absolute; width: 60px; height: 60px; overflow: hidden; }
  .round { border-radius: 20px; }
  .fill { position: absolute; left: -10px; top: -10px; width: 80px; height: 80px; background-color: #e04020; }
  .bar { position: absolute; left: -10px; top: -26px; width: 80px; height: 16px; background-color: #e04020; }
  #a { left: 20px; top: 40px; }
  #a > .fill { filter: blur(3px); }
  #b { left: 100px; top: 40px; }
  #b > .bar { filter: drop-shadow(#2040e0 0px 30px 2px); }
  #c { left: 180px; top: 40px; }
  #c > .fill { left: -40px; top: 10px; width: 30px; height: 40px; filter: drop-shadow(#2040e0 44px 0px 3px); }
  #d { left: 260px; top: 40px; }
  #d > .fill { border: 10px solid #20a040; left: -10px; top: -10px; width: 60px; height: 60px; filter: blur(3px); }
  #e { left: 20px; top: 140px; }
  #e > .group { position: absolute; left: 0px; top: -30px; width: 60px; height: 90px; filter: brightness(0.5); }
  #e .bar { top: 4px; filter: drop-shadow(#2040e0 0px 30px 0px); }
  #f { left: 100px; top: 150px; width: 80px; height: 40px; border-radius: 16px; transform: rotate(90deg); }
  #f > .fill { width: 100px; height: 60px; filter: blur(2px); }
  #g { left: 180px; top: 140px; }
  #g > .own { position: absolute; left: 10px; top: 10px; width: 50px; height: 50px; border-radius: 12px; overflow: hidden; filter: blur(2px); }
  #g .fill { left: -10px; top: -10px; }
  #h { left: 260px; top: 140px; }
  #h > .clip { left: -10px; top: 10px; width: 80px; height: 40px; }
  #h .fill { filter: blur(3px); }
</style>
</head>
<body><div id="a" class="clip round"><div class="fill"></div></div><div id="b" class="clip round"><div class="bar"></div></div><div id="c" class="clip"><div class="fill"></div></div><div id="d" class="clip"><div class="fill"></div></div><div id="e" class="clip round"><div class="group"><div class="bar"></div></div></div><div id="f" class="clip"><div class="fill"></div></div><div id="g" class="clip round"><div class="own"><div class="fill"></div></div></div><div id="h" class="clip round"><div class="clip"><div class="fill"></div></div></div></body>
</html>
