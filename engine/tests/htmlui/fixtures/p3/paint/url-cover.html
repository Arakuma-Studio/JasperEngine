<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>paint: background-size: cover</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  .b { position: absolute; width: 100px; height: 70px; }
  #b1 { left: 10px; top: 10px; }
  #b2 { left: 120px; top: 10px; }
  #b3 { left: 230px; top: 10px; }
  #b4 { left: 340px; top: 10px; }
  .b { background-image: url(img/quad.png); background-size: cover; background-repeat: no-repeat; background-color: #dde6f5; }
  #b2 { width: 60px; height: 70px; }
  #b3 { background-position: right bottom; }
  #b4 { width: 60px; height: 70px; background-position: left center; }
</style>
</head>
<body><div class="b" id="b1"></div><div class="b" id="b2"></div><div class="b" id="b3"></div><div class="b" id="b4"></div></body>
</html>
