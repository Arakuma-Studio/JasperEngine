<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>paint: elliptical radii</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  div { position: absolute; background-color: #3366cc; }
  #a { left: 10px; top: 10px; width: 120px; height: 60px; border-radius: 40px / 20px; }
  #b { left: 150px; top: 10px; width: 150px; height: 80px; border-radius: 10px 30px 50px 70px / 20px; background-color: #cc3333; }
  #c { left: 10px; top: 90px; width: 100px; height: 60px; border-top-left-radius: 60px 20px; border-bottom-right-radius: 20px 50px; background-color: #339966; }
  #d { left: 150px; top: 110px; width: 120px; height: 50px; border-radius: 50px 10px / 15px 25px; border: 5px solid #222222; background-color: #f4c430; }
  #e { left: 10px; top: 170px; width: 100px; height: 40px; border-radius: 30px / 15px; border-style: solid; border-color: #cc3333 #3366cc #339966 #cc9933; border-width: 4px 12px 8px 2px; background-color: #eeeeee; }
  #f { left: 150px; top: 180px; width: 120px; height: 30px; border-radius: 20% / 50%; background-color: #663399; }
</style>
</head>
<body><div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div><div id="e"></div><div id="f"></div></body>
</html>
