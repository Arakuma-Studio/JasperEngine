<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>paint: visible children of hidden elements</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  div { box-sizing: border-box; }
  .hidden { visibility: hidden; width: 200px; height: 70px; margin: 10px; background-color: #cc3333; border: 4px solid #222222; padding: 8px; }
  .hidden > div { width: 80px; height: 40px; background-color: #3366cc; }
  .hidden > .shown { visibility: visible; margin-left: 90px; margin-top: -40px; background-color: #339966; }
  .collapse { visibility: collapse; width: 200px; height: 30px; margin: 10px; background-color: #cc3333; }
  .after { width: 200px; height: 30px; margin: 10px; background-color: #f4c430; }
</style>
</head>
<body><div class="hidden"><div></div><div class="shown"></div></div><div class="collapse"></div><div class="after"></div></body>
</html>
