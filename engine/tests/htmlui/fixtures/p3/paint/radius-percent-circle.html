<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>paint: percentage radii</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  div { position: absolute; background-color: #3366cc; }
  #a { left: 10px; top: 10px; width: 24px; height: 24px; border-radius: 50%; }
  #b { left: 50px; top: 10px; width: 60px; height: 60px; border-radius: 50%; background-color: #cc3333; }
  #c { left: 130px; top: 10px; width: 120px; height: 60px; border-radius: 50%; }
  #d { left: 270px; top: 10px; width: 40px; height: 100px; border-radius: 50%; background-color: #339966; }
  #e { left: 10px; top: 90px; width: 100px; height: 50px; border-radius: 10%; }
  #f { left: 130px; top: 90px; width: 100px; height: 50px; border-radius: 25% 50%; background-color: #cc9933; }
  #g { left: 10px; top: 160px; width: 80px; height: 40px; border-radius: 50%; border: 6px solid #222222; background-color: #f4c430; }
  #h { left: 130px; top: 160px; width: 100px; height: 30px; border-radius: 100%; border: 3px solid #cc3333; background-color: #ffffff; }
  #i { left: 250px; top: 130px; width: 60px; height: 60px; border-top-left-radius: 50%; border-bottom-right-radius: 25%; background-color: #663399; }
</style>
</head>
<body><div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div><div id="e"></div><div id="f"></div><div id="g"></div><div id="h"></div><div id="i"></div></body>
</html>
