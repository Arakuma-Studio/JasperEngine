<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>paint: a themed radio is a centered circle, its theme ignores the author's box styles</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  input { position: absolute; margin: 0; }
  #r1 { left: 10px; top: 10px; }
  #r2 { left: 40px; top: 10px; }
  #r3 { left: 70px; top: 10px; width: 30px; height: 20px; }
  #r4 { left: 110px; top: 10px; width: 30px; height: 30px; }
  #r5 { left: 150px; top: 10px; width: 20px; height: 13px; }
  #r6 { left: 180px; top: 10px; accent-color: #f0c040; }
  #r7 { left: 210px; top: 10px; }
  #r8 { left: 240px; top: 10px; width: 20px; height: 20px; background: #e02020; border: 3px solid #2040e0; border-radius: 2px; }
</style>
</head>
<body><input type="radio" id="r1"><input type="radio" id="r2" checked><input type="radio" id="r3"><input type="radio" id="r4" checked><input type="radio" id="r5" checked><input type="radio" id="r6" checked><input type="radio" id="r7" checked disabled><input type="radio" id="r8" checked></body>
</html>
