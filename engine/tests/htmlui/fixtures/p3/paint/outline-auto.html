<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>paint: outline-style: auto</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  div { position: absolute; width: 60px; height: 30px; background-color: #dde6f5; }
  #a { left: 20px; top: 20px; outline: auto; }
  #b { left: 120px; top: 20px; outline: auto 1px; }
  #c { left: 220px; top: 20px; outline: auto 5px; }
  #d { left: 20px; top: 90px; outline: auto #cc3333; }
  #e { left: 120px; top: 90px; outline: auto 1px #3366cc; outline-offset: 4px; }
  #f { left: 220px; top: 90px; outline: auto 6px #339966; }
  #g { left: 20px; top: 160px; outline: auto; border-radius: 10px; }
  #h { left: 120px; top: 160px; outline: auto #cc3333; border-radius: 50%; }
  #i { left: 220px; top: 160px; outline: auto; outline-offset: 3px; border: 2px solid #222222; }
  #j { left: 20px; top: 230px; outline: auto; background-color: #222222; }
  #k { left: 120px; top: 230px; outline: auto 2px; color: #cc3333; }
</style>
</head>
<body><div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div><div id="e"></div><div id="f"></div><div id="g"></div><div id="h"></div><div id="i"></div><div id="j"></div><div id="k"></div></body>
</html>
