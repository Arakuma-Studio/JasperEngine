<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>paint: overlapping radii</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  div { position: absolute; background-color: #3366cc; }
  #a { left: 10px; top: 10px; width: 100px; height: 50px; border-radius: 100px; }
  #b { left: 130px; top: 10px; width: 100px; height: 50px; border-radius: 150px 75px 0 0; background-color: #cc3333; }
  #c { left: 250px; top: 10px; width: 50px; height: 100px; border-radius: 40px 80px; background-color: #339966; }
  #d { left: 10px; top: 80px; width: 200px; height: 40px; border-radius: 0 0 300px 100px / 0 0 20px 10px; background-color: #cc9933; }
  #e { left: 10px; top: 140px; width: 80px; height: 40px; border-radius: 9999px; border: 4px solid #222222; background-color: #f4c430; }
  #f { left: 130px; top: 140px; width: 100px; height: 40px; border-radius: 100% 0; background-color: #663399; }
</style>
</head>
<body><div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div><div id="e"></div><div id="f"></div></body>
</html>
