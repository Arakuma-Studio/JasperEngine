<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>paint: box shadows of rounded boxes</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  div { position: absolute; background-color: #f4f4f4; }
  #a { left: 20px; top: 20px; width: 60px; height: 60px; border-radius: 50%; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6); }
  #b { left: 120px; top: 20px; width: 120px; height: 60px; border-radius: 50%; box-shadow: 0 0 0 6px #3366cc; }
  #c { left: 280px; top: 20px; width: 80px; height: 60px; border-radius: 40px / 20px; box-shadow: 6px 6px 0 0 #cc3333; }
  #d { left: 20px; top: 120px; width: 100px; height: 60px; border-radius: 30px / 10px; box-shadow: inset 0 0 0 6px #339966; }
  #e { left: 160px; top: 120px; width: 80px; height: 60px; border-radius: 50%; box-shadow: inset 4px 4px 6px rgba(0, 0, 0, 0.7), 0 0 10px 4px rgba(204, 51, 51, 0.8); }
  #f { left: 280px; top: 120px; width: 80px; height: 60px; border-radius: 4px 30px / 20px 4px; box-shadow: 0 0 0 10px #cc9933; }
</style>
</head>
<body><div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div><div id="e"></div><div id="f"></div></body>
</html>
