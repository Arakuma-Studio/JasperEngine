<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>integration: color-mix(currentcolor) in borders, outline and backgrounds while color transitions</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  .card { position: absolute; top: 15px; width: 90px; height: 60px; color: #1d4ed8; transition: color 1s linear;
          border: 4px solid color-mix(in srgb, currentcolor 60%, white);
          outline: 3px solid color-mix(in srgb, currentcolor, transparent 50%); outline-offset: 3px;
          background-color: color-mix(in srgb, currentcolor 15%, white); }
  .card.hot { color: #dc2626; }
  #a { left: 15px; }
  #b { left: 135px; border-radius: 12px; background-image: linear-gradient(currentcolor, color-mix(in oklab, currentcolor 30%, white)); }
  #c { left: 255px; border-style: dashed; box-shadow: 0 4px 10px color-mix(in srgb, currentcolor 50%, transparent); }
</style>
</head>
<body>
<div class="card" id="a"></div><div class="card" id="b"></div><div class="card" id="c"></div>
</body>
</html>
