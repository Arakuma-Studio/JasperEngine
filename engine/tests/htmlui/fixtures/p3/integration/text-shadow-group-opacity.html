<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>integration: text-shadow with group opacity</title>
<style>
  @font-face { font-family: "Roboto Fixture"; src: url("../../../fonts/Roboto-Regular-subset-post.ttf"); }
  html, body { margin: 0; background: #f8f9fa; font-family: "Roboto Fixture"; }
  .title { position: absolute; left: 10px; font-size: 28px; color: #ffffff; }
  #a { top: 10px; text-shadow: 2px 2px 0 #e63946, 4px 4px 0 #457b9d; opacity: 0.5; }
  #b { top: 55px; text-shadow: 0 0 6px #ff006e; opacity: 0.7; background: #1d3557; padding: 0 8px; border-radius: 6px; }
  .group { position: absolute; left: 230px; top: 10px; width: 110px; height: 80px; opacity: 0.6; background: #2a9d8f; }
  .group span { position: absolute; left: 8px; top: 20px; font-size: 22px; color: #ffffff; text-shadow: 3px 3px 2px #000000; }
  .group .over { position: absolute; left: 50px; top: 10px; width: 50px; height: 50px; background: #e9c46a; }
</style>
</head>
<body>
<div class="title" id="a">Victory</div>
<div class="title" id="b">Level 3</div>
<div class="group" id="g"><div class="over"></div><span id="s">Score</span></div>
</body>
</html>
