<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>integration: calc() grid tracks with var()</title>
<style>
  :root { --sidebar: 90px; --gap: 8px; --cols: 3; --row: 24px; font-size: 10px; }
  html, body { margin: 0; background: #ffffff; }
  .layout {
    display: grid; width: 460px; margin: 10px; gap: var(--gap);
    grid-template-columns: var(--sidebar) repeat(var(--cols), calc((100% - var(--sidebar) - var(--cols) * var(--gap)) / var(--cols)));
    grid-template-rows: calc(var(--row) * 2) minmax(calc(2em + 10px), auto) calc(var(--row) + 1.5rem);
    background: #e9ecf2;
  }
  .layout > div { background: #3d5a80; }
  .layout > .side { grid-row: 1 / -1; background: #ee6c4d; }
  .narrow { --sidebar: 40px; --cols: 4; --gap: calc(var(--row) / 6); width: 300px; }
  .clamp {
    display: grid; margin: 10px; width: 460px; column-gap: max(4px, 1vw);
    grid-template-columns: minmax(clamp(60px, 20%, 120px), 1fr) min(150px, 30%) max(50px, calc(10% + 2em));
    grid-auto-rows: var(--row);
  }
  .clamp > div { background: #98c1d9; }
  .clamp > div:nth-child(2n) { background: #293241; }
</style>
</head>
<body>
<div class="layout" id="a"><div class="side" id="a-side"></div><div id="a1"></div><div></div><div id="a3"></div><div></div><div></div><div></div><div id="a7"></div><div></div><div id="a9"></div></div>
<div class="layout narrow" id="b"><div class="side" id="b-side"></div><div id="b1"></div><div></div><div></div><div id="b4"></div><div></div><div></div><div></div><div id="b8"></div></div>
<div class="clamp" id="c"><div id="c1"></div><div id="c2"></div><div id="c3"></div><div></div><div></div><div id="c6"></div></div>
</body>
</html>
