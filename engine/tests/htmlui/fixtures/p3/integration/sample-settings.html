<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Settings</title>
<style>
  @font-face { font-family: "Game Sans"; src: url("../../../fonts/Roboto-Regular-subset-post.ttf"); }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Game Sans", Arial, sans-serif;
    font-size: 14px;
    background: #1a1a2e;
    color: #eaeaea;
  }

  .settings {
    max-width: 520px;
    margin: 20px auto;
    background: #16213e;
    border-radius: 10px;
    padding: 20px 24px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  h2 {
    margin: 0 0 14px;
    font-size: 20px;
    color: #e94560;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding-bottom: 8px;
  }

  .row {
    display: grid;
    grid-template-columns: 140px 1fr;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  label { color: #b8c1ec; }

  input[type="text"], select {
    width: 100%;
    padding: 6px 10px;
    border: 1px solid #0f3460;
    border-radius: 6px;
    background: #0f3460;
    color: #ffffff;
    font-family: inherit;
    font-size: 14px;
  }

  input[type="text"]:focus {
    outline: 2px solid #e94560;
    outline-offset: 1px;
  }

  input[type="range"] { width: 100%; accent-color: #e94560; }

  .checks { display: flex; gap: 16px; }

  .checks label { display: inline-flex; align-items: center; gap: 6px; }

  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 18px;
  }

  .btn {
    padding: 8px 18px;
    border: none;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }

  .btn-secondary { background: transparent; color: #b8c1ec; border: 1px solid #b8c1ec; }
  .btn-primary { background: #e94560; color: #ffffff; }
</style>
</head>
<body>
  <div class="settings">
    <h2>Settings</h2>
    <div class="row">
      <label for="name">Player name</label>
      <input type="text" id="name" value="Ranger">
    </div>
    <div class="row">
      <label for="quality">Graphics</label>
      <select id="quality">
        <option>Low</option>
        <option selected>High</option>
      </select>
    </div>
    <div class="row">
      <label for="volume">Volume</label>
      <input type="range" id="volume" min="0" max="100" value="70">
    </div>
    <div class="row">
      <span>Options</span>
      <div class="checks">
        <label><input type="checkbox" id="vsync" checked> V-Sync</label>
        <label><input type="checkbox" id="hints"> Hints</label>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" id="cancel">Cancel</button>
      <button class="btn btn-primary" id="save">Save</button>
    </div>
  </div>
</body>
</html>
