<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>integration: repeated SVG backgrounds</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  .t { position: absolute; width: 110px; height: 70px; background-image: url(img/tile.svg); }
  #whole { left: 10px; top: 10px; }
  #fraction { left: 130px; top: 10px; background-size: 13.5px 13.5px; }
  #offset { left: 250px; top: 10px; background-size: 17px 17px; background-position: 3.5px 2.25px; }
  #small { left: 10px; top: 90px; background-size: 7.25px 7.25px; }
  #round { left: 130px; top: 90px; background-size: 30px 30px; background-repeat: round; }
  #space { left: 250px; top: 90px; background-size: 26px 26px; background-repeat: space; }
  #x { left: 10px; top: 170px; background-size: 15.5px auto; background-repeat: repeat-x; background-position: 0 10px; }
  #cover { left: 130px; top: 170px; background-size: cover; background-repeat: no-repeat; }
  #rounded { left: 250px; top: 170px; background-size: 11px 11px; border-radius: 18px; }
</style>
</head>
<body>
<div class="t" id="whole"></div><div class="t" id="fraction"></div><div class="t" id="offset"></div>
<div class="t" id="small"></div><div class="t" id="round"></div><div class="t" id="space"></div>
<div class="t" id="x"></div><div class="t" id="cover"></div><div class="t" id="rounded"></div>
</body>
</html>
