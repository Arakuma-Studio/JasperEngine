<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid: a scrolled grid</title>
<style>
  html, body { margin: 0; }
  #g { position: absolute; left: 10px; top: 10px; width: 200px; height: 100px; overflow: hidden; display: grid;
       grid-template-columns: 1fr 1fr; grid-auto-rows: 40px; gap: 10px; padding: 5px; background-color: #dddddd; }
  #g > div { background-color: #5577aa; }
  #g > div:nth-child(2n) { background-color: #aa7755; }
  #g > #r3, #g > #r4 { background-color: #44aa44; }
</style>
</head>
<body>
<div id="g"><div id="r1"></div><div id="r2"></div><div id="r3"></div><div id="r4"></div><div id="r5"></div><div id="r6"></div><div id="r7"></div><div id="r8"></div></div>
</body>
</html>
