<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid: justify-self and align-self in each cell</title>
<style>
  html, body { margin: 0; }
  #g { position: absolute; left: 0; top: 0; display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 40px); gap: 2px; background-color: #cccccc; }
  #g > div { background-color: #3355aa; }
  .s { width: 20px; height: 12px; }
  #a1 { justify-self: start; align-self: start; }
  #a2 { justify-self: center; align-self: start; }
  #a3 { justify-self: end; align-self: start; }
  #b1 { justify-self: start; align-self: center; }
  #b2 { justify-self: stretch; align-self: center; height: 12px; }
  #b3 { justify-self: end; align-self: center; }
  #c1 { justify-self: start; align-self: end; }
  #c2 { justify-self: center; align-self: stretch; width: 20px; }
  #c3 { justify-self: end; align-self: end; }
</style>
</head>
<body>
<div id="g"><div id="a1" class="s"></div><div id="a2" class="s"></div><div id="a3" class="s"></div><div id="b1" class="s"></div><div id="b2"></div><div id="b3" class="s"></div><div id="c1" class="s"></div><div id="c2"></div><div id="c3" class="s"></div></div>
</body>
</html>
