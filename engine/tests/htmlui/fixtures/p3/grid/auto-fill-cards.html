<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid: repeat(auto-fill, minmax()) card grid</title>
<style>
  html, body { margin: 0; }
  #g { position: absolute; left: 5px; top: 5px; width: 290px; display: grid; gap: 10px;
       grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); grid-auto-rows: 40px; }
  #g > div { background-color: #4477aa; border: 2px solid #223355; }
</style>
</head>
<body>
<div id="g"><div id="c1"></div><div id="c2"></div><div id="c3"></div><div id="c4"></div><div id="c5"></div><div id="c6"></div><div id="c7"></div></div>
</body>
</html>
