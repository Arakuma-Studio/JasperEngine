<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid: repeat(auto-fit) collapses the empty tracks</title>
<style>
  html, body { margin: 0; }
  #a { position: absolute; left: 0; top: 0; width: 300px; display: grid; grid-template-columns: repeat(auto-fit, minmax(50px, 1fr)); grid-auto-rows: 30px; background-color: #dddddd; }
  #b { position: absolute; left: 0; top: 40px; width: 300px; display: grid; grid-template-columns: repeat(auto-fit, 50px); grid-auto-rows: 30px; justify-content: center; column-gap: 10px; background-color: #dddddd; }
  .item { background-color: #aa5500; }
  .other { background-color: #0055aa; }
</style>
</head>
<body>
<div id="a"><div id="a1" class="item"></div><div id="a2" class="other"></div></div>
<div id="b"><div id="b1" class="item"></div><div id="b2" class="other"></div></div>
</body>
</html>
