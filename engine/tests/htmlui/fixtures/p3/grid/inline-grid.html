<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid: inline-grid shrinks to fit on a line</title>
<style>
  html, body { margin: 0; }
  @font-face { font-family: "Ahem"; src: url("../../../fonts/Ahem.ttf") format("truetype"); }
  #line { position: absolute; left: 0; top: 0; width: 300px; font-family: "Ahem"; font-size: 10px; line-height: 1; color: #206020; }
  .ig { display: inline-grid; grid-template-columns: auto auto; gap: 2px; background-color: #ccccee; vertical-align: top; }
  .ig > div { height: 10px; background-color: #993333; }
</style>
</head>
<body>
<div id="line">XX<div id="ig1" class="ig"><div style="width: 20px;"></div><div style="width: 30px;"></div></div>XX<div id="ig2" class="ig"><div style="width: 10px;"></div><div style="width: 10px;"></div><div style="width: 40px;"></div></div>X</div>
</body>
</html>
