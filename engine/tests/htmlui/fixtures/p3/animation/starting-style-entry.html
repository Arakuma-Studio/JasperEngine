<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>animation: @starting-style entry transitions</title>
<style>
  html, body { margin: 0; }
  .panel { position: absolute; left: 40px; width: 200px; height: 50px; background-color: #2a7a4a; display: none; opacity: 1; }
  .panel.open { display: block; }
  #fade { top: 20px; transition: opacity 1s linear, width 1s linear; }
  #plain { top: 90px; transition: opacity 1s linear; }
  @starting-style {
    #fade.open { opacity: 0; width: 40px; }
  }
</style>
</head>
<body>
<div id="fade" class="panel"></div>
<div id="plain" class="panel"></div>
</body>
</html>
