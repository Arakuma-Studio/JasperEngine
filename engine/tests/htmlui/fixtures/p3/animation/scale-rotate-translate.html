<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>animation: individual transform properties</title>
<style>
  html, body { margin: 0; }
  div { position: absolute; top: 50px; width: 60px; height: 60px; background-color: #3060a0; }
  #card { left: 40px; scale: 1; transition: scale 1s linear, rotate 1s linear, translate 1s linear; }
  #card.on { scale: 1.5; rotate: 45deg; translate: 20px 10px; }
  #combined { left: 200px; translate: 10px 0px; rotate: 30deg; scale: 0.75; transform: translateX(20px); }
</style>
</head>
<body>
<div id="card"></div><div id="combined"></div>
</body>
</html>
