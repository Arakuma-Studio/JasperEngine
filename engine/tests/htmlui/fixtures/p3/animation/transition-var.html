<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>animation: transitions of var() and inherited values</title>
<style>
  html, body { margin: 0; }
  #parent { position: absolute; left: 0; top: 0; width: 400px; height: 140px; --w: 100px; color: #2040a0; }
  #box { position: absolute; left: 20px; top: 20px; width: var(--w); height: 40px; background-color: #a04080; transition: width 1s linear; }
  #inherits { position: absolute; left: 20px; top: 80px; width: 200px; height: 40px; background-color: currentColor; transition: color 1s linear; }
</style>
</head>
<body>
<div id="parent"><div id="box"></div><div id="inherits"></div></div>
</body>
</html>
