<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>animation: transitions of var() and inherited values</title>
<style>
  @font-face { font-family: "Ahem"; src: url("../../../fonts/Ahem.ttf") format("truetype"); }
  html, body { margin: 0; }
  #parent { position: absolute; left: 0; top: 0; width: 400px; height: 140px; --w: 100px; color: #2040a0; }
  #box { position: absolute; left: 20px; top: 20px; width: var(--w); height: 40px; background-color: #a04080; transition: width 1s linear; }
  /* (Ahem's glyphs are squares: the inherited color shows as a solid bar) */
  #inherits { position: absolute; left: 20px; top: 80px; font-family: "Ahem"; font-size: 40px; line-height: 1; transition: color 1s linear; }
</style>
</head>
<body>
<div id="parent"><div id="box"></div><div id="inherits">XXXXX</div></div>
</body>
</html>
