<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>animation: transitions of inline style changes</title>
<style>
  html, body { margin: 0; }
  #box { position: absolute; left: 20px; top: 20px; width: 100px; height: 40px; background-color: #208040; transition: width 1s linear, background-color 1s linear, margin-left 1s linear; }
  #attr { position: absolute; left: 20px; top: 80px; width: 60px; height: 40px; background-color: #804020; transition: width 1s linear; }
</style>
</head>
<body>
<div id="box"></div>
<div id="attr" style="width: 60px"></div>
</body>
</html>
