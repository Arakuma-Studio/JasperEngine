<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>layout: a select taller than its line centers its value and its arrow</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  @font-face { font-family: "Ahem"; src: url("../../../fonts/Ahem.ttf") format("truetype"); }
  body { font-family: "Ahem"; font-size: 10px; line-height: 1; color: #223344; }
  select { position: absolute; width: 90px; margin: 0; font-family: "Ahem"; font-size: 10px; color: #223344; }
  #a { left: 10px; top: 10px; }
  #b { left: 110px; top: 10px; height: 50px; }
  #c { left: 210px; top: 10px; height: 50px; padding: 10px 0 20px; }
  #d { left: 310px; top: 10px; min-height: 50px; }
  #e { left: 410px; top: 10px; height: 50px; font-size: 20px; }
  #f { left: 10px; top: 80px; height: 40px; border: 3px solid #557799; border-radius: 6px; background-color: #ffffff; }
  #line { position: absolute; left: 110px; top: 80px; width: 380px; background: #f4f4f4; }
  #line select { position: static; height: 40px; vertical-align: baseline; }
</style>
</head>
<body><select id="a"><option>XXX</option></select><select id="b"><option>XXX</option></select><select id="c"><option>XXX</option></select><select id="d"><option>XXX</option></select><select id="e"><option>XX</option></select><select id="f"><option>XX</option></select><div id="line">XX<select id="g"><option>XXXX</option></select>XX</div></body>
</html>
