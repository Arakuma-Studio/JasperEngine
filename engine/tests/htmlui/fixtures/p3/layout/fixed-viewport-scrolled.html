<!DOCTYPE html>
<html lang="en" id="doc">
<head>
<meta charset="utf-8">
<title>layout: position: fixed stays in the viewport while the page scrolls</title>
<style>
  html, body { margin: 0; }
  .s0 { background-color: #c8d4e8; } .s1 { background-color: #e8dcc8; } .s2 { background-color: #cfe8c8; } .s3 { background-color: #e8c8dc; }
  html { overflow: hidden; }
  #page > div { height: 90px; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 24px; background-color: #334466; }
  #badge { position: fixed; right: 12px; bottom: 10px; width: 40px; height: 30px; background-color: #aa3333; }
  #percent { position: fixed; left: 50%; top: 50%; width: 25%; height: 10%; background-color: #33aa55; }
</style>
</head>
<body>
<div id="page"><div class="s0" id="p0"></div><div class="s1" id="p1"></div><div class="s2" id="p2"></div><div class="s3" id="p3"></div><div class="s0" id="p4"></div><div class="s1" id="p5"></div></div>
<div id="bar"></div><div id="badge"></div><div id="percent"></div>
</body>
</html>
