<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>layout: position: sticky flex items</title>
<style>
  html, body { margin: 0; }
  .s0 { background-color: #c8d4e8; } .s1 { background-color: #e8dcc8; } .s2 { background-color: #cfe8c8; } .s3 { background-color: #e8c8dc; }
  #scroller { position: absolute; left: 20px; top: 15px; width: 180px; height: 110px; overflow: hidden; background-color: #eeeeee; }
  #columns { display: flex; align-items: flex-start; }
  #side { position: sticky; top: 10px; flex: none; width: 50px; height: 60px; background-color: #334466; }
  #main { flex: 1; }
  #main > div { height: 70px; }
  #column { display: flex; flex-direction: column; }
  #column > div { flex: none; height: 50px; }
  #column > #pinned { position: sticky; top: 0; height: 18px; background-color: #aa3333; }
</style>
</head>
<body>
<div id="scroller">
<div id="columns"><div id="side"></div><div id="main"><div class="s0"></div><div class="s1"></div><div class="s2"></div></div></div>
<div id="column"><div class="s3"></div><div id="pinned"></div><div class="s0"></div><div class="s1"></div><div class="s2"></div></div>
</div>
</body>
</html>
