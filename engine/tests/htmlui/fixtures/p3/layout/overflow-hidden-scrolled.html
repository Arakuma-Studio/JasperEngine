<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>layout: scrolled content at the clip edges of overflow: hidden</title>
<style>
  html, body { margin: 0; }
  .s0 { background-color: #c8d4e8; } .s1 { background-color: #e8dcc8; } .s2 { background-color: #cfe8c8; } .s3 { background-color: #e8c8dc; }
  #plain { position: absolute; left: 10px; top: 10px; width: 100px; height: 80px; overflow: hidden; background-color: #dddddd; }
  #padded { position: absolute; left: 130px; top: 10px; width: 100px; height: 80px; padding: 6px; overflow: hidden; background-color: #dddddd; }
  #bordered { position: absolute; left: 260px; top: 10px; width: 100px; height: 80px; padding: 6px; border: 4px solid #334466; overflow: hidden; background-color: #dddddd; }
  .content > div { height: 30px; }
  .content > .gap { height: 10px; background-color: transparent; }
</style>
</head>
<body>
<div id="plain"><div class="content"><div class="s0"></div><div class="gap"></div><div class="s1"></div><div class="gap"></div><div class="s2"></div><div class="gap"></div><div class="s3"></div><div class="gap"></div><div class="s0"></div><div class="gap"></div><div class="s1"></div></div></div>
<div id="padded"><div class="content"><div class="s0"></div><div class="gap"></div><div class="s1"></div><div class="gap"></div><div class="s2"></div><div class="gap"></div><div class="s3"></div><div class="gap"></div><div class="s0"></div><div class="gap"></div><div class="s1"></div></div></div>
<div id="bordered"><div class="content"><div class="s0"></div><div class="gap"></div><div class="s1"></div><div class="gap"></div><div class="s2"></div><div class="gap"></div><div class="s3"></div><div class="gap"></div><div class="s0"></div><div class="gap"></div><div class="s1"></div></div></div>
</body>
</html>
