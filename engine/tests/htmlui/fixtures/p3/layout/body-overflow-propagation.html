<!DOCTYPE html>
<html lang="en" id="doc">
<head>
<meta charset="utf-8">
<title>layout: the body's overflow is the viewport's</title>
<style>
  html, body { margin: 0; }
  .s0 { background-color: #c8d4e8; } .s1 { background-color: #e8dcc8; } .s2 { background-color: #cfe8c8; } .s3 { background-color: #e8c8dc; }
  body { overflow: hidden; height: 120px; background-color: #eeeeee; }
  #content > div { height: 80px; }
  #mark { position: absolute; left: 150px; top: 250px; width: 40px; height: 30px; background-color: #aa3333; }
</style>
</head>
<body>
<div id="content"><div class="s0" id="c0"></div><div class="s1" id="c1"></div><div class="s2" id="c2"></div><div class="s3" id="c3"></div><div class="s0" id="c4"></div></div>
<div id="mark"></div>
</body>
</html>
