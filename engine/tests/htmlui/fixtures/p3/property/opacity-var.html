<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>property: opacity: var() of an animated registered number</title>
<style>
  @property --ov-o { syntax: '<number>'; inherits: false; initial-value: 1; }
  @keyframes ov-fade { from { --ov-o: 1; } to { --ov-o: 0.2; } }
  html, body { margin: 0; background-color: #ffffff; }
  #fade { position: absolute; left: 20px; top: 20px; width: 100px; height: 80px; background-color: #3070e0;
          opacity: var(--ov-o); animation: ov-fade 2s linear forwards; }
  #toggle { position: absolute; left: 140px; top: 20px; width: 100px; height: 80px; background-color: #e05030;
            opacity: var(--ov-o); transition: --ov-o 1s linear; }
  #toggle.dim { --ov-o: 0; }
  #child-holder { position: absolute; left: 20px; top: 110px; width: 220px; height: 30px; background-color: #40a060; }
  #child { width: 100%; height: 100%; background-color: #202020; opacity: var(--ov-o, 0.5); }
</style>
</head>
<body>
<div id="fade"></div>
<div id="toggle"></div>
<div id="child-holder"><div id="child"></div></div>
</body>
</html>
