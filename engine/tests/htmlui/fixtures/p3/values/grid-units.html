<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>values: units and calc() in a grid</title>
<style>
  /* Track lists and gaps of a grid in vmin, vmax, ch, ex, the dynamic viewport units and calc()/min() of them
     (Ahem: 1ch = 1em, 1ex = 0.8em). The viewport is 400x300: 1vmin = 3px, 1vmax = 4px. */
  @font-face { font-family: "Ahem"; src: url("../../../fonts/Ahem.ttf") format("truetype"); }
  html, body { margin: 0; }
  body { font-family: "Ahem"; font-size: 10px; }
  #grid { display: grid; position: absolute; left: 10px; top: 10px; width: 380px;
          grid-template-columns: 10vmin 6ch calc(5ex + 2vmax) min(30%, 25dvw) 1fr;
          grid-auto-rows: 4ch calc(1vmin * 10);
          gap: 1ch 2vmin; }
  #grid > div { background: #3060a0; }
  #grid > div:nth-child(even) { background: #a06030; }
  #wide { grid-column: 2 / span 3; }
</style>
</head>
<body>
<div id="grid">
  <div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div><div id="e"></div>
  <div id="f"></div><div id="wide"></div><div id="g"></div>
</div>
</body>
</html>
