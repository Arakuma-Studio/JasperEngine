<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>values: colors</title>
<style>
  /* CSS Color 4 syntaxes and color-mix(): each swatch over a white and black split background, so the alpha shows. */
  html, body { margin: 0; }
  #bg { position: absolute; left: 0; top: 0; width: 400px; height: 180px; background: linear-gradient(to right, #ffffff 50%, #000000 50%); }
  .row { position: absolute; left: 0; width: 400px; height: 36px; }
  .row > div { position: absolute; top: 6px; width: 36px; height: 24px; }
  .row > div:nth-child(1) { left: 6px; }  .row > div:nth-child(2) { left: 46px; }  .row > div:nth-child(3) { left: 86px; }
  .row > div:nth-child(4) { left: 126px; } .row > div:nth-child(5) { left: 166px; } .row > div:nth-child(6) { left: 206px; }
  .row > div:nth-child(7) { left: 246px; } .row > div:nth-child(8) { left: 286px; } .row > div:nth-child(9) { left: 326px; }
  #r1 { top: 0; } #r2 { top: 36px; } #r3 { top: 72px; } #r4 { top: 108px; } #r5 { top: 144px; }
</style>
</head>
<body>
<div id="bg"></div>
<div class="row" id="r1">
  <div style="background-color: rgba(255, 0, 0, 0.5)"></div>
  <div style="background-color: rgba(0, 128, 0, 50%)"></div>
  <div style="background-color: rgb(0 0 255 / .25)"></div>
  <div style="background-color: rgb(100% 50% 0%)"></div>
  <div style="background-color: rgb(255 128 0 / 75%)"></div>
  <div style="background-color: RGB(10, 200, 100)"></div>
  <div style="background-color: #f80c"></div>
  <div style="background-color: #12345680"></div>
  <div style="background-color: rgb(none 200 none)"></div>
</div>
<div class="row" id="r2">
  <div style="background-color: hsl(120, 60%, 40%)"></div>
  <div style="background-color: hsla(200, 80%, 50%, 0.6)"></div>
  <div style="background-color: hsl(0.75turn 70% 60%)"></div>
  <div style="background-color: hsl(30deg 100% 50% / 0.4)"></div>
  <div style="background-color: hwb(200 10% 20%)"></div>
  <div style="background-color: hwb(0 40% 40% / 0.5)"></div>
  <div style="background-color: lab(55% 40 -60)"></div>
  <div style="background-color: lch(70% 50 120)"></div>
  <div style="background-color: oklch(0.6 0.15 30)"></div>
</div>
<div class="row" id="r3">
  <div style="background-color: oklab(0.7 -0.1 0.1)"></div>
  <div style="background-color: color(srgb 0.2 0.4 0.8)"></div>
  <div style="background-color: color-mix(in srgb, red, blue)"></div>
  <div style="background-color: color-mix(in srgb, red 25%, blue)"></div>
  <div style="background-color: color-mix(in oklab, #ff8000, #0080ff)"></div>
  <div style="background-color: color-mix(in hsl, red, blue)"></div>
  <div style="background-color: color-mix(in oklch longer hue, red, blue)"></div>
  <div style="background-color: color-mix(in srgb, red 30%, blue 30%)"></div>
  <div style="background-color: color-mix(in lch, #208020 60%, white)"></div>
</div>
<div class="row" id="r4">
  <div style="background-color: rebeccapurple"></div>
  <div style="background-color: cornflowerblue"></div>
  <div style="background-color: DarkSlateGray"></div>
  <div style="background-color: goldenrod"></div>
  <div style="background-color: mediumspringgreen"></div>
  <div style="background-color: lightcoral"></div>
  <div style="background-color: papayawhip"></div>
  <div style="background-color: transparent"></div>
  <div style="background-color: TOMATO"></div>
</div>
<div class="row" id="r5">
  <div style="border: 4px solid hsl(300 50% 50% / 0.5); width: 28px; height: 16px"></div>
  <div style="border: 4px solid color-mix(in srgb, teal, yellow); width: 28px; height: 16px"></div>
  <div style="box-shadow: 0 0 0 4px rgb(0 0 0 / 30%); background: oklch(0.8 0.1 200)"></div>
  <div style="opacity: 50%; background-color: crimson"></div>
</div>
</body>
</html>
