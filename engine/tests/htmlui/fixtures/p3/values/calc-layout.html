<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>values: calc() in layout</title>
<style>
  /* calc() of lengths and percentages in widths, heights, margins, paddings, insets and gaps, nested, with em, rem,
     vw, vh and vmin, resolved by the fork at layout time. */
  html { font-size: 10px; }
  html, body { margin: 0; }
  body { font-size: 12px; }
  #outer { position: relative; width: 360px; height: 240px; background: #eeeeee; }
  #a { width: calc(100% - 20px); height: calc(2em + 6px); margin-left: calc(5px + 0.5em); background: #3070b0; }
  #b { width: calc((100% - 3rem) / 2); padding: calc(1em / 2) calc(2% + 3px); margin-top: calc(1vh + 2px); background: #b07030; }
  #c { position: absolute; left: calc(50% + 10px); top: calc(100% - 50px); width: calc(25vw - 2vmin); height: calc(3em - 4px); background: #30a070; }
  #flex { display: flex; gap: calc(1em + 2px); margin-top: 8px; width: calc(100% - 2 * 15px); }
  #flex > div { flex: 1 1 calc(10% + 10px); height: 20px; background: #7040a0; }
  #nested { width: calc(calc(100% / 3) + calc(1rem * 2)); height: 12px; margin-top: 6px; background: #a03050; }
</style>
</head>
<body>
<div id="outer">
  <div id="a"></div>
  <div id="b"></div>
  <div id="flex"><div id="f1"></div><div id="f2"></div><div id="f3"></div></div>
  <div id="nested"></div>
  <div id="c"></div>
</div>
</body>
</html>
