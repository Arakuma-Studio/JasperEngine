<!DOCTYPE html>
<html>
<head>
<title>mix blend</title>
<style>
  body { margin: 0; }
  .back { position: absolute; left: 0; top: 0; width: 300px; height: 100px; background: #4080c0; }
  .s { position: absolute; top: 20px; width: 60px; height: 60px; background: #c08040; }
  #multiply { left: 20px; mix-blend-mode: multiply; }
  #plus { left: 120px; mix-blend-mode: plus-lighter; }
  #normal { left: 220px; }
</style>
</head>
<body><div class="back"></div><div class="s" id="multiply"></div><div class="s" id="plus"></div><div class="s" id="normal"></div></body>
</html>
