<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>perf list</title>
  <style>
    body { margin: 0; font-family: sans-serif; font-size: 14px; }
    #list { height: 600px; width: 360px; }
    .row { height: 48px; display: flex; align-items: center; gap: 8px; }
    .row img { width: 32px; height: 32px; }
    .msg { display: block; padding: 4px; }
  </style>
</head>
<body>
  <div data-model="perf">
    <list-view id="list" items="items" as="item, i" item-height="48" key="id">
      <template><div class="row"><img src="../common/checker.png"><span class="name">{{item.name}}</span><span class="level">{{item.level}}</span><span class="zone">{{item.zone}}</span></div></template>
    </list-view>
  </div>
  <list-view id="auto" item-height="auto" estimated-height="64" style="position: absolute; left: 400px; top: 0; height: 600px; width: 300px;">
    <template><div class="msg"><span class="text"></span></div></template>
  </list-view>
  <tree-view id="ptree" item-height="24" style="position: absolute; left: 720px; top: 0; height: 300px; width: 200px;">
    <template><div class="node"></div></template>
  </tree-view>
</body>
</html>
