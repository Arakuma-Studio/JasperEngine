<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>drag</title>
  <style>
    body { margin: 0; font-family: sans-serif; font-size: 14px; }
    .box { position: absolute; width: 100px; height: 60px; }
    #src { left: 10px; top: 10px; }
    #nope { left: 150px; top: 10px; }
    #bag { left: 300px; top: 10px; }
    #trash { left: 450px; top: 10px; }
    #slots { position: absolute; left: 10px; top: 120px; width: 200px; height: 200px; }
    .slot { height: 40px; }
  </style>
</head>
<body>
  <div id="src" class="box" draggable="true">Sword</div>
  <div id="nope" class="box">Nope</div>
  <div id="bag" class="box" dropzone="item move">Bag</div>
  <div id="trash" class="box">Trash</div>
  <div data-model="inv">
    <list-view id="slots" items="items" item-height="40" dropzone="item htmlui/row" key="id">
      <template><div class="slot" draggable="true">{{item.name}}</div></template>
    </list-view>
  </div>
</body>
</html>
