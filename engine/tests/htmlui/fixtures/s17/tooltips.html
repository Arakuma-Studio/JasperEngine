<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>tooltips</title>
  <style>
    body { margin: 0; font-family: sans-serif; font-size: 14px; }
    button { position: absolute; width: 100px; height: 30px; }
    #a { left: 20px; top: 20px; }
    #b { left: 200px; top: 20px; }
    #rich { position: absolute; left: 300px; top: 150px; width: 80px; height: 30px; }
    #quick { position: absolute; left: 20px; top: 150px; width: 80px; height: 30px; }
    #plain { position: absolute; left: 20px; top: 250px; width: 80px; height: 30px; }
    .tip-b { color: #aa0000; }
  </style>
</head>
<body>
  <button id="a" title="Alpha tip">A <span id="a-child">child</span></button>
  <button id="b" title="Beta">B</button>
  <div id="rich" tooltip="#tip">Rich</div>
  <div id="quick" title="Quick" tooltip-delay="100ms">Quick</div>
  <div id="plain">Plain</div>
  <template id="tip"><b class="tip-b">Rich tip</b></template>
</body>
</html>
