<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>drag</title>
  <style>
    body { margin: 0; font-family: sans-serif; font-size: 14px; color: #ffffff; }
    .box { position: absolute; width: 120px; height: 80px; background-color: #495057; }
    #src { left: 40px; top: 140px; background-color: #e8590c; }
    #yes { left: 260px; top: 60px; }
    #no { left: 260px; top: 220px; }
    .htmlui-drag-source { opacity: 0.4; }
    .box.htmlui-drop-allowed { background-color: #2f9e44; }
    .box.htmlui-drop-denied { background-color: #c92a2a; }
  </style>
</head>
<body>
  <div id="src" class="box" draggable="true">Sword</div>
  <div id="yes" class="box" dropzone="item">Takes items</div>
  <div id="no" class="box" dropzone="spell">Takes spells</div>
</body>
</html>
