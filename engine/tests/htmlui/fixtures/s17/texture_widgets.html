<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>texture widgets</title>
  <style>
    /* a TEXTURE-mode document (256 x 256) on a 2 x 2 wall: a title tooltip, a drag source, a
       drop zone and a list view, one per quadrant */
    body { margin: 0; width: 256px; height: 256px; font-family: sans-serif; font-size: 12px; color: #ffffff; }
    .q { position: absolute; width: 128px; height: 128px; }
    #tip { left: 0; top: 0; background-color: #c92a2a; }
    #src { left: 128px; top: 0; background-color: #e8590c; }
    #bin { left: 128px; top: 128px; background-color: #2f9e44; }
    #list { left: 0; top: 128px; background-color: #1c7ed6; }
    .row { height: 16px; }
  </style>
</head>
<body>
  <div id="tip" class="q" title="World tip">Tip</div>
  <div id="src" class="q" draggable="true">Drag</div>
  <div id="bin" class="q" dropzone="item">Bin</div>
  <list-view id="list" class="q" item-height="16">
    <template><div class="row"></div></template>
  </list-view>
</body>
</html>
