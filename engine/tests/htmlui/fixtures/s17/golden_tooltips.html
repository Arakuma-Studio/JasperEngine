<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>tooltips</title>
  <style>
    body { margin: 0; font-family: sans-serif; font-size: 12px; color: #ffffff; }
    .b { position: absolute; width: 70px; height: 24px; background-color: #3b5bdb; color: #ffffff; border: 0; }
    #tl { left: 0; top: 0; }
    #tr { right: 0; top: 0; }
    #bl { left: 0; bottom: 0; }
    #br { right: 0; bottom: 0; }
    #rich { position: absolute; left: 260px; top: 160px; width: 80px; height: 30px; background-color: #2b8a3e; }
    .card { width: 140px; }
    .card b { color: #ffd43b; }
  </style>
</head>
<body>
  <button id="tl" class="b" title="Top left corner tooltip">TL</button>
  <button id="tr" class="b" title="Top right corner tooltip">TR</button>
  <button id="bl" class="b" title="Bottom left corner tooltip">BL</button>
  <button id="br" class="b" title="Bottom right corner tooltip">BR</button>
  <div id="rich">Rich</div>
  <div id="card" class="card" hidden><b>Ember Blade</b><br>+12 fire damage</div>
</body>
</html>
