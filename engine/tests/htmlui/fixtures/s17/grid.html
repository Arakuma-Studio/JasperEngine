<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>grid</title>
  <style>
    body { margin: 0; font-family: sans-serif; font-size: 14px; }
    #grid { height: 300px; width: 400px; }
  </style>
</head>
<body>
  <div data-model="bag">
    <grid-view id="grid" items="slots" item-width="100" item-height="100">
      <template><div class="slot">{{item.name}}</div></template>
    </grid-view>
  </div>
</body>
</html>
