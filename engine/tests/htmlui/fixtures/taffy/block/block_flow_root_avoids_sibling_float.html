<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" type="text/css" href="../base.css">
  <title>
    Flow-root avoids sibling floats
  </title>
</head>
<body>

  <div style="display: block; float: left; width: 30px; height: 20px;"></div>

  </div>
</div>

</body>
</html>
