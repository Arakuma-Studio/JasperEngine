<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Play stop</title>
  <link rel="stylesheet" href="screen.css">
  <style>
    .glow { text-shadow: 0 0 8px rgba(124, 58, 237, 0.8); }
  </style>
</head>
<body>
  <div class="panel">
    <h1 class="glow">Play stop</h1>
    <button id="go" class="btn"><i data-lucide="play"></i> Go</button>
    <div id="clip" style="clip-path: circle(40%); background: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%228%22 height=%228%22%3E%3Crect width=%228%22 height=%228%22 fill=%22%23f00%22/%3E%3C/svg%3E');"></div>
  </div>
  <script type="text/lua">
    -- (a document script has its own environment: globals are set through _G)
    _G.playStopRuns = (_G.playStopRuns or 0) + 1
    document:getElementById("go"):addEventListener("click", function(event)
        _G.playStopClicks = (_G.playStopClicks or 0) + 1
    end)
    document:addEventListener("keydown", function(event) end)
    anime.animate("#go", { opacity = 0.5, duration = 400, loop = true,
                           onUpdate = function(animation) _G.playStopUpdates = (_G.playStopUpdates or 0) + 1 end })
  </script>
</body>
</html>
