<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>atlas regions: #xywh= and #sprite=</title>
  <style>
    body { margin: 0; background: transparent; }
    .row { position: absolute; left: 0; height: 64px; }
    .cell { position: absolute; top: 0; width: 64px; height: 64px; }
    img.cell { image-rendering: pixelated; }
    .bg { background-repeat: repeat; background-size: 16px 16px; image-rendering: pixelated; }
    .border { box-sizing: border-box; border: 16px solid transparent; image-rendering: pixelated; }
    .mask { background: #ff8000; mask-size: 64px 64px; mask-repeat: no-repeat; }
  </style>
</head>
<body>
  <div class="row" style="top: 20px; width: 640px">
    <img class="cell" style="left: 20px" src="images/atlas@16x16.png#xywh=16,0,16,16">
    <img class="cell" style="left: 100px" src="images/atlas@16x16.png#xywh=percent:0,50,50,50">
    <img class="cell" style="left: 180px" src="images/atlas@16x16.png#sprite=atlas_3">
  </div>
  <div class="row" style="top: 100px; width: 640px">
    <div class="cell bg" style="left: 20px; background-image: url('images/atlas@16x16.png#xywh=16,0,16,16')"></div>
    <div class="cell bg" style="left: 100px; background-image: url('images/atlas@16x16.png#xywh=percent:0,50,50,50')"></div>
    <div class="cell bg" style="left: 180px; background-image: url('images/atlas@16x16.png#sprite=atlas_3')"></div>
  </div>
  <div class="row" style="top: 180px; width: 640px">
    <div class="cell border" style="left: 20px; border-image: url('images/atlas@16x16.png#xywh=16,0,16,16') 4 fill / 16px"></div>
    <div class="cell border" style="left: 100px; border-image: url('images/atlas@16x16.png#xywh=percent:0,50,50,50') 4 fill / 16px"></div>
    <div class="cell border" style="left: 180px; border-image: url('images/atlas@16x16.png#sprite=atlas_3') 4 fill / 16px"></div>
  </div>
  <div class="row" style="top: 260px; width: 640px">
    <div class="cell mask" style="left: 20px; mask-image: url('images/atlas@16x16.png#xywh=16,0,16,16')"></div>
    <div class="cell mask" style="left: 100px; mask-image: url('images/atlas@16x16.png#xywh=percent:0,50,50,50')"></div>
    <div class="cell mask" style="left: 180px; mask-image: url('images/atlas@16x16.png#sprite=atlas_3')"></div>
  </div>
</body>
</html>
