<!DOCTYPE html>
<!-- Phase-6 cross-feature page (p6-accept): justified, indented, clamped text (P6-J1, P6-J2, P6-L1) and a paint
     effect in a texture-mode document (renderMode TEXTURE: its own context and target). TestPhase6Cross.cpp compares
     the document's texture with the same page drawn as a screen document of the same size. -->
<html><head><style>
  html, body { margin: 0; width: 320px; height: 200px; overflow: hidden; background: #101218; }
  .c { position: absolute; left: 10px; width: 140px; font-family: sans-serif; font-size: 11px; line-height: 14px; color: #f1c40f;
       text-align: justify; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .c span { color: #ecf0f1; }
  #a { top: 10px; text-indent: 20px; }
  #b { top: 50px; -webkit-line-clamp: 3; text-justify: inter-character; }
  #c { top: 120px; direction: rtl; text-shadow: 2px 2px 0 #c0392b; }
  #panel { position: absolute; left: 170px; top: 10px; width: 130px; padding: 8px; border-radius: 10px;
           background-image: effect(stripes, color-a #1d2b3a, color-b #2c3e50, speed 0); }
  #panel p { margin: 0; font-family: sans-serif; font-size: 11px; line-height: 14px; color: #ecf0f1; text-align: justify;
             display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
</style></head><body>
<div class="c" id="a">Indented pp <span>justified</span> text clamped to two lines and more</div>
<div class="c" id="b">Inter character justified pp text clamped to three lines with more after it</div>
<div class="c" id="c">Right to left pp <span>justified</span> text clamped to two lines</div>
<div id="panel"><p id="p">A panel with a paint effect behind a justified paragraph pp clamped to four lines, more words after the clamp</p></div>
</body></html>
