<!doctype html>
<html>
<head>
<title>text entry form</title>
<style>
body { margin: 0; }
input, textarea, button { display: block; margin: 0; width: 200px; height: 20px; }
</style>
</head>
<body>
<form id="form">
  <input id="name" enterkeyhint="next">
  <input id="mail" type="email" enterkeyhint="send" maxlength="32">
  <input id="code" type="number" min="0" enterkeyhint="done">
  <button id="check" type="button">Check</button>
  <textarea id="note"></textarea>
  <input id="short" maxlength="5">
  <input id="plain">
  <button id="send" type="submit">Send</button>
</form>
</body>
</html>
