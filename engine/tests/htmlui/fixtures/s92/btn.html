<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>S92: btn</title>
<!-- S92 R29 (docs/specs/S92-htmlui-render-cost.md): the port's .btn (widgets.css): a rounded box with a border and four gradient layers drawn by ::before, an outer box shadow and a drop-shadow filter, a label.
     Drawn at 1280x720, pixel ratio 1; #tick is the element another frame changes (the warm column). -->
<style>
  html, body { margin: 0; width: 1280px; height: 720px; font-family: sans-serif; color: #ffffff; }
  #tick { position: absolute; left: 1180px; top: 680px; font-size: 16px; }
  .btn { position: absolute; left: 100px; top: 100px; width: 320px; height: 120px; }
  .btn::before { content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 23px; border: 5px solid #000000; background-image: linear-gradient(to top, #1bb91e 8px, #1ec921 8px, #1ec921 9px, #22da23 9px, #22da23 10px, rgba(0, 0, 0, 0) 10px), linear-gradient(to right, #4ce333 1px, rgba(0, 0, 0, 0) 1px), linear-gradient(to left, #4ce333 1px, rgba(0, 0, 0, 0) 1px), linear-gradient(to bottom, #b7fd62 3px, #9dfb56 3px, #9dfb56 4px, #6af641 4px, #51f437 5px, #39ef2e 55px, #26eb26 105px);
                 box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3); filter: drop-shadow(0px 8px 0px rgba(0, 0, 0, 0.2)); }
  .btn .text { position: absolute; left: 0; right: 0; top: 40px; text-align: center; font-size: 32px; }
</style>
</head>
<body>
  <div class="btn"><div class="text">PLAY</div></div>
  <span id="tick">0</span>
</body>
</html>
