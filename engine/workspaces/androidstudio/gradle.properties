android.nonTransitiveRClass=false
android.useAndroidX=true
org.gradle.jvmargs=-Xmx1536m
org.gradle.warning.mode=all
# Downloads retry a one-off network failure (a 5xx, a reset, a timeout) up to 6 tries, pausing 2 s and
# doubling, and wait 60 s on a slow server (Gradle 9.6's defaults: 3 tries, 1 s, 30 s). Gradle reads them as
# system properties only: without systemProp. they do nothing.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
