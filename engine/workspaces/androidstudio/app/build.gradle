apply plugin: 'com.android.application'

// JASPERENGINE_PROJECT_ROOT (an absolute path) builds another project: tools/build.sh android's
// ANDROID_PROJECT, the test projects of tools/test-projects
def projectSourceRoot = System.getenv("JASPERENGINE_PROJECT_ROOT") ?: "../../../project"
def jasperengineRoot = "../../.."

def projectSourceRootAbs = file(projectSourceRoot).toString()
def jasperengineRootAbs = file(jasperengineRoot).toString()

// -PjasperPlayer=true: the prebuilt Android player (docs/specs/S30-shipping.md R13) instead of a
// game: JASPERENGINE_PLAYER=ON, no project assets, no ads SDK, and aapt2 writes the resource ids
// it gave (stable-ids.txt) so the editor's aapt2 link of a game gives the same ones
// (tools/players/android_player.sh collects the outputs)
def jasperPlayer = project.findProperty("jasperPlayer") == "true"
def jasperPlayerIds = layout.buildDirectory.file("jasperengine-player/stable-ids.txt").get().asFile

// The assets the APK packs: the project's, without the cooked textures desktop and web load
// (S14 R9: assets/je-cooked/<family>), synced into the build directory before every build
def jasperengineAssetsDir = layout.buildDirectory.dir("jasperengine-assets").get().asFile.toString()
tasks.register('jasperengineSyncAssets', Sync) {
    from(projectSourceRootAbs + '/assets') {
        exclude 'je-cooked/desktop/**', 'je-cooked/web/**'
    }
    into jasperengineAssetsDir
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'jasperengineSyncAssets' }

android {
    compileSdk 36
    // The NDK AGP 9.4.1 installs by default, pinned: its Clang (19) is above the C++20 floor
    // (engine/cmake/JasperEngineToolchain.cmake), and exports keep this line
    ndkVersion "28.2.13676358"
    defaultConfig {
        applicationId "com.yourcompany.project"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
        multiDexEnabled true // avoid error 'Cannot fit requested classes in a single dex file'
        externalNativeBuild {
            cmake {
                abiFilters "arm64-v8a"
                abiFilters "x86"
                abiFilters "armeabi-v7a"
                abiFilters "x86_64"
                // JASPERENGINE_ANDROID_ABIS (comma separated) builds only those: tools/build.sh
                // android's ANDROID_ABIS, x86_64 for tools/android-emulator-test.sh
                def onlyAbis = System.getenv("JASPERENGINE_ANDROID_ABIS")
                if (onlyAbis) {
                    abiFilters.clear()
                    abiFilters(*onlyAbis.split(","))
                }

                arguments "-DANDROID_STL=c++_shared"
                if (jasperPlayer) {
                    // 16 KB pages (Android 15): the editor's zipalign -P 16 keeps the alignment
                    arguments "-DJASPERENGINE_PLAYER=ON", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                } else {
                    arguments "-DPROJECT_ROOT="+projectSourceRootAbs
                }

                // CI and tools/build.sh set this to ccache.
                def launcher = System.getenv("CMAKE_CXX_COMPILER_LAUNCHER")
                if (launcher) {
                    arguments "-DCMAKE_C_COMPILER_LAUNCHER="+launcher, "-DCMAKE_CXX_COMPILER_LAUNCHER="+launcher
                }
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path jasperengineRootAbs+"/CMakeLists.txt"
        }
    }

    buildFeatures {
        prefab true
    }

    if (jasperPlayer) {
        androidResources {
            additionalParameters += ["--emit-ids", jasperPlayerIds.toString()]
        }
    }

    sourceSets {
        main {
            java.srcDirs = [jasperengineRootAbs+'/platform/android/java']
            if (jasperPlayer) {
                // a player has no ads (a project with AdMob compiles) and no content of its own:
                // the editor links the game's as assets/game
                res.srcDir jasperengineRootAbs+'/platform/android/player/res'
                assets.srcDirs = []
            } else {
                // the editor export drops this and the ads SDK below unless the project enables AdMob
                java.srcDir jasperengineRootAbs+'/platform/android/java-admob'
                // the project's assets without the cooked textures other platforms load (S14 R9)
                assets.srcDirs = [jasperengineAssetsDir,projectSourceRootAbs+'/lua']
            }
        }
    }

    namespace 'com.jaspergameengine.jasperengine'
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.games:games-activity:2.0.2"
    implementation "androidx.games:games-frame-pacing:2.0.0"
    if (!jasperPlayer) {
        implementation "com.google.android.gms:play-services-ads:22.6.0"
    }
}

if (jasperPlayer) {
    // the ids file's folder exists before aapt2 writes it
    tasks.matching { it.name == 'preBuild' }.configureEach { doFirst { jasperPlayerIds.parentFile.mkdirs() } }
}