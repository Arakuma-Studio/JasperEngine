<!DOCTYPE html>
<!-- text-entry-gamepad-cursor-back-button AC7, AC22: an e-mail field with a send key and a limit of
     5 characters, in the top-left corner: the gates' clicks and taps land at the centre, outside it -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Form</title>
  <style>
    body { position: absolute; left: 0; top: 0; width: 320px; height: 60px; margin: 0; }
    input { width: 300px; height: 40px; margin: 10px; font-size: 20px; }
  </style>
</head>
<body>
  <form id="form">
    <input id="email" type="email" enterkeyhint="send" maxlength="5">
  </form>
</body>
</html>
