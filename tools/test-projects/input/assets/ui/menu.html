<!DOCTYPE html>
<html>
<head>
<title>Replay menu</title>
<style>
    /* only the button takes input: the pointer-lock click and the scheme taps at the canvas centre pass */
    body { width: 100%; height: 100%; margin: 0; pointer-events: none; }
    #play {
        position: absolute; left: 40px; bottom: 40px; width: 220px; height: 80px;
        pointer-events: auto; background-color: #2f8f5b; color: #ffffff;
        font-size: 32px; line-height: 80px; text-align: center; border-radius: 8px;
    }
</style>
</head>
<body>
    <button id="play">Play</button>
</body>
</html>
