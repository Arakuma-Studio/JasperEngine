# Headless NVIDIA X screen for tools/gpu/xorg-headless.sh: no display device (nothing is
# scanned out), no input devices, no VT switching. The container it runs in has no /dev/tty*
# of the host and no /dev/input, so it cannot touch the host's console or desktop session.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "AutoAddGPU" "false"
    Option "AllowEmptyInput" "true"
    Option "DontVTSwitch" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Files"
    ModulePath "/nvidia-xorg"
    ModulePath "/usr/lib/xorg/modules"
EndSection

Section "Module"
    Load "glx"
EndSection

Section "Device"
    Identifier "nvidia"
    Driver "nvidia"
    Option "AllowEmptyInitialConfiguration" "true"
    Option "UseDisplayDevice" "none"
    Option "HardDPMS" "false"
EndSection

Section "Screen"
    Identifier "headless"
    Device "nvidia"
    DefaultDepth 24
    Option "UseDisplayDevice" "none"
    SubSection "Display"
        Depth 24
        Virtual 3840 2160
    EndSubSection
EndSection
